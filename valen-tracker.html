<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Valen — Combat Tracker</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0f;--card:rgba(20,18,15,0.85);--border:#2a2520;--gold:#e8c170;--text:#c8bfa9;--dim:#5a5040;--dim2:#3a3428;--red:#8b2020;--purple:#9860cc;--blue:#50a0dc;--green:#40cc80;--pink:#cc4060}
body{background:var(--bg);color:var(--text);font-family:'Crimson Text','Garamond','Georgia',serif;min-height:100vh;position:relative;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 20% 50%,rgba(40,10,20,0.5) 0%,transparent 60%),radial-gradient(ellipse at 80% 20%,rgba(15,10,35,0.4) 0%,transparent 50%),radial-gradient(ellipse at 50% 80%,rgba(20,5,10,0.3) 0%,transparent 60%);pointer-events:none;z-index:0}
.wrap{max-width:480px;margin:0 auto;padding:16px 16px 80px;position:relative;z-index:1}
.card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:12px;backdrop-filter:blur(10px)}
.card-label{font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:var(--dim);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.header{text-align:center;margin-bottom:20px;padding-top:12px}
h1{font-size:36px;font-weight:700;letter-spacing:4px;color:var(--gold);text-shadow:0 0 20px rgba(232,193,112,0.3);line-height:1.1}
.subtitle{font-size:12px;letter-spacing:3px;text-transform:uppercase;color:#7a6f5d;margin-top:4px}
.level-row{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px}
.level-row span{font-size:10px;color:var(--dim);letter-spacing:1.5px;text-transform:uppercase}
.lvl-btn{width:28px;height:28px;border-radius:50%;border:1px solid var(--dim2);background:transparent;color:var(--dim);font-size:11px;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s}
.lvl-btn.active{border:2px solid var(--gold);background:rgba(232,193,112,0.15);color:var(--gold)}
#levelBtns{
  display: flex;
  gap: 6px;
  flex-wrap: wrap;      /* optional, keeps it nice on small screens */
  justify-content: center;
}
.save-row{display:flex;justify-content:center;gap:8px;margin-top:10px}
.btn{padding:6px 12px;border-radius:4px;font-size:12px;font-family:inherit;cursor:pointer;transition:all 0.2s;white-space:nowrap;letter-spacing:0.5px;border:1px solid}
.btn-gold{background:rgba(232,193,112,0.1);border-color:rgba(232,193,112,0.27);color:var(--gold)}
.btn-blue{background:rgba(96,128,204,0.1);border-color:rgba(96,128,204,0.27);color:#6080cc}
.btn-brown{background:rgba(139,64,32,0.1);border-color:rgba(139,64,32,0.27);color:#8b4020}
.btn-red{background:rgba(139,32,32,0.1);border-color:rgba(139,32,32,0.27);color:var(--red)}
.btn-green{background:rgba(32,139,64,0.1);border-color:rgba(32,139,64,0.27);color:#208b40}
.btn-dim{background:transparent;border-color:var(--border);color:var(--dim);opacity:0.4;cursor:default}
.btn-sm{padding:3px 8px;font-size:10px}
.stats-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.stat-box{text-align:center;padding:10px 6px;background:var(--card);border:1px solid var(--border);border-radius:8px}
.stat-val{font-size:22px;font-weight:700;color:var(--gold);line-height:1}
.stat-lbl{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);margin-top:4px}
.hp-bar{width:100%;height:28px;background:#1a1510;border-radius:4px;overflow:hidden;position:relative;border:1px solid var(--border)}
.hp-fill{height:100%;position:absolute;left:0;top:0;transition:width 0.4s ease,background 0.4s ease;border-radius:3px}
.hp-temp{height:100%;position:absolute;top:0;transition:all 0.4s ease;border-radius:3px}
.hp-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:13px;font-weight:600;color:var(--gold);text-shadow:0 1px 3px rgba(0,0,0,0.8);white-space:nowrap}
.hp-controls{display:flex;gap:6px;margin-top:8px;align-items:center}
.hp-input{flex:1;background:#1a1510;border:1px solid var(--border);border-radius:4px;color:var(--text);padding:6px 10px;font-size:14px;font-family:inherit;outline:none;text-align:center}
.quick-btns{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.temp-row{display:flex;gap:6px}
.wide-btn{padding:10px 14px;border-radius:6px;font-size:12px;font-family:inherit;cursor:pointer;transition:all 0.2s;text-align:left;width:100%;display:flex;align-items:center;gap:8px;letter-spacing:0.5px;border:1px solid var(--dim2);background:transparent;color:#8a7f6d}
.wide-btn.active{border-color:var(--purple);color:var(--purple);background:rgba(152,96,204,0.1)}
.wide-btn.active-blue{border-color:var(--blue);color:var(--blue);background:rgba(80,160,220,0.1)}
.wide-btn.dim{opacity:0.35;cursor:default;border-color:var(--border);color:var(--dim2)}
.wide-btn .title{font-weight:600}
.wide-btn .sub{font-size:10px;opacity:0.7}
.prompt{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:6px;margin-top:8px}
.prompt input{flex:1;background:#1a1510;border-radius:4px;color:var(--text);padding:4px 8px;font-size:13px;font-family:inherit;outline:none;text-align:center;width:60px;max-width:80px}
.prompt label{font-size:11px;white-space:nowrap;letter-spacing:0.5px}
.slot-dot{width:20px;height:20px;border-radius:50%;cursor:pointer;transition:all 0.2s}
.slot-dot.full{border:2px solid var(--gold);background:rgba(232,193,112,0.2);box-shadow:0 0 8px rgba(232,193,112,0.15)}
.slot-dot.empty{border:2px solid var(--dim2);background:transparent}
.conc-banner{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:rgba(180,140,60,0.08);border:1px solid rgba(180,140,60,0.2);border-radius:6px;margin-bottom:12px}
.conc-banner span{font-size:12px;color:#b48c3c;letter-spacing:1px}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:12px;font-size:10px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;transition:all 0.2s;user-select:none;border:1px solid}
.effects{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.spell-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.round-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;background:rgba(232,193,112,0.08);border:1px solid var(--border);border-radius:12px;font-size:11px;color:var(--gold)}
.log-entry{padding:4px 0;border-bottom:1px solid #1a1815;font-size:12px;color:#7a6f5d;line-height:1.4}
.rest-row{display:flex;gap:8px;margin-bottom:12px}
.rest-row .wide-btn{justify-content:center}
.flash{animation:flash 0.4s ease}
@keyframes flash{0%{text-shadow:0 0 12px var(--gold)}100%{text-shadow:none}}
.below-half{font-size:10px;color:#cc4040;margin-top:4px;letter-spacing:1px}
.dmg-ref{font-size:12px;line-height:1.8;color:#8a7f6d}
.dmg-ref strong{color:var(--gold)}
.hidden{display:none}
</style>
</head>
<body>
<div class="wrap">

<!-- HEADER -->
<div class="header">
<h1>VALEN</h1>
<div class="subtitle">Dhampir Undead Warlock · Haunted One</div>
<div class="level-row"><span>Lvl</span><div id="levelBtns"></div></div>
<div class="save-row">
<button class="btn btn-gold" style="display:flex;align-items:center;gap:4px;font-size:11px" onclick="saveState()" id="saveBtn">💾 Save</button>
<button class="btn btn-blue" style="font-size:11px" onclick="loadState()">Load</button>
<button class="btn btn-brown" style="font-size:11px" onclick="clearAndReset()">Clear</button>
</div>
</div>

<!-- STATS -->
<div class="stats-row">
<div class="stat-box"><div class="stat-val" id="acVal"></div><div class="stat-lbl">🛡 AC</div></div>
<div class="stat-box"><div class="stat-val" id="dcVal"></div><div class="stat-lbl">Spell DC</div></div>
<div class="stat-box"><div class="stat-val" id="saVal"></div><div class="stat-lbl">Spell Atk</div></div>
</div>

<!-- COMBAT -->
<div id="combatSection"></div>

<!-- HP -->
<div class="card">
<div class="card-label">❤ Hit Points</div>
<div class="hp-bar">
<div class="hp-fill" id="hpFill"></div>
<div class="hp-temp" id="hpTemp"></div>
<div class="hp-text" id="hpText"></div>
</div>
<div id="belowHalf" class="below-half hidden"></div>
<div class="hp-controls">
<input class="hp-input" type="number" placeholder="±HP" id="hpDelta" onkeydown="if(event.key==='Enter')doHP()">
<button class="btn btn-gold" onclick="doHP()">Apply</button>
</div>
<div class="hp-controls">
<input class="hp-input" type="number" min="1" placeholder="Max HP" id="maxHpInput" onkeydown="if(event.key==='Enter')setMaxHp()">
<button class="btn btn-blue" onclick="setMaxHp()">Set Max</button>
</div>
<div class="quick-btns">
<button class="btn btn-red" onclick="applyDmg(1)">-1</button>
<button class="btn btn-red" onclick="applyDmg(5)">-5</button>
<button class="btn btn-red" onclick="applyDmg(10)">-10</button>
<button class="btn btn-red" onclick="applyDmg(15)">-15</button>
<button class="btn btn-red" onclick="applyDmg(20)">-20</button>
<button class="btn btn-green" style="margin-left:auto" onclick="applyHeal(5)">+5</button>
<button class="btn btn-green" onclick="applyHeal(10)">+10</button>
</div>
</div>

<!-- CONDITIONS -->
<div class="card">
<div style="display:flex;justify-content:space-between;align-items:center">
<div class="card-label" style="margin-bottom:0">Conditions <span style="font-size:9px;color:#3a3428;font-style:italic;letter-spacing:0.5px">tap to toggle</span></div>
<button class="btn btn-sm" id="condToggleBtn" onclick="toggleConditionsPanel()" style="padding:2px 8px">Hide</button>
</div>
<div id="condBody" style="margin-top:8px">
<div class="effects" id="condTags"></div>
<div id="condInfo" style="margin-top:8px;font-size:11px;color:#8a7f6d"></div>
</div>
</div>

<!-- TEMP HP SOURCES -->
<div class="card">
<div class="card-label">🛡 Temp HP Sources</div>
<div class="temp-row">
<button class="wide-btn" id="formBtn" onclick="activateForm()">
<span style="font-size:16px">💀</span>
<div style="flex:1"><div class="title">Form of Dread</div><div class="sub" id="formSub"></div></div>
</button>
<button class="wide-btn" id="agBtn" onclick="castAgathys()">
<span style="font-size:16px">❄</span>
<div style="flex:1"><div class="title">Armor of Agathys</div><div class="sub" id="agSub"></div></div>
</button>
</div>
<div id="formPrompt" class="hidden"></div>
<div id="tempStatus" style="margin-top:8px;font-size:11px" class="hidden"></div>
</div>

<!-- SPELL SLOTS -->
<div class="card">
<div style="display:flex;justify-content:space-between;align-items:center">
<div class="card-label" id="slotLabel"></div>
<div style="display:flex;gap:8px" id="slotDots"></div>
</div>
</div>

<!-- HIT DICE -->
<div class="card">
<div style="display:flex;justify-content:space-between;align-items:center">
<div class="card-label" id="hdLabel"></div>
<div style="display:flex;gap:8px" id="hdDots"></div>
</div>
</div>

<!-- CONCENTRATION -->
<div id="concBanner" class="hidden"></div>

<!-- ACTIVE EFFECTS -->
<div class="card">
<div class="card-label">Active Effects <span style="font-size:9px;color:#3a3428;font-style:italic;letter-spacing:0.5px">tap to toggle</span></div>
<div class="effects" id="effectTags"></div>
</div>

<!-- SPELLS & ACTIONS -->
<div class="card">
<div class="card-label">⚡ Actions & Spells</div>
<div class="spell-grid" id="spellGrid"></div>
<div id="mirrorDestroy" class="hidden" style="margin-top:6px"></div>
</div>

<!-- DEATH PREVENTION -->
<div class="card" id="deathCard" class="hidden">
<div class="card-label">💀 Death Prevention</div>
<div id="deathContent"></div>
</div>

<!-- DAMAGE REFERENCE -->
<div class="card">
<div class="card-label">⚡ Damage Reference</div>
<div class="dmg-ref" id="dmgRef"></div>
</div>

<!-- RESTS -->
<div class="rest-row">
<button class="wide-btn" style="justify-content:center" onclick="shortRest()">☽ Short Rest</button>
<button class="wide-btn" style="justify-content:center" onclick="longRest()">🌙 Long Rest</button>
</div>

<!-- LOG -->
<div class="card" style="max-height:200px;overflow:hidden">
<div class="card-label">Combat Log</div>
<div id="logBox" style="max-height:160px;overflow-y:auto;scroll-behavior:smooth"></div>
</div>

</div>

<script>
const LD={1:{hp:8,sl:1,slv:1,pb:2,ch:3,bm:1,fu:2,at:5,ad:5,ft:"1d6+1",dc:13,sa:5},2:{hp:12,sl:2,slv:1,pb:2,ch:3,bm:1,fu:2,at:5,ad:5,ft:"1d6+1",dc:13,sa:5},3:{hp:16,sl:2,slv:2,pb:2,ch:3,bm:1,fu:2,at:10,ad:10,ft:"1d8+1",dc:13,sa:5},4:{hp:20,sl:2,slv:2,pb:2,ch:4,bm:1,fu:2,at:10,ad:10,ft:"1d8+1",dc:14,sa:6},5:{hp:24,sl:2,slv:3,pb:3,ch:4,bm:2,fu:3,at:15,ad:15,ft:"1d10+5",dc:14,sa:6},6:{hp:28,sl:2,slv:3,pb:3,ch:4,bm:2,fu:3,at:15,ad:15,ft:"1d10+6",dc:14,sa:6},7:{hp:32,sl:2,slv:4,pb:3,ch:4,bm:2,fu:3,at:20,ad:20,ft:"1d10+7",dc:14,sa:6},8:{hp:36,sl:2,slv:4,pb:3,ch:5,bm:3,fu:3,at:20,ad:20,ft:"1d10+8",dc:15,sa:7},9:{hp:40,sl:2,slv:5,pb:4,ch:5,bm:3,fu:4,at:25,ad:25,ft:"1d10+9",dc:15,sa:7},10:{hp:40,sl:2,slv:5,pb:4,ch:5,bm:3,fu:4,at:25,ad:25,ft:"1d10+10",dc:15,sa:7}};
const SK="valen-state";
const SK_CACHE="valen-state-cache";
const CONDITIONS=[
  {k:"blinded",n:"Blinded",d:"Can't see, auto-fail sight checks; attacks vs you have advantage, your attacks have disadvantage."},
  {k:"charmed",n:"Charmed",d:"Can't attack charmer or target it with harmful effects; charmer has advantage on social checks vs you."},
  {k:"deafened",n:"Deafened",d:"Can't hear; auto-fail hearing checks."},
  {k:"frightened",n:"Frightened",d:"Disadvantage on checks/attacks while source is in sight; can't willingly move closer to source."},
  {k:"grappled",n:"Grappled",d:"Speed becomes 0; ends if grappler is incapacitated or removed from reach."},
  {k:"incapacitated",n:"Incapacitated",d:"Can't take actions or reactions."},
  {k:"invisible",n:"Invisible",d:"Can't be seen without special sense/magic; counts as heavily obscured. Attacks vs you disadvantage, your attacks advantage."},
  {k:"paralyzed",n:"Paralyzed",d:"Incapacitated, can't move/speak, auto-fail STR/DEX saves; attacks vs you advantage; hits within 5 ft are crits."},
  {k:"petrified",n:"Petrified",d:"Transformed inanimate; incapacitated and unaware, resist all damage, immune poison/disease."},
  {k:"poisoned",n:"Poisoned",d:"Disadvantage on attack rolls and ability checks."},
  {k:"prone",n:"Prone",d:"Only crawl unless stand; attacks vs you advantage within 5 ft, otherwise disadvantage; your attacks disadvantage."},
  {k:"restrained",n:"Restrained",d:"Speed 0; attacks vs you advantage, your attacks disadvantage; disadvantage on DEX saves."},
  {k:"stunned",n:"Stunned",d:"Incapacitated, can't move, speak falteringly, auto-fail STR/DEX saves; attacks vs you advantage."},
  {k:"unconscious",n:"Unconscious",d:"Incapacitated, can't move/speak, unaware; drop prone/items; auto-fail STR/DEX saves; attacks vs you advantage, 5 ft hits are crits."}
];

// STATE
let S={level:2,maxHp:8,hp:8,tmp:0,tmpSrc:null,slU:0,slSpent:[false,false],hdU:0,hdSpent:[false,false],cond:{},condOpen:true,fmA:false,fmU:0,fmR:0,conc:null,mirI:0,mirR:0,aos:true,hexA:false,som:false,somR:0,dw:false,nh:false,gi:false,giR:0,bite:false,gg:false,rnd:0,combat:false,log:[]};

function D(){return LD[S.level];}
function normalizeState(){
  if(!Number.isFinite(S.maxHp) || S.maxHp < 1) S.maxHp = 8;
  S.maxHp = Math.floor(S.maxHp);
  S.hp = Number.isFinite(S.hp) ? Math.max(0, Math.min(S.hp, S.maxHp)) : S.maxHp;
  const slotTotal = D().sl;
  if(!Array.isArray(S.slSpent)){
    const used = (!Number.isFinite(S.slU) || S.slU < 0) ? 0 : Math.min(Math.floor(S.slU), slotTotal);
    S.slSpent = Array.from({length:slotTotal}, (_,i)=>i<used);
  }
  S.slSpent = S.slSpent.map(v=>!!v);
  if(S.slSpent.length<slotTotal) S.slSpent = S.slSpent.concat(Array(slotTotal-S.slSpent.length).fill(false));
  if(S.slSpent.length>slotTotal) S.slSpent = S.slSpent.slice(0,slotTotal);
  S.slU = S.slSpent.filter(Boolean).length;
  if(!Array.isArray(S.hdSpent)){
    const used = (!Number.isFinite(S.hdU) || S.hdU < 0) ? 0 : Math.min(Math.floor(S.hdU), S.level);
    S.hdSpent = Array.from({length:S.level}, (_,i)=>i<used);
  }
  S.hdSpent = S.hdSpent.map(v=>!!v);
  if(S.hdSpent.length<S.level) S.hdSpent = S.hdSpent.concat(Array(S.level-S.hdSpent.length).fill(false));
  if(S.hdSpent.length>S.level) S.hdSpent = S.hdSpent.slice(0,S.level);
  S.hdU = S.hdSpent.filter(Boolean).length;
  if(!S.cond || typeof S.cond!=="object") S.cond={};
  const nextCond={};
  CONDITIONS.forEach(c=>{nextCond[c.k]=!!S.cond[c.k];});
  S.cond=nextCond;
  if(typeof S.condOpen!=="boolean") S.condOpen=true;
}
function toggleSpellSlot(i){
  const total=D().sl;
  if(i<0 || i>=total) return;
  if(!Array.isArray(S.slSpent)) S.slSpent=Array(total).fill(false);
  S.slSpent[i]=!S.slSpent[i];
  S.slU=S.slSpent.filter(Boolean).length;
  render();
}
function spendSpellSlot(){
  const total=D().sl;
  if(!Array.isArray(S.slSpent)) S.slSpent=Array(total).fill(false);
  const idx=S.slSpent.findIndex(v=>!v);
  if(idx<0) return false;
  S.slSpent[idx]=true;
  S.slU=S.slSpent.filter(Boolean).length;
  return true;
}
function toggleCondition(k){
  S.cond[k]=!S.cond[k];
  render();
}
function toggleConditionsPanel(){
  S.condOpen=!S.condOpen;
  render();
}
function cacheState(){
  try{
    localStorage.setItem(SK_CACHE, JSON.stringify({
      version: 1,
      timestamp: new Date().toISOString(),
      state: S
    }));
  }catch(e){}
}
function loadCachedState(){
  try{
    const raw = localStorage.getItem(SK_CACHE);
    if(!raw) return false;
    const data = JSON.parse(raw);
    if(!data.state || typeof data.state !== "object") return false;
    Object.assign(S, data.state);
    normalizeState();
    return true;
  }catch(e){
    return false;
  }
}

// SAVE/LOAD
async function saveState(){
  try{
    const payload = {
      version: 1,
      timestamp: new Date().toISOString(),
      state: S
    };

    if(window.showSaveFilePicker){
      const handle = await window.showSaveFilePicker({
        id: "valen-state-file",
        suggestedName: "valen-state.json",
        types: [{ description: "JSON", accept: { "application/json": [".json"] } }]
      });
      const writable = await handle.createWritable();
      await writable.write(JSON.stringify(payload, null, 2));
      await writable.close();
    }else{
      const blob = new Blob(
        [JSON.stringify(payload, null, 2)],
        { type: "application/json" }
      );
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "valen-state.json";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    const b=document.getElementById("saveBtn");
    b.textContent="Saved!";
    b.style.color="#40cc80";
    setTimeout(()=>{
      b.textContent="Save";
      b.style.color="";
    },1200);
  }catch(e){
    if(e && e.name==="AbortError") return;
    console.error("Save failed:", e);
  }
}
async function loadState(){
  try{
    let file;
    if(window.showOpenFilePicker){
      const [handle] = await window.showOpenFilePicker({
        id: "valen-state-file",
        multiple: false,
        types: [{ description: "JSON", accept: { "application/json": [".json"] } }]
      });
      file = await handle.getFile();
    }else{
      const input = document.getElementById("loadFileInput");
      file = await new Promise((resolve) => {
        input.onchange = () => {
          const f = input.files[0];
          input.value = "";
          resolve(f || null);
        };
        input.click();
      });
      if(!file) return;
    }

    const text = await file.text();
    const data = JSON.parse(text);

    if(!data.state || typeof data.state !== "object"){
      throw new Error("Invalid save file");
    }

    Object.assign(S, data.state);
    normalizeState();
    render();
    addLog("State loaded from file.");
  }catch(e){
    if(e && e.name==="AbortError") return;
    console.error("Load failed:", e);
    alert("Failed to load save file.");
  }
}
async function clearAndReset(){
  try{
    localStorage.removeItem(SK);
    localStorage.removeItem(SK_CACHE);
  }catch(e){}
  S.maxHp=8;
  resetToLevel(S.level);addLog("Save cleared.");
}

// LOGGING
function addLog(m){S.log.unshift({m,t:Date.now()});if(S.log.length>50)S.log.length=50;renderLog();}
function renderLog(){
  const box=document.getElementById('logBox');
  if(!S.log.length){box.innerHTML='<div style="font-size:11px;color:#3a3428;font-style:italic">No actions yet...</div>';return;}
  box.innerHTML=S.log.map((e,i)=>`<div class="log-entry" style="opacity:${i===0?1:Math.max(0.3,1-i*0.08)}">${e.m}</div>`).join('');
}

// RESET
function resetToLevel(nl){
  const maxHp=(Number.isFinite(S.maxHp)&&S.maxHp>0)?Math.floor(S.maxHp):8;
  S={level:nl,maxHp,hp:maxHp,tmp:0,tmpSrc:null,slU:0,slSpent:Array(LD[nl].sl).fill(false),hdU:0,hdSpent:Array(nl).fill(false),cond:{},condOpen:true,fmA:false,fmU:0,fmR:0,conc:null,mirI:0,mirR:0,aos:nl>=2,hexA:false,som:false,somR:0,dw:false,nh:nl>=10,gi:false,giR:0,bite:false,gg:false,rnd:0,combat:false,log:[]};
  normalizeState();
  render();addLog("Level set to "+nl);
}

// DAMAGE
function applyDmg(amt){
  if(amt<=0)return;let rem=amt,tL=0,hL=0,retl=false;
  if(S.tmp>0){tL=Math.min(S.tmp,rem);rem-=tL;if(S.tmpSrc==="agathys")retl=true;S.tmp-=tL;if(S.tmp===0)S.tmpSrc=null;}
  if(rem>0){hL=rem;S.hp=Math.max(0,S.hp-rem);}
  let m=`Took ${amt} damage`;if(tL>0)m+=` (${tL} absorbed by temp HP)`;if(hL>0)m+=` (${hL} to HP)`;if(retl)m+=` ❄️ Agathys retaliates for ${D().ad} cold!`;
  addLog(m);render();
}
function applyHeal(amt){if(amt<=0)return;const h=Math.min(amt,S.maxHp-S.hp);S.hp=Math.min(S.maxHp,S.hp+h);addLog(`Healed ${h} HP`);render();}
function doHP(){const v=parseInt(document.getElementById('hpDelta').value);if(isNaN(v)||v===0)return;if(v<0)applyDmg(Math.abs(v));else applyHeal(v);document.getElementById('hpDelta').value='';render();}
function setMaxHp(){
  const v=parseInt(document.getElementById('maxHpInput').value,10);if(isNaN(v)||v<1)return;
  const old=S.maxHp;
  S.maxHp=v;
  S.hp=Math.min(S.hp,S.maxHp);
  addLog(`Max HP set to ${S.maxHp}${S.maxHp<old?' (HP clamped)':''}.`);
  render();
}
function toggleHitDie(i){
  if(i<0 || i>=S.level) return;
  S.hdSpent[i]=!S.hdSpent[i];
  S.hdU=S.hdSpent.filter(Boolean).length;
  render();
}
// FORM OF DREAD
function activateForm(){
  if(S.fmU>=D().fu){addLog("No Form of Dread uses left!");return;}
  if(S.fmA){addLog("Already active!");return;}
  showFormPrompt();
}
function showFormPrompt(){
  const el=document.getElementById('formPrompt');
  el.className='prompt';el.style.background='rgba(152,96,204,0.04)';el.style.border='1px solid rgba(152,96,204,0.2)';
  el.innerHTML=`<label style="color:#9860cc">Rolled temp HP (${D().ft}):</label><input type="number" placeholder="e.g. 8" id="formInput" style="border:1px solid rgba(152,96,204,0.2)" onkeydown="if(event.key==='Enter')confirmForm()"><button class="btn" style="padding:4px 10px;background:rgba(152,96,204,0.1);border-color:rgba(152,96,204,0.27);color:#9860cc;font-size:11px" onclick="confirmForm()">OK</button><button class="btn btn-dim" style="padding:4px 6px;font-size:11px" onclick="hideFormPrompt()">✕</button>`;
  setTimeout(()=>{const inp=document.getElementById('formInput');if(inp)inp.focus();},50);
}
function hideFormPrompt(){document.getElementById('formPrompt').className='hidden';}
function confirmForm(){
  const v=parseInt(document.getElementById('formInput')?.value);if(!v||v<=0)return;
  S.tmp=v;S.tmpSrc="form";S.fmA=true;S.fmU++;hideFormPrompt();
  if(S.combat){S.fmR=10;addLog(`Form of Dread! ${v} temp HP. Fear aura. 10 rounds.`);}
  else{S.fmR=0;addLog(`Form of Dread! ${v} temp HP. Fear aura. (1 min — not in combat)`);}
  render();
}

// COMBAT START
function startCombat(){
  if(S.fmA&&S.fmR===0){showFormRoundsPrompt();return;}
  S.combat=true;S.rnd=1;addLog("── Round 1 ──");render();
}
function showFormRoundsPrompt(){
  const sec=document.getElementById('combatSection');
  sec.innerHTML=`<div style="text-align:center;margin-bottom:12px"><button class="btn btn-gold" onclick="startCombat()">⚔ Start Combat</button><div class="prompt" style="background:rgba(152,96,204,0.04);border:1px solid rgba(152,96,204,0.2)"><label style="color:#9860cc">Form of Dread rounds left?</label><input type="number" placeholder="1-10" id="fmRInput" style="border:1px solid rgba(152,96,204,0.2)" onkeydown="if(event.key==='Enter')confirmFmRounds()"><button class="btn" style="padding:4px 10px;background:rgba(152,96,204,0.1);border-color:rgba(152,96,204,0.27);color:#9860cc;font-size:11px" onclick="confirmFmRounds()">OK</button><button class="btn btn-dim" style="padding:4px 6px;font-size:11px" onclick="skipFmRounds()">Skip</button></div></div>`;
  setTimeout(()=>{const inp=document.getElementById('fmRInput');if(inp)inp.focus();},50);
}
function confirmFmRounds(){const v=Math.max(1,Math.min(10,parseInt(document.getElementById('fmRInput')?.value)||10));S.fmR=v;S.combat=true;S.rnd=1;addLog(`── Round 1 ── (Form of Dread: ${v} rounds remaining)`);render();}
function skipFmRounds(){S.combat=true;S.rnd=1;addLog("── Round 1 ──");render();}
function endCombat(){S.combat=false;S.rnd=0;addLog("Combat ended.");render();}

function nextRound(){
  S.rnd++;S.bite=false;let ms=[];
  if(S.fmA&&S.fmR>0){S.fmR--;if(S.fmR<=0){S.fmA=false;S.fmR=0;if(S.tmpSrc==="form"){S.tmp=0;S.tmpSrc=null;}ms.push("Form of Dread expired.");}else if(S.fmR<=2)ms.push(`⚠ Form of Dread: ${S.fmR} round${S.fmR>1?"s":""} left!`);}
  if(S.mirI>0&&S.mirR>0){S.mirR--;if(S.mirR<=0){S.mirI=0;S.mirR=0;ms.push("Mirror Image expired.");}};
  if(S.som&&S.somR>0){S.somR--;if(S.somR<=0){S.som=false;S.somR=0;if(S.conc==="Shadow of Moil")S.conc=null;ms.push("Shadow of Moil expired.");}};
  if(S.gi&&S.giR>0){S.giR--;if(S.giR<=0){S.gi=false;S.giR=0;if(S.conc==="Greater Invisibility")S.conc=null;ms.push("Greater Invisibility expired.");}};
  ms.forEach(m=>addLog(m));addLog(`── Round ${S.rnd} ──`);render();
}

// SPELLS
function castAgathys(){if(S.slU>=D().sl){addLog("No spell slots!");return;}S.tmp=D().at;S.tmpSrc="agathys";spendSpellSlot();addLog(`Armor of Agathys! ${D().at} temp HP + ${D().ad} cold retaliation.`);render();}
function castMI(){if(S.level<3)return;S.mirI=3;S.mirR=S.combat?10:0;addLog("Mirror Image! 3 duplicates.");render();}
function destroyMI(){if(S.mirI<=0)return;S.mirI--;addLog(`Mirror destroyed! ${S.mirI} left.`);render();}
function concSwap(ns){if(S.conc){if(S.conc==="Hex")S.hexA=false;if(S.conc==="Shadow of Moil"){S.som=false;S.somR=0;}if(S.conc==="Greater Invisibility"){S.gi=false;S.giR=0;}addLog(`Dropped ${S.conc}.`);}S.conc=ns;}
function castHex(){if(S.slU>=D().sl){addLog("No slots!");return;}concSwap("Hex");S.hexA=true;spendSpellSlot();const dur=D().slv>=5?"24h":D().slv>=3?"8h":"1h";addLog(`Hex (${dur}). +1d6 necrotic/hit.`);render();}
function castSoM(){if(S.level<7||S.slU>=D().sl){addLog("No slots!");return;}concSwap("Shadow of Moil");S.som=true;S.somR=S.combat?10:0;spendSpellSlot();addLog("Shadow of Moil! Heavily obscured, 2d8 retaliation.");render();}
function castGI(){if(S.level<7||S.slU>=D().sl){addLog("No slots!");return;}concSwap("Greater Invisibility");S.gi=true;S.giR=S.combat?10:0;spendSpellSlot();addLog("Greater Invisibility! Adv attacks, disadv to be hit.");render();}
function castHyp(){if(S.level<5||S.slU>=D().sl){addLog("No slots!");return;}concSwap("Hypnotic Pattern");spendSpellSlot();addLog("Hypnotic Pattern! WIS save or charmed+incapacitated.");render();}
function castCS(){if(S.level<6||S.slU>=D().sl){addLog("No slots!");return;}spendSpellSlot();addLog(`Counterspell! Auto-counters lv${D().slv} or lower.`);render();}
function castMS(){if(S.level<2||S.slU>=D().sl){addLog("No slots!");return;}spendSpellSlot();addLog("Misty Step! 30ft teleport.");render();}
function castDD(){if(S.level<8||S.slU>=D().sl){addLog("No slots!");return;}spendSpellSlot();addLog("Dimension Door! 500ft teleport.");render();}
function castSyS(){if(S.level<9||S.slU>=D().sl){addLog("No slots!");return;}spendSpellSlot();addLog("Synaptic Static! 8d6 psychic, -1d6 debuff.");render();}
function useBite(){if(S.bite){addLog("Bite already used!");return;}S.bite=true;let m="Vampiric Bite: 1d4 piercing";if(S.hp<=Math.floor(S.maxHp/2)){S.hp=Math.min(S.maxHp,S.hp+D().ch);m+=` + healed ${D().ch} HP (below half)`;}addLog(m);render();}
function useGG(){if(S.level<9||S.gg){addLog("Ghostly Gaze used (short rest recharge)");return;}S.gg=true;addLog("Ghostly Gaze! See through walls 30ft, 1 min.");render();}
function dropConc(){if(!S.conc)return;if(S.conc==="Hex")S.hexA=false;if(S.conc==="Shadow of Moil"){S.som=false;S.somR=0;}if(S.conc==="Greater Invisibility"){S.gi=false;S.giR=0;}addLog(`Dropped ${S.conc}.`);S.conc=null;render();}

// DISMISS
function dismiss(e){
  switch(e){
    case"form":S.fmA=false;S.fmR=0;if(S.tmpSrc==="form"){S.tmp=0;S.tmpSrc=null;}addLog("Form of Dread dismissed.");break;
    case"hex":S.hexA=false;if(S.conc==="Hex")S.conc=null;addLog("Hex dismissed.");break;
    case"mir":S.mirI=0;S.mirR=0;addLog("Mirror Image dismissed.");break;
    case"som":S.som=false;S.somR=0;if(S.conc==="Shadow of Moil")S.conc=null;addLog("Shadow of Moil dismissed.");break;
    case"gi":S.gi=false;S.giR=0;if(S.conc==="Greater Invisibility")S.conc=null;addLog("Greater Invisibility dismissed.");break;
    case"dw":S.dw=false;addLog("Death Ward dismissed.");break;
    case"ag":if(S.tmpSrc==="agathys"){S.tmp=0;S.tmpSrc=null;}addLog("Agathys dismissed.");break;
    case"ma":S.aos=!S.aos;addLog(S.aos?"Mage Armor activated.":"Mage Armor dismissed.");break;
    case"gt":S.fmA=false;S.fmR=0;if(S.tmpSrc==="form"){S.tmp=0;S.tmpSrc=null;}addLog("Form dismissed (Grave Touched ends).");break;
  }render();
}

// DEATH PREVENTION
function triggerHusk(){if(!S.nh)return;S.nh=false;S.hp=1;addLog("💀 Necrotic Husk! Survived at 1 HP. 2d10+10 necrotic AoE. 1 exhaustion.");render();}
function toggleDW(){if(S.dw){S.dw=false;S.hp=1;addLog("✝ Death Ward consumed! Survived at 1 HP.");}else{S.dw=true;addLog("Death Ward applied (8h).");}render();}

// RESTS
function shortRest(){S.slU=0;S.slSpent=Array(D().sl).fill(false);S.bite=false;S.gg=false;S.fmA=false;S.fmR=0;S.mirI=0;S.mirR=0;S.som=false;S.somR=0;S.gi=false;S.giR=0;S.conc=null;S.hexA=false;S.tmp=0;S.tmpSrc=null;S.rnd=0;S.combat=false;addLog("☽ Short rest. Slots recovered.");render();}
function longRest(){S.hp=S.maxHp;S.tmp=0;S.tmpSrc=null;S.slU=0;S.slSpent=Array(D().sl).fill(false);const hdRec=Math.max(1,Math.floor(S.level/2));let left=hdRec;for(let i=0;i<S.hdSpent.length&&left>0;i++){if(S.hdSpent[i]){S.hdSpent[i]=false;left--;}}S.hdU=S.hdSpent.filter(Boolean).length;S.fmA=false;S.fmU=0;S.fmR=0;S.conc=null;S.mirI=0;S.mirR=0;S.hexA=false;S.som=false;S.somR=0;S.dw=false;S.gi=false;S.giR=0;S.bite=false;S.gg=false;S.rnd=0;S.combat=false;if(S.level>=10)S.nh=true;addLog(`🌙 Long rest. Full HP. Recovered up to ${hdRec} spent hit dice.`);render();}

// RENDER
function render(){
  const d=D();const ac=S.aos?14:11;const pct=(S.hp/S.maxHp)*100;const bHalf=S.hp<=Math.floor(S.maxHp/2);
  if(!Array.isArray(S.slSpent)) S.slSpent=Array(d.sl).fill(false);
  if(S.slSpent.length<d.sl) S.slSpent=S.slSpent.concat(Array(d.sl-S.slSpent.length).fill(false));
  if(S.slSpent.length>d.sl) S.slSpent=S.slSpent.slice(0,d.sl);
  S.slU=S.slSpent.filter(Boolean).length;

  // Stats
  document.getElementById('acVal').textContent=ac;
  document.getElementById('dcVal').textContent=d.dc;
  document.getElementById('saVal').textContent='+'+d.sa;

  // Level buttons
  let lb='';for(let i=1;i<=10;i++)lb+=`<button class="lvl-btn ${i===S.level?'active':''}" onclick="resetToLevel(${i})">${i}</button>`;
  document.getElementById('levelBtns').innerHTML=lb;

  // Combat
  const cs=document.getElementById('combatSection');
  if(S.combat){
    cs.innerHTML=`<div class="card" style="display:flex;align-items:center;justify-content:space-between"><div class="round-badge">⚡ Round ${S.rnd}</div><div style="display:flex;gap:6px"><button class="btn btn-gold" onclick="nextRound()">Next Round</button><button class="btn" style="border-color:#7a6f5d44;color:#7a6f5d;background:transparent" onclick="endCombat()">End</button></div></div>`;
  }else{
    cs.innerHTML=`<div style="text-align:center;margin-bottom:12px"><button class="btn btn-gold" onclick="startCombat()">⚔ Start Combat</button></div>`;
  }

  // HP bar
  const barTotal=S.maxHp+(S.tmp>0?S.tmp:0);
  const hpBarPct=(S.hp/barTotal)*100;
  const tmpBarPct=(S.tmp/barTotal)*100;
  const hpFill=document.getElementById('hpFill');
  hpFill.style.width=Math.min(100,hpBarPct)+'%';
  hpFill.style.background=pct>50?'linear-gradient(90deg,#4a1a1a,#8b2020)':pct>25?'linear-gradient(90deg,#4a3a1a,#8b6b20)':'linear-gradient(90deg,#4a1a2a,#8b2040)';
  const hpTmp=document.getElementById('hpTemp');
  if(S.tmp>0){
    hpTmp.style.display='block';
    hpTmp.style.left=Math.min(100,hpBarPct)+'%';
    hpTmp.style.width=Math.min(100-hpBarPct,tmpBarPct)+'%';
    hpTmp.style.background=S.tmpSrc==='agathys'?'linear-gradient(90deg,rgba(80,160,220,0.5),rgba(80,160,220,0.7))':'linear-gradient(90deg,rgba(152,96,204,0.5),rgba(152,96,204,0.7))';
  }else{hpTmp.style.display='none';}
  const tc=S.tmpSrc==='agathys'?'#50a0dc':'#9860cc';
  document.getElementById('hpText').innerHTML=`${S.hp} / ${S.maxHp}${S.tmp>0?` <span style="color:${tc}">+${S.tmp}</span>`:''}`;
  document.getElementById('maxHpInput').value=S.maxHp;
  const bh=document.getElementById('belowHalf');
  if(bHalf){bh.className='below-half';bh.textContent=`⚠ BELOW HALF — Vampiric Bite heals ${d.ch}`;}else{bh.className='below-half hidden';}

  // Temp HP sources
  const fb=document.getElementById('formBtn');
  fb.className=S.fmA?'wide-btn active':S.fmU>=d.fu?'wide-btn dim':'wide-btn';
  document.getElementById('formSub').textContent=`${d.ft} temp · ${d.fu-S.fmU}/${d.fu} uses${S.fmA&&S.fmR>0?` · ${S.fmR}r`:S.fmA?' · active':''}`;
  const ab=document.getElementById('agBtn');
  ab.className=S.tmpSrc==='agathys'?'wide-btn active-blue':S.slU>=d.sl?'wide-btn dim':'wide-btn';
  document.getElementById('agSub').textContent=`${d.at} temp + ${d.ad} cold`;
  const ts=document.getElementById('tempStatus');
  if(S.tmp>0&&S.tmpSrc){ts.className='';ts.style.color=S.tmpSrc==='agathys'?'#50a0dc':'#9860cc';ts.textContent=S.tmpSrc==='agathys'?`Active: Agathys (${S.tmp} temp HP, ${d.ad} cold retaliation)`:`Active: Form of Dread (${S.tmp} temp HP${S.fmA?', fear aura, necrotic boost':''})`;}else{ts.className='hidden';}

  // Slots
  document.getElementById('slotLabel').innerHTML=`⚡ Spell Slots (Level ${d.slv})`;
  let dots='';for(let i=0;i<d.sl;i++)dots+=`<div class="slot-dot ${S.slSpent[i]?'empty':'full'}" onclick="toggleSpellSlot(${i})"></div>`;
  document.getElementById('slotDots').innerHTML=dots;

  // Hit dice
  const hdTotal=S.level;
  const hdUsed=S.hdSpent.filter(Boolean).length;
  S.hdU=hdUsed;
  const hdAvail=hdTotal-hdUsed;
  document.getElementById('hdLabel').innerHTML=`Hit Dice (d8) ${hdAvail}/${hdTotal}`;
  let hdDots='';for(let i=0;i<hdTotal;i++)hdDots+=`<div class="slot-dot ${S.hdSpent[i]?'empty':'full'}" onclick="toggleHitDie(${i})"></div>`;
  document.getElementById('hdDots').innerHTML=hdDots;

  // Concentration
  const cb=document.getElementById('concBanner');
  if(S.conc){cb.className='conc-banner';let ct=S.conc;if(S.conc==='Shadow of Moil'&&S.somR>0)ct+=` (${S.somR}r)`;if(S.conc==='Greater Invisibility'&&S.giR>0)ct+=` (${S.giR}r)`;cb.innerHTML=`<div style="display:flex;align-items:center;gap:6px"><span>👁 Concentrating: <strong>${ct}</strong></span></div><button class="btn btn-brown btn-sm" onclick="dropConc()">Drop</button>`;}else{cb.className='hidden';}

  // Effects
  let ef='';
  ef+=`<span class="tag" style="background:${S.aos?'rgba(106,154,64,0.1)':'transparent'};border-color:${S.aos?'rgba(106,154,64,0.27)':'rgba(42,37,32,0.27)'};color:${S.aos?'#6a9a40':'#3a3428'}" onclick="dismiss('ma')">${S.aos?'✓':'○'} Mage Armor</span>`;
  if(S.fmA)ef+=`<span class="tag" style="background:rgba(152,96,204,0.1);border-color:rgba(152,96,204,0.27);color:#9860cc" onclick="dismiss('form')">✕ Form of Dread${S.fmR>0?' ('+S.fmR+'r)':''}</span>`;
  if(S.hexA)ef+=`<span class="tag" style="background:rgba(64,204,128,0.1);border-color:rgba(64,204,128,0.27);color:#40cc80" onclick="dismiss('hex')">✕ Hex (+1d6)</span>`;
  if(S.mirI>0)ef+=`<span class="tag" style="background:rgba(96,128,204,0.1);border-color:rgba(96,128,204,0.27);color:#6080cc" onclick="dismiss('mir')">✕ Mirror ×${S.mirI}${S.mirR>0?' ('+S.mirR+'r)':''}</span>`;
  if(S.som)ef+=`<span class="tag" style="background:rgba(204,96,204,0.1);border-color:rgba(204,96,204,0.27);color:#cc60cc" onclick="dismiss('som')">✕ Shadow of Moil${S.somR>0?' ('+S.somR+'r)':''}</span>`;
  if(S.gi)ef+=`<span class="tag" style="background:rgba(96,204,204,0.1);border-color:rgba(96,204,204,0.27);color:#60cccc" onclick="dismiss('gi')">✕ Greater Invis${S.giR>0?' ('+S.giR+'r)':''}</span>`;
  if(S.dw)ef+=`<span class="tag" style="background:rgba(204,144,64,0.1);border-color:rgba(204,144,64,0.27);color:#cc9040" onclick="dismiss('dw')">✕ Death Ward</span>`;
  if(S.tmpSrc==='agathys')ef+=`<span class="tag" style="background:rgba(80,160,220,0.1);border-color:rgba(80,160,220,0.27);color:#50a0dc" onclick="dismiss('ag')">✕ Agathys (${d.ad} retl)</span>`;
  if(S.level>=6&&S.fmA)ef+=`<span class="tag" style="background:rgba(204,64,96,0.1);border-color:rgba(204,64,96,0.27);color:#cc4060" onclick="dismiss('gt')">✕ Grave Touched</span>`;
  if(S.level>=10)ef+=`<span class="tag" style="background:${S.nh?'rgba(204,96,64,0.1)':'transparent'};border-color:${S.nh?'rgba(204,96,64,0.27)':'rgba(42,37,32,0.27)'};color:${S.nh?'#cc6040':'#3a3428'};cursor:default">${S.nh?'Necrotic Husk Ready':'Husk Used'}</span>`;
  document.getElementById('effectTags').innerHTML=ef;

  // Conditions
  let ct='';
  CONDITIONS.forEach(c=>{
    const on=!!S.cond[c.k];
    ct+=`<span class="tag" style="background:${on?'rgba(204,64,64,0.12)':'transparent'};border-color:${on?'rgba(204,64,64,0.35)':'rgba(42,37,32,0.27)'};color:${on?'#cc5050':'#8a7f6d'}" onclick="toggleCondition('${c.k}')">${on?'●':'○'} ${c.n}</span>`;
  });
  const condBody=document.getElementById('condBody');
  const condToggleBtn=document.getElementById('condToggleBtn');
  condBody.style.display=S.condOpen?'block':'none';
  condToggleBtn.textContent=S.condOpen?'Hide':'Show';
  document.getElementById('condTags').innerHTML=ct;
  const activeCond=CONDITIONS.filter(c=>S.cond[c.k]);
  document.getElementById('condInfo').innerHTML=activeCond.map(c=>`<div style="margin-top:4px"><strong style="color:#cc8080">${c.n}:</strong> ${c.d}</div>`).join('');

  // Spells
  const noSl=S.slU>=d.sl;let sg='';
  sg+=spBtn('🦇 Vampiric Bite','#cc4040',false,S.bite,'useBite()');
  if(S.level>=2)sg+=spBtn('✧ Misty Step','#6080cc',false,noSl,'castMS()');
  sg+=spBtn('⬡ Hex','#40cc80',S.hexA,noSl&&!S.hexA,'castHex()');
  if(S.level>=3)sg+=spBtn('◇ Mirror Image','#6080cc',S.mirI>0,false,'castMI()');
  if(S.level>=5)sg+=spBtn('✦ Hypnotic Pattern','#cccc40',false,noSl,'castHyp()');
  if(S.level>=6)sg+=spBtn('✋ Counterspell','#cc6040',false,noSl,'castCS()');
  if(S.level>=7)sg+=spBtn('◉ Shadow of Moil','#cc60cc',S.som,noSl&&!S.som,'castSoM()');
  if(S.level>=7)sg+=spBtn('👁 Greater Invis','#60cccc',S.gi,noSl&&!S.gi,'castGI()');
  if(S.level>=8)sg+=spBtn('🚪 Dimension Door','#8060cc',false,noSl,'castDD()');
  if(S.level>=9)sg+=spBtn('🧠 Synaptic Static','#cc40cc',false,noSl,'castSyS()');
  if(S.level>=9)sg+=spBtn('👁 Ghostly Gaze','#cc9040',false,S.gg,'useGG()');
  document.getElementById('spellGrid').innerHTML=sg;
  const md=document.getElementById('mirrorDestroy');
  if(S.mirI>0){md.className='';md.innerHTML=`<button class="btn btn-blue btn-sm" onclick="destroyMI()">Destroy a Mirror Image (${S.mirI} left)</button>`;}else{md.className='hidden';}

  // Death prevention
  const dc=document.getElementById('deathCard');
  if(S.level>=10){dc.className='card';
    document.getElementById('deathContent').innerHTML=`
    <div style="display:flex;gap:6px"><button class="wide-btn${S.nh?' active':''}" style="${S.nh?'border-color:#cc6040;color:#cc6040;background:rgba(204,96,64,0.1)':''}" onclick="triggerHusk()"><span style="font-size:16px">💀</span><div><div class="title">Necrotic Husk</div><div class="sub">Survive at 1 HP + 2d10+10 AoE · ${S.nh?'Ready':'Used (1d4 long rests)'}</div></div></button></div>
    <div style="display:flex;gap:6px;margin-top:6px"><button class="wide-btn${S.dw?' active':''}" style="${S.dw?'border-color:#cc9040;color:#cc9040;background:rgba(204,144,64,0.1)':''}" onclick="toggleDW()"><span style="font-size:16px">✝</span><div><div class="title">Death Ward</div><div class="sub">${S.dw?'Active — click to consume':'Click to activate (if taken via swap)'}</div></div></button></div>`;
  }else{dc.className='hidden';}

  // Damage reference
  let dr=`<div><strong>Eldritch Blast</strong>: ${d.bm}×(1d10+${d.ch}) = avg ${(5.5+d.ch)*d.bm}${S.level>=2?' (Agonizing)':''}</div>`;
  if(S.hexA)dr+=`<div style="color:#40cc80">&nbsp; + Hex: +${d.bm}d6 = avg ${((5.5+d.ch)*d.bm+3.5*d.bm).toFixed(1)}</div>`;
  if(S.fmA&&S.level>=6)dr+=`<div style="color:#9860cc">&nbsp; Grave Touched: ${d.bm}×(2d10+${d.ch}) = avg ${(11+d.ch)*d.bm}</div>`;
  if(S.level>=5)dr+=`<div><strong>Repelling Blast</strong>: ${d.bm*10}ft push (${d.bm} hits)</div>`;
  if(S.level>=3)dr+=`<div><strong>Thorn Whip</strong>: 1d6 piercing + 10ft pull</div>`;
  document.getElementById('dmgRef').innerHTML=dr;

  renderLog();
  cacheState();
}

function spBtn(label,color,active,dim,onclick){
  const bg=active?`${color}18`:'transparent';
  const bc=dim?'#2a2520':active?color:'#3a3428';
  const tc=dim?'#3a3428':active?color:'#8a7f6d';
  const op=dim?'0.35':'1';
  const cur=dim?'default':'pointer';
  return `<button style="padding:10px 14px;border-radius:6px;font-size:12px;font-family:inherit;cursor:${cur};transition:all 0.2s;text-align:left;width:100%;display:flex;align-items:center;gap:8px;letter-spacing:0.5px;border:1px solid ${bc};background:${bg};color:${tc};opacity:${op}" onclick="${onclick}">${label}</button>`;
}

// INIT
(async function(){
  loadCachedState();
  render();
})();
</script>
<input type="file" id="loadFileInput" accept="application/json" style="display:none">
</body>
</html>
