<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Character Sheet — DND Tracker</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#14111b;--card:#1c1926;--border:#3b3353;
  --gold:#b38cff;--text:#efe8ff;--dim:#a19ab3;--dim2:#5a4f70;
  --red:#c34848;--purple:#9b7bff;--blue:#4ea3ff;--green:#4fc08a;--pink:#d46b92;
  --ink:#f7f2ff;--paper:#241f32;--shadow:rgba(10,8,16,0.5);
}
body{background:var(--bg);color:var(--text);font-family:'Iowan Old Style','Palatino Linotype','Book Antiqua','Garamond',serif;min-height:100vh;position:relative;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:
  radial-gradient(ellipse at 18% 28%,rgba(80,60,120,0.25) 0%,transparent 55%),
  radial-gradient(ellipse at 82% 12%,rgba(40,20,80,0.3) 0%,transparent 50%),
  linear-gradient(180deg,rgba(255,255,255,0.06),rgba(0,0,0,0));
  pointer-events:none;z-index:0}

.wrap{max-width:1280px;margin:0 auto;padding:0 16px 80px;position:relative;z-index:1}

@media (min-width: 1100px) {
  .wrap{max-width:1360px}
}

/* ── Layout ── */
.sheet-layout{display:block}
.toolbar-row{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
.toolbar-left{display:flex;align-items:center;gap:10px}
.toolbar-actions{display:flex;gap:8px}

.top-row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start;margin-top:0}
.ability-strip .ability-row{gap:8px}
.ability-strip-inner{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:stretch}
.ability-strip-side{display:flex;flex-direction:column;gap:8px;align-content:start;height:100%}
.ability-strip-row{display:grid;grid-template-columns:repeat(3,minmax(120px,1fr));gap:8px;align-items:stretch;flex:1}
.ability-strip-row .util-tile{height:100%}
.ability-strip-row .util-tile.no-stretch{height:auto;align-self:start}
.ability-strip .ability-row{align-items:stretch}
.ability-strip .ability-box{height:100%}
.ability-strip-inner .ability-row{flex:1;min-width:420px}
.ability-strip-inner .util-tile{min-width:120px}
.ability-strip .ability-box{padding:6px 4px}
.ability-strip .util-tile{padding:6px 6px}
.ability-strip .util-val{font-size:16px}

.sheet-grid{display:grid;grid-template-columns:260px 260px 1fr;row-gap:16px;column-gap:14px;padding-top:0;margin-top:-6px}
.left-col{display:grid;gap:20px;align-content:start;padding-right:6px}
.mid-col{display:grid;gap:20px;align-content:start;padding-left:6px}
.right-col{display:grid;gap:12px;align-content:start}
.hp-panel{align-self:start;max-width:420px;width:100%;padding:8px 10px}
.action-header{display:grid;grid-template-columns:260px minmax(0,1fr);gap:12px;align-items:start}
.action-top-stats{display:grid;grid-template-columns:repeat(2,minmax(120px,1fr));gap:10px}
.action-top-stats .util-tile{padding:10px 8px}
.action-top-stats .util-val{font-size:20px}
.main-panel{display:flex;flex-direction:column;min-height:560px}
.defense-panel{min-height:160px}

@media (max-width: 1100px) {
  .sheet-grid{grid-template-columns:1fr 1fr;}
  .right-col{grid-column:1 / -1}
  .top-row{grid-template-columns:1fr}
  .action-header{grid-template-columns:1fr}
}

@media (max-width: 820px) {
  .sheet-grid{grid-template-columns:1fr;}
  .right-top{grid-template-columns:repeat(2,1fr)}
}

/* ── Header ── */
.sheet-header{padding:14px 16px 10px;background:linear-gradient(180deg,rgba(26,22,36,0.95),rgba(20,17,27,0.85));border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50;backdrop-filter:blur(8px)}
.header-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.back-link{color:var(--dim);font-size:12px;letter-spacing:1px;text-decoration:none;flex-shrink:0}
.back-link:hover{color:var(--gold)}
.char-name-display{font-size:26px;font-weight:700;letter-spacing:3px;color:var(--ink);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.char-identity{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);margin-bottom:10px}

/* ── Panel tabs ── */
.panel-tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--border);padding-bottom:8px;margin-bottom:10px}
.panel-tab{padding:6px 10px;border-radius:999px;border:1px solid var(--border);background:transparent;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);cursor:pointer;transition:all 0.2s}
.panel-tab.active{color:var(--ink);border-color:var(--purple);background:rgba(155,123,255,0.18)}
.panel-tab:hover:not(.active){color:var(--text)}
.panel-body{flex:1;min-height:380px}
.panel-tab-content{display:none}
.panel-tab-content.active{display:block}

/* ── Action filters ── */
.action-filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.action-filter{padding:4px 10px;border-radius:999px;border:1px solid var(--border);background:transparent;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--dim);cursor:pointer}
.action-filter.active{color:var(--ink);border-color:var(--purple);background:rgba(155,123,255,0.18)}
.actions-table{display:grid;gap:6px}
.action-head,.action-row{display:grid;grid-template-columns:1.3fr 0.7fr 0.7fr 0.6fr 1fr;gap:8px;align-items:center}
.action-head{font-size:9px;letter-spacing:1.6px;text-transform:uppercase;color:var(--dim);padding:6px 8px}
.action-row{background:var(--paper);border:1px solid var(--border);border-radius:8px;padding:8px 8px;position:relative}
.action-name{font-size:12px;color:var(--text);font-weight:600}
.action-range,.action-hit{font-size:10px;color:var(--dim)}
.action-notes{font-size:10px;color:var(--dim);line-height:1.4;max-height:2.8em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.action-damage{display:flex;justify-content:flex-start}
.action-dmg-btn{padding:4px 8px;border-radius:6px;border:1px solid rgba(155,123,255,0.4);background:rgba(155,123,255,0.12);color:var(--purple);font-size:11px;cursor:pointer;white-space:nowrap}
.action-dmg-btn.dim{opacity:0.4;cursor:default}
@media (max-width: 820px) {
  .action-head,.action-row{grid-template-columns:1.4fr 0.7fr 0.7fr 0.6fr 1fr}
}
@media (max-width: 640px) {
  .action-head{display:none}
  .action-row{grid-template-columns:1fr;gap:6px}
  .action-damage{justify-content:flex-start}
}

/* ── Cards ── */
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:6px;box-shadow:0 6px 18px var(--shadow)}
.card-label{font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:var(--dim);margin-bottom:10px;display:flex;align-items:center;gap:6px}

/* ── Ability scores ── */
.ability-row{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:10px}
.ability-box{background:var(--paper);border:1px solid var(--purple);border-radius:8px;padding:8px 4px;text-align:center;cursor:pointer;position:relative;box-shadow:0 4px 12px rgba(124,96,200,0.18)}
.ability-box:hover{border-color:rgba(155,123,255,0.8)}
.ability-mod{font-size:22px;font-weight:700;color:var(--purple);line-height:1}
.ability-label{font-size:8px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);margin-top:4px}
.ability-score{font-size:11px;color:var(--text);margin-top:4px}

.util-tile{background:var(--paper);border:1px solid var(--purple);border-radius:10px;padding:8px 6px;text-align:center}
.util-val{font-size:18px;font-weight:700;color:var(--gold)}
.util-lbl{font-size:8px;letter-spacing:1.6px;text-transform:uppercase;color:var(--dim);margin-top:3px}


.passive-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.passive-tile{background:var(--paper);border:1px solid var(--border);border-radius:10px;padding:8px 6px;text-align:center}
.passive-val{font-size:16px;font-weight:700;color:var(--gold)}
.passive-lbl{font-size:8px;letter-spacing:1.4px;text-transform:uppercase;color:var(--dim);margin-top:4px}

/* ── Core stats row ── */
.core-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.core-stat{background:var(--paper);border:1px solid var(--border);border-radius:6px;padding:8px 4px;text-align:center}
.core-stat-val{font-size:18px;font-weight:700;color:var(--gold)}
.core-stat-lbl{font-size:8px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);margin-top:3px}
.stat-editable{cursor:pointer}
.stat-editable:hover .core-stat-val{color:#f0d090}

/* ── Saves & Skills ── */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.save-list,.skill-list-panel{list-style:none}
.save-item,.skill-item{display:flex;align-items:center;gap:6px;padding:3px 0;font-size:12px;border-bottom:1px solid rgba(90,79,112,0.5)}
.save-item.editable,.skill-item.editable{cursor:pointer}
.save-item.editable:hover .save-name,.skill-item.editable:hover .skill-name-cell{color:var(--gold)}
.save-item:last-child,.skill-item:last-child{border-bottom:none}
.prof-dot{width:10px;height:10px;border-radius:50%;border:1px solid var(--dim2);flex-shrink:0}
.prof-dot.prof{background:rgba(232,193,112,0.4);border-color:rgba(232,193,112,0.6)}
.prof-dot.exp{background:rgba(64,204,128,0.4);border-color:rgba(64,204,128,0.6)}
.save-name,.skill-name-cell{flex:1;color:var(--text)}
.save-ability{font-size:9px;color:var(--dim);letter-spacing:1px}
.save-val,.skill-val{font-size:12px;font-weight:600;color:var(--gold);min-width:26px;text-align:right}

/* ── HP ── */
.hp-display{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;min-width:0}
.hp-values{display:grid;grid-template-columns:1fr;gap:8px;align-content:center}
.hp-val-box{background:var(--paper);border:1px solid var(--purple);border-radius:8px;padding:6px 8px;text-align:center;min-width:110px}
.hp-val-label{font-size:8px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim)}
.hp-val-number{font-size:18px;font-weight:700;color:var(--gold);white-space:nowrap}
.hp-fraction{min-width:9ch}
.hp-temp-box{background:var(--paper);border:1px solid var(--border);border-radius:8px;padding:6px 8px;text-align:center;min-width:84px;align-self:center}
.hp-controls{display:flex;gap:10px;margin-top:4px;align-items:center}
.hp-entry{display:grid;grid-template-rows:auto auto;gap:4px;min-width:110px}
.hp-input{width:100%;background:var(--paper);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:6px 8px;font-size:13px;font-family:inherit;outline:none;text-align:center}
.hp-action-btn{padding:4px 8px;border-radius:6px;font-size:11px;font-family:inherit;cursor:pointer;transition:all 0.2s;border:1px solid}
.hp-action-heal{background:rgba(79,192,138,0.12);border-color:rgba(79,192,138,0.35);color:var(--green)}
.hp-action-dmg{background:rgba(195,72,72,0.12);border-color:rgba(195,72,72,0.35);color:var(--red)}

.spell-top-stats{display:flex;gap:8px;margin-bottom:8px}
.spell-top-stats .util-tile{padding:4px 6px;border-radius:6px;min-width:80px}
.spell-top-stats .util-val{font-size:14px}
.spell-top-stats .util-lbl{font-size:7px;letter-spacing:1.2px}

.slot-row-line{display:flex;align-items:center;justify-content:space-between;padding:4px 0;font-size:10px;color:var(--dim)}
.slot-counts{display:flex;gap:6px}
.slot-count{width:16px;height:16px;border-radius:4px;border:1px solid var(--border);display:inline-flex;align-items:center;justify-content:center;font-size:10px;color:var(--text)}

/* ── Buttons ── */
.btn{padding:6px 12px;border-radius:4px;font-size:12px;font-family:inherit;cursor:pointer;transition:all 0.2s;white-space:nowrap;letter-spacing:0.5px;border:1px solid}
.btn-gold{background:rgba(232,193,112,0.1);border-color:rgba(232,193,112,0.27);color:var(--gold)}
.btn-gold:hover{background:rgba(232,193,112,0.18)}
.btn-blue{background:rgba(155,123,255,0.12);border-color:rgba(155,123,255,0.35);color:var(--purple)}
.btn-red{background:rgba(139,32,32,0.1);border-color:rgba(139,32,32,0.27);color:var(--red)}
.btn-green{background:rgba(64,204,128,0.1);border-color:rgba(64,204,128,0.27);color:var(--green)}
.btn-brown{background:rgba(139,64,32,0.1);border-color:rgba(139,64,32,0.27);color:#8b4020}
.btn-dim{background:transparent;border-color:var(--border);color:var(--dim);opacity:0.4;cursor:default}
.btn-sm{padding:3px 8px;font-size:10px}

.action-btn{position:relative;overflow:visible}
.action-name[data-tip],
.action-btn[data-tip]{cursor:help}

.md-tooltip{
  position:fixed;
  left:0;
  top:0;
  width:min(560px,calc(100vw - 20px));
  max-height:min(60vh,520px);
  overflow:auto;
  padding:14px 16px;
  border-radius:10px;
  color:var(--text);
  background:rgba(24,20,31,0.98);
  border:1px solid rgba(138,127,109,0.55);
  box-shadow:0 16px 36px rgba(0,0,0,0.5);
  z-index:1200;
  opacity:0;
  transform:translateY(4px);
  transition:opacity 0.12s ease, transform 0.12s ease;
  pointer-events:none;
}
.md-tooltip.visible{opacity:1;transform:translateY(0)}
.md-tooltip.pinned{pointer-events:auto}
.md-tooltip-content{font-size:13px;line-height:1.6;letter-spacing:0.1px}
.md-tooltip-content p{margin:0 0 10px}
.md-tooltip-content p:last-child{margin-bottom:0}
.md-tooltip-content h1,.md-tooltip-content h2,.md-tooltip-content h3,.md-tooltip-content h4{color:var(--ink);line-height:1.25;margin:0 0 8px}
.md-tooltip-content h1{font-size:18px}
.md-tooltip-content h2{font-size:16px}
.md-tooltip-content h3{font-size:14px}
.md-tooltip-content h4{font-size:13px;letter-spacing:0.5px;text-transform:uppercase;color:var(--gold)}
.md-tooltip-content ul,.md-tooltip-content ol{margin:0 0 10px 18px;padding:0}
.md-tooltip-content li{margin:0 0 4px}
.md-tooltip-content code{font-family:'Consolas','Monaco','Courier New',monospace;background:rgba(78,163,255,0.14);padding:1px 4px;border-radius:4px;color:#b8d8ff}
.md-tooltip-content pre{margin:0 0 10px;padding:10px 12px;background:rgba(12,10,17,0.8);border:1px solid rgba(78,163,255,0.22);border-radius:8px;overflow:auto}
.md-tooltip-content pre code{background:transparent;padding:0;border-radius:0}
.md-tooltip-content blockquote{margin:0 0 10px;padding:8px 10px;border-left:3px solid rgba(180,140,60,0.7);background:rgba(180,140,60,0.08);color:#e2d4b4}
.md-tooltip-content hr{border:none;border-top:1px solid rgba(138,127,109,0.45);margin:8px 0}
.md-tooltip-content .md-tag{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11px;line-height:1.3;border:1px solid;margin:0 1px}
.md-tooltip-content .md-tag-condition{background:rgba(195,72,72,0.2);border-color:rgba(195,72,72,0.5);color:#f2a7a7}
.md-tooltip-content .md-tag-status{background:rgba(180,140,60,0.2);border-color:rgba(180,140,60,0.5);color:#e7c98b}
.md-tooltip-content .md-tag-skill{background:rgba(78,163,255,0.2);border-color:rgba(78,163,255,0.5);color:#b9dbff}
.md-tooltip-content .weapon-tip-grid{display:grid;grid-template-columns:1fr 1fr;column-gap:24px;margin:4px 0 0}
.md-tooltip-content .weapon-tip-col{min-width:0}
.md-tooltip-content .weapon-tip-label{font-size:11px;letter-spacing:0.7px;text-transform:uppercase;color:var(--dim);margin-bottom:4px}
.md-tooltip-content .weapon-tip-value code{font-size:13px;padding:2px 6px}

/* ── Slots ── */
.slot-dot{width:20px;height:20px;border-radius:50%;cursor:pointer;transition:all 0.2s;border:2px solid}
.slot-dot.full{border-color:var(--gold);background:rgba(232,193,112,0.2);box-shadow:0 0 8px rgba(232,193,112,0.15)}
.slot-dot.empty{border-color:var(--dim2);background:transparent}
.slot-row{display:flex;align-items:center;justify-content:space-between;padding:4px 0}
.slot-row-label{font-size:10px;letter-spacing:1px;color:var(--dim)}
.slot-dots{display:flex;gap:5px;flex-wrap:wrap}

/* ── Effects / Conditions ── */
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:12px;font-size:10px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;transition:all 0.2s;user-select:none;border:1px solid}
.effects-wrap{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.action-effects{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.action-effect{display:flex;align-items:center;gap:6px;padding:4px 8px;border-radius:999px;border:1px solid var(--border);background:var(--paper);font-size:10px;color:var(--text)}
.action-effect .effect-name{white-space:nowrap}
.action-effect .effect-btn{border:none;background:transparent;color:var(--dim);cursor:pointer;font-size:11px;line-height:1}
.cond-picker{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:6px}
.cond-btn{padding:4px 6px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--dim);font-size:10px;letter-spacing:0.6px;cursor:pointer;text-transform:uppercase;text-align:left}
.cond-btn.active{border-color:rgba(195,72,72,0.45);color:#e07b7b;background:rgba(195,72,72,0.12)}

/* ── Concentration ── */
.conc-banner{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:rgba(180,140,60,0.08);border:1px solid rgba(180,140,60,0.2);border-radius:6px;margin-bottom:8px}
.conc-banner span{font-size:12px;color:#b48c3c;letter-spacing:1px}

/* ── Wide button ── */
.wide-btn{padding:10px 14px;border-radius:6px;font-size:12px;font-family:inherit;cursor:pointer;transition:all 0.2s;text-align:left;width:100%;display:flex;align-items:center;gap:8px;letter-spacing:0.5px;border:1px solid var(--border);background:transparent;color:var(--dim)}
.wide-btn:hover{border-color:rgba(232,193,112,0.2)}
.wide-btn.active{border-color:var(--purple);color:var(--purple);background:rgba(152,96,204,0.1)}
.wide-btn.active-blue{border-color:var(--blue);color:var(--blue);background:rgba(80,160,220,0.1)}
.wide-btn.active-gold{border-color:var(--gold);color:var(--gold);background:rgba(232,193,112,0.08)}
.wide-btn.dim{opacity:0.3;cursor:default}
.wide-btn .w-title{font-weight:600}
.wide-btn .w-sub{font-size:10px;opacity:0.7}

/* ── Prompt ── */
.prompt{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:6px;margin-top:6px}
.prompt input{width:70px;background:var(--paper);border-radius:4px;color:var(--text);padding:4px 8px;font-size:13px;font-family:inherit;outline:none;text-align:center;border:1px solid var(--border)}
.prompt label{font-size:11px;white-space:nowrap}

/* ── Round badge ── */
.round-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;background:rgba(155,123,255,0.18);border:1px solid var(--border);border-radius:12px;font-size:11px;color:var(--gold)}

/* ── Log ── */
.log-entry{padding:4px 0;border-bottom:1px solid var(--border);font-size:12px;color:var(--dim);line-height:1.4}

/* ── Spell card ── */
.spell-card{background:var(--paper);border:1px solid var(--border);border-radius:6px;margin-bottom:6px;overflow:hidden}
.spell-card-header{display:flex;align-items:center;gap:8px;padding:8px 12px;cursor:pointer;transition:background 0.15s}
.spell-card-header:hover{background:rgba(255,255,255,0.02)}
.spell-card-name{font-size:13px;font-weight:600;flex:1}
.spell-card-meta{font-size:10px;color:var(--dim);text-align:right;white-space:nowrap}
.spell-card-body{padding:10px 12px;border-top:1px solid var(--dim2);display:none;font-size:12px;line-height:1.7;color:var(--text)}
.spell-card-body.open{display:block}
.spell-level-divider{font-size:9px;letter-spacing:2.5px;text-transform:uppercase;color:var(--dim2);padding:8px 0 4px;margin-top:4px}
.conc-badge{display:inline-flex;padding:1px 6px;border-radius:8px;font-size:9px;background:rgba(180,140,60,0.15);border:1px solid rgba(180,140,60,0.3);color:#b48c3c;margin-left:4px}
.ritual-badge{display:inline-flex;padding:1px 6px;border-radius:8px;font-size:9px;background:rgba(80,160,220,0.1);border:1px solid rgba(80,160,220,0.25);color:var(--blue);margin-left:4px}
.cast-btn{padding:2px 8px;border-radius:3px;font-size:10px;font-family:inherit;cursor:pointer;border:1px solid rgba(232,193,112,0.3);background:rgba(232,193,112,0.07);color:var(--gold);transition:all 0.2s}
.cast-btn:hover{background:rgba(232,193,112,0.15)}
.cast-btn:disabled{opacity:0.3;cursor:default}
.prepared-dot{width:10px;height:10px;border-radius:50%;border:1px solid;flex-shrink:0;cursor:pointer}

/* ── Features ── */
.feature-card{background:var(--paper);border:1px solid var(--border);border-radius:6px;margin-bottom:6px;overflow:hidden}
.feature-header{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;cursor:pointer}
.feature-header:hover{background:rgba(255,255,255,0.02)}
.feature-name{font-size:13px;font-weight:600;color:var(--text)}
.feature-level{font-size:10px;color:var(--dim);letter-spacing:1px}
.feature-body{padding:10px 12px;border-top:1px solid var(--dim2);display:none;font-size:12px;line-height:1.7;color:var(--text)}
.feature-body.open{display:block}
.feature-section-label{font-size:9px;letter-spacing:2.5px;text-transform:uppercase;color:var(--dim2);margin:14px 0 6px}

/* Entry rendering */
.entry-title{font-size:12px;font-weight:700;color:var(--gold);margin:8px 0 4px}
.entry-list{padding-left:16px;margin:4px 0}
.entry-list li{margin-bottom:3px}
.entry-table{width:100%;border-collapse:collapse;font-size:11px;margin:6px 0}
.entry-table th{text-align:left;padding:4px 6px;border-bottom:1px solid var(--border);color:var(--gold);font-size:10px;letter-spacing:1px}
.entry-table td{padding:3px 6px;border-bottom:1px solid var(--border)}
.entry-inset{border-left:2px solid var(--dim2);padding:6px 10px;margin:6px 0;font-style:italic}
.tag-condition{color:#cc8080}
.tag-skill{color:var(--blue)}

/* ── Inventory ── */
.inv-table{width:100%;border-collapse:collapse;font-size:12px}
.inv-table th{text-align:left;padding:4px 8px;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);border-bottom:1px solid var(--border)}
.inv-table td{padding:5px 8px;border-bottom:1px solid var(--border);vertical-align:middle}
.inv-table tr:hover td{background:rgba(255,255,255,0.02)}
.inv-name{font-weight:600}
.inv-type{display:inline-flex;padding:1px 6px;border-radius:8px;font-size:9px;text-transform:uppercase;letter-spacing:0.5px}
.equipped-dot{width:8px;height:8px;border-radius:50%;display:inline-block;cursor:pointer}
.equipped-dot.on{background:var(--green)}
.equipped-dot.off{background:var(--dim2)}
.currency-row{display:flex;gap:10px;align-items:center}
.currency-coin{text-align:center;flex:1}
.currency-coin label{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);display:block;margin-bottom:4px}
.currency-coin input{width:100%;background:var(--paper);border:1px solid var(--border);border-radius:4px;color:var(--text);padding:5px;font-size:14px;font-family:inherit;outline:none;text-align:center}

/* ── Death saves ── */
.death-saves{display:flex;gap:12px;align-items:center}
.ds-group{display:flex;gap:4px;align-items:center}
.ds-dot{width:16px;height:16px;border-radius:50%;border:1px solid;cursor:pointer;transition:all 0.2s;flex-shrink:0}
.ds-dot.success.filled{background:rgba(64,204,128,0.5);border-color:var(--green)}
.ds-dot.success:not(.filled){border-color:rgba(64,204,128,0.3)}
.ds-dot.failure.filled{background:rgba(139,32,32,0.5);border-color:var(--red)}
.ds-dot.failure:not(.filled){border-color:rgba(139,32,32,0.3)}

/* ── Misc ── */
.rest-row{display:flex;gap:8px;margin-bottom:8px}
.rest-row .wide-btn{justify-content:center}
.below-half{font-size:10px;color:#cc4040;margin-top:4px;letter-spacing:1px}
.dmg-ref{font-size:12px;line-height:1.8;color:var(--dim)}
.dmg-ref strong{color:var(--gold)}
.hidden{display:none !important}
.loading-tab{text-align:center;padding:40px;color:var(--dim);font-size:13px}

/* Notes textareas */
.notes-field{margin-bottom:12px}
.notes-field label{display:block;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);margin-bottom:5px}
.notes-field textarea{width:100%;background:var(--paper);border:1px solid var(--border);border-radius:4px;color:var(--text);padding:8px 10px;font-size:13px;font-family:inherit;outline:none;resize:vertical;line-height:1.6;min-height:80px}
.notes-field textarea:focus{border-color:rgba(232,193,112,0.3)}

/* Item modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px)}
.modal{background:var(--paper);border:1px solid var(--border);border-radius:10px;padding:20px;max-width:420px;width:100%}
.modal h3{font-size:15px;font-weight:700;color:var(--gold);letter-spacing:2px;margin-bottom:14px}
.modal-field{margin-bottom:10px}
.modal-field label{display:block;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--dim);margin-bottom:4px}
.modal-field input,.modal-field select,.modal-field textarea{width:100%;background:var(--paper);border:1px solid var(--border);border-radius:4px;color:var(--text);padding:7px 10px;font-size:13px;font-family:inherit;outline:none}
.modal-field textarea{resize:vertical;min-height:60px}
.modal-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
</style>
</head>
<body>
<div class="wrap sheet-layout">

<!-- Sticky header -->
<div class="sheet-header">
  <div class="header-top">
    <a href="/" class="back-link">← Roster</a>
    <div class="char-name-display" id="charNameDisplay">Loading...</div>
    <button class="btn btn-blue btn-sm" id="editBtn" onclick="openEditForActiveTab()">Edit</button>
    <button class="btn btn-gold btn-sm" id="saveBtn" onclick="manualSave()">Save</button>
  </div>
  <div class="char-identity" id="charIdentity"></div>
</div>

<div class="toolbar-row card" id="toolbarRow">
  <div class="toolbar-left">
    <span class="round-badge" id="toolbarRound">Session</span>
  </div>
  <div class="toolbar-actions">
    <button class="btn btn-gold btn-sm" onclick="doShortRest()">Short Rest</button>
    <button class="btn btn-gold btn-sm" onclick="doLongRest()">Long Rest</button>
  </div>
</div>

<div class="top-row">
  <div class="ability-strip" id="abilityStrip"></div>
  <section class="hp-panel card" id="hpPanel"></section>
</div>

<div class="sheet-grid">
  <aside class="left-col" id="leftCol"></aside>
  <section class="mid-col" id="midCol"></section>
  <section class="right-col" id="rightCol">
    <div class="action-header">
      <div class="action-top-stats" id="actionTopStats"></div>
      <aside class="defense-panel card" id="defensePanel"></aside>
    </div>
    <section class="main-panel card" id="mainPanel">
      <div class="panel-tabs" id="panelTabs">
        <button class="panel-tab active" data-tab="actions" onclick="switchPanelTab('actions')">Actions</button>
        <button class="panel-tab" data-tab="spells" onclick="switchPanelTab('spells')">Spells</button>
        <button class="panel-tab" data-tab="inventory" onclick="switchPanelTab('inventory')">Inventory</button>
        <button class="panel-tab" data-tab="features" onclick="switchPanelTab('features')">Features &amp; Traits</button>
        <button class="panel-tab" data-tab="description" onclick="switchPanelTab('description')">Description</button>
        <button class="panel-tab" data-tab="notes" onclick="switchPanelTab('notes')">Notes</button>
        <button class="panel-tab" data-tab="extras" onclick="switchPanelTab('extras')">Extras</button>
      </div>
      <div class="panel-body">
        <div class="panel-tab-content active" id="panel-actions"></div>
        <div class="panel-tab-content" id="panel-spells"></div>
        <div class="panel-tab-content" id="panel-inventory"></div>
        <div class="panel-tab-content" id="panel-features"></div>
        <div class="panel-tab-content" id="panel-description"></div>
        <div class="panel-tab-content" id="panel-notes"></div>
        <div class="panel-tab-content" id="panel-extras"></div>
      </div>
    </section>
  </section>
</div>

<!-- Item modal -->
<div class="modal-overlay hidden" id="itemModal">
  <div class="modal">
    <h3 id="itemModalTitle">Add Item</h3>
    <div class="modal-field">
      <label>Name</label>
      <input type="text" id="itemName" placeholder="e.g. Longsword +1">
    </div>
    <div class="modal-row">
      <div class="modal-field">
        <label>Type</label>
        <select id="itemType" onchange="toggleWeaponFields(this.value)">
          <option>misc</option>
          <option>weapon</option>
          <option>armor</option>
          <option>consumable</option>
          <option>tool</option>
          <option>treasure</option>
          <option>magic</option>
        </select>
      </div>
      <div class="modal-field">
        <label>Quantity</label>
        <input type="number" id="itemQty" min="1" value="1">
      </div>
    </div>
    <div class="modal-row">
      <div class="modal-field">
        <label>Weight (lbs)</label>
        <input type="number" id="itemWeight" min="0" step="0.5" placeholder="Optional">
      </div>
      <div class="modal-field">
        <label>Value (GP)</label>
        <input type="number" id="itemValue" min="0" step="0.01" placeholder="Optional">
      </div>
    </div>
    <div class="modal-row weapon-fields hidden" id="weaponFields">
      <div class="modal-field">
        <label>Weapon Damage</label>
        <input type="text" id="itemWeaponDamage" placeholder="e.g. 1d8">
      </div>
      <div class="modal-field">
        <label>Attack Bonus</label>
        <input type="number" id="itemWeaponAtk" step="1" placeholder="e.g. 6">
      </div>
    </div>
    <div class="modal-field">
      <label>Notes (damage, magic effects, etc.)</label>
      <textarea id="itemNotes" placeholder="e.g. 1d8+3 slashing, +1 to attack rolls, requires attunement..."></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-dim" onclick="closeItemModal()">Cancel</button>
      <button class="btn btn-gold" onclick="saveItem()">Add Item</button>
    </div>
  </div>
</div>

</div>

<script src="/js/shared.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script>
// ── State ─────────────────────────────────────────────────────────
const charId = new URLSearchParams(location.search).get('id');
let char = null, state = null, progression = null, classFeatures = [], subFeatures = [];
let allSpells = [], spellsById = {};
let spellDetailsById = {};
let spellDetailsByName = {};
let inventory = [], currency = { cp:0, sp:0, ep:0, gp:0, pp:0 };
let panelActiveTab = 'actions';
let actionFilter = 'all';
let panelLoaded = {};
let spellSearchQuery = '';
let editingItemId = null;
let optionalFeatureSelections = {};
let optionalFeatureEditorOpen = {};
let optionalFeaturesById = {};
let collapseState = {};
let featureChoiceSelections = {};
let allOptionalFeatures = [];
let optionalFeaturesByRef = {};
let effectDefinitions = [];
let effectsBySource = { spell: {}, class_feature: {}, optional_feature: {}, feat: {}, race: {} };
let effectsByName = {};
let atWillSpells = new Set();
let noSlotSpells = new Set();
let raceTraits = [];
const tooltipMarkdownCache = new Map();
let tooltipEl = null;
let tooltipContentEl = null;
let tooltipAnchor = null;
let tooltipPinned = false;

const ACTION_TOOLTIP_SPELLS = ['Mage Armor', 'Eldritch Blast'];

function panelStorageKey() {
  return `dnd.sheet.panelTab.${charId || 'unknown'}`;
}

function collapseStorageKey() {
  return `dnd.sheet.collapse.${charId || 'unknown'}`;
}

function loadCollapseState() {
  try {
    const raw = localStorage.getItem(collapseStorageKey());
    return raw ? JSON.parse(raw) : {};
  } catch (e) {
    return {};
  }
}

function saveCollapseState() {
  try {
    localStorage.setItem(collapseStorageKey(), JSON.stringify(collapseState));
  } catch (e) {}
}

function isCardOpen(key) {
  return !!collapseState[key];
}

function setCardOpen(key, open) {
  collapseState[key] = !!open;
  saveCollapseState();
}

function toggleCardById(key, id) {
  const el = document.getElementById(id);
  if (!el) return false;
  const open = !el.classList.contains('open');
  el.classList.toggle('open', open);
  setCardOpen(key, open);
  return open;
}

function loadSavedPanelTab() {
  try {
    const t = localStorage.getItem(panelStorageKey());
    const allowed = new Set(['actions','spells','inventory','features','description','notes','extras']);
    return allowed.has(t) ? t : 'actions';
  } catch (e) {
    return 'actions';
  }
}

function saveActivePanelTab(tab) {
  try {
    localStorage.setItem(panelStorageKey(), tab);
  } catch (e) {}
}

const CONDITIONS = [
  {k:'blinded',n:'Blinded',d:"Can't see; attacks vs you have advantage, your attacks disadvantage."},
  {k:'charmed',n:'Charmed',d:'Can\'t attack charmer; charmer has advantage on social checks vs you.'},
  {k:'deafened',n:'Deafened',d:"Can't hear; auto-fail hearing checks."},
  {k:'frightened',n:'Frightened',d:'Disadvantage on checks/attacks while source is in sight.'},
  {k:'grappled',n:'Grappled',d:'Speed 0; ends if grappler is incapacitated.'},
  {k:'incapacitated',n:'Incapacitated',d:"Can't take actions or reactions."},
  {k:'invisible',n:'Invisible',d:'Attacks vs you disadvantage, your attacks advantage.'},
  {k:'paralyzed',n:'Paralyzed',d:'Incapacitated, can\'t move/speak; hits within 5ft are crits.'},
  {k:'petrified',n:'Petrified',d:'Incapacitated, unaware; resist all damage.'},
  {k:'poisoned',n:'Poisoned',d:'Disadvantage on attack rolls and ability checks.'},
  {k:'prone',n:'Prone',d:'Attacks vs you advantage within 5ft, otherwise disadvantage.'},
  {k:'restrained',n:'Restrained',d:'Speed 0; attacks vs you advantage; DEX saves disadvantage.'},
  {k:'stunned',n:'Stunned',d:"Incapacitated, can't move; attacks vs you advantage."},
  {k:'unconscious',n:'Unconscious',d:"Incapacitated, unaware; hits within 5ft are crits."},
  {k:'exhaustion',n:'Exhaustion',d:'Stacking debuff — 1:Disadv on checks, 3:Disadv on attacks/saves, 5:Speed halved/halved again, 6:Death.'},
];

const DAMAGE_TYPES = [
  'Acid','Bludgeoning','Cold','Fire','Force','Lightning','Necrotic','Piercing','Poison','Psychic','Radiant','Slashing','Thunder'
];

// ── Init ──────────────────────────────────────────────────────────
async function init() {
  if (!charId) { location.href = '/'; return; }
  setupTooltipEvents();
  try {
    [char, state, inventory, currency] = await Promise.all([
      API.get(`/characters/${charId}`),
      API.get(`/characters/${charId}/state`),
      API.get(`/characters/${charId}/inventory`),
      API.get(`/characters/${charId}/currency`),
    ]);

    const effectsPayload = await API.get(`/characters/${charId}/effects`).catch(() => null);
    if (effectsPayload?.effects) {
      effectDefinitions = effectsPayload.effects;
      indexEffectDefinitions(effectDefinitions);
    }

    // Load class data
    if (char.class_id) {
      [progression, classFeatures] = await Promise.all([
        API.get(`/classes/${char.class_id}/progression`),
        API.get(`/classes/${char.class_id}/features?level=${char.level}`),
      ]);
    }
    if (char.subclass_id && char.class_id) {
      subFeatures = await API.get(`/classes/${char.class_id}/subclasses/${char.subclass_id}/features?level=${char.level}`);
    }

    if (char.race_id) {
      const race = await API.get(`/races/${char.race_id}`).catch(() => null);
      raceTraits = collectNamedEntries(race?.data?.entries || []);
    }

    optionalFeatureSelections = char.stat_overrides?.optional_feature_selections || {};
    featureChoiceSelections = char.stat_overrides?.feature_choice_selections || {};
    collapseState = loadCollapseState();
    condPanelOpen = collapseState.cond_panel !== false;
    if (char.class_name) {
      allOptionalFeatures = await API.get('/optional-features').catch(() => []);
      optionalFeaturesByRef = {};
      optionalFeaturesById = {};
      for (const f of allOptionalFeatures) {
        optionalFeaturesById[f.id] = f;
        const key = `${(f.name || '').toLowerCase()}|${(f.source || '').toLowerCase()}`;
        optionalFeaturesByRef[key] = f;
        const nameOnly = (f.name || '').toLowerCase();
        if (!optionalFeaturesByRef[nameOnly]) optionalFeaturesByRef[nameOnly] = f;
      }
      const classOptTypes = extractOptionalFeatureTypes([...(classFeatures || []), ...(subFeatures || [])]);
      if (classOptTypes.length) {
        const groups = await Promise.all(classOptTypes.map(t =>
          API.get(`/optional-features?featureType=${encodeURIComponent(t)}&class=${encodeURIComponent((char.class_name || '').toLowerCase())}&level=${char.level}`).catch(() => [])
        ));
        groups.flat().forEach(f => { optionalFeaturesById[f.id] = f; });
      }
    }

    syncResourceEffects();

    // Load selected spells by ID so chosen spells always render
    if (char.spellcasting_type) {
      const knownIds = [...new Set([...(char.spells_known||[]), ...(char.spellbook||[])])];
      if (knownIds.length) {
        const loaded = await Promise.all(
          knownIds.map(id => API.get(`/spells/${id}`).catch(() => null))
        );
        allSpells = loaded.filter(Boolean);
        for (const s of allSpells) {
          indexSpellDetail(s);
        }
      }
    }

    await ensureActionTooltipSpellsLoaded();

    // Update header
    document.getElementById('charNameDisplay').textContent = char.name.toUpperCase();
    document.title = `${char.name} — DND Tracker`;
    const identity = [char.race_name, char.class_name, char.subclass_name ? `(${char.subclass_name})` : null, `Level ${char.level}`].filter(Boolean).join(' · ');
    document.getElementById('charIdentity').textContent = identity + (char.background_name ? ` · ${char.background_name}` : '') + (char.alignment ? ` · ${char.alignment}` : '');

    renderVitals();
    switchPanelTab(loadSavedPanelTab());

  } catch (err) {
    const holder = document.getElementById('leftCol');
    if (holder) holder.innerHTML = `<div class="loading-tab" style="color:#cc4040">Failed to load: ${err.message}</div>`;
    console.error(err);
  }
}

// ── Panel tab switching ───────────────────────────────────────────
function switchPanelTab(tab) {
  panelActiveTab = tab;
  saveActivePanelTab(tab);
  document.querySelectorAll('.panel-tab').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.tab === tab);
  });
  document.querySelectorAll('.panel-tab-content').forEach(c => c.classList.remove('active'));
  const target = document.getElementById(`panel-${tab}`);
  if (target) target.classList.add('active');
  renderPanelTab(tab);
}

function renderPanelTab(tab) {
  if (panelLoaded[tab]) return;
  if (tab === 'actions') renderActionsTab();
  if (tab === 'spells') renderSpells();
  if (tab === 'inventory') renderInventory();
  if (tab === 'features') renderFeatures();
  if (tab === 'description') renderDescription();
  if (tab === 'notes') renderNotes();
  if (tab === 'extras') renderExtras();
  panelLoaded[tab] = true;
}

function openEditForActiveTab() {
  const stepByTab = {
    actions: 5,
    spells: 4,
    inventory: 5,
    features: 2,
    description: 1,
    notes: 1,
    extras: 5,
  };
  const stepTarget = stepByTab[panelActiveTab] || 1;
  location.href = `/builder.html?edit=${charId}&step=${stepTarget}`;
}

// ── Derived stats ─────────────────────────────────────────────────
function getStats() {
  const stats = calcStats({
    level: char.level,
    ability_scores: char.ability_scores,
    stat_overrides: char.stat_overrides,
    skill_proficiencies: char.skill_proficiencies,
    spellcasting_ability: char.spellcasting_ability,
    class_save_proficiencies: char.class_save_proficiencies || [],
    race_speed: char.race_speed || { walk: 30 },
  });
  if (state?.class_resources?.mage_armor_active) {
    stats.ac = Math.max(stats.ac, 13 + stats.mods.dex);
  }
  if (hasSelectedFeatureName('Defense')) {
    stats.ac += 1;
  }
  return stats;
}

function selectedOptionalFeatureIds() {
  const fromOptions = Object.values(optionalFeatureSelections || {}).flat();
  const fromChoices = Object.values(featureChoiceSelections || {}).flat();
  return [...new Set([...fromOptions, ...fromChoices].filter(Boolean).map(v => parseInt(v, 10)).filter(n => Number.isInteger(n)))];
}

function selectedOptionalFeaturesResolved() {
  const ids = selectedOptionalFeatureIds();
  return ids.map(id => optionalFeaturesById[id]).filter(Boolean);
}

function selectedFeatureNamesLower() {
  return selectedOptionalFeaturesResolved().map(f => (f.name || '').toLowerCase());
}

function hasSelectedFeatureName(name) {
  const n = (name || '').toLowerCase();
  return selectedFeatureNamesLower().includes(n);
}

// ── Save debounce ─────────────────────────────────────────────────
const debouncedSaveState = debounce(pushState, 600);

async function pushState() {
  try {
    await API.put(`/characters/${charId}/state`, {
      hp_current: state.hp_current,
      hp_temp: state.hp_temp,
      hp_temp_source: state.hp_temp_source,
      spell_slots_used: state.spell_slots_used,
      hit_dice_used: state.hit_dice_used,
      prepared_spells: state.prepared_spells,
      concentration: state.concentration,
      active_effects: state.active_effects,
      conditions: state.conditions,
      class_resources: state.class_resources,
      combat_active: state.combat_active,
      combat_round: state.combat_round,
      death_saves: state.death_saves,
      log: state.log,
    });
  } catch(e) { console.warn('State save failed:', e.message); }
}

async function manualSave() {
  const btn = document.getElementById('saveBtn');
  btn.textContent = '...';
  try {
    await pushState();
    await API.put(`/characters/${charId}`, {
      ability_scores: char.ability_scores,
      stat_overrides: char.stat_overrides,
      level: char.level,
    });
    btn.textContent = 'Saved!';
    btn.style.color = '#40cc80';
  } catch(e) { btn.textContent = 'Error'; btn.style.color = '#cc4040'; }
  setTimeout(() => { btn.textContent = 'Save'; btn.style.color = ''; }, 1500);
}

// ── LOG ───────────────────────────────────────────────────────────
function addLog(msg) {
  state.log = state.log || [];
  state.log.unshift({ m: msg, t: Date.now() });
  if (state.log.length > 60) state.log.length = 60;
  const box = document.getElementById('logBox');
  if (box) renderLogBox(box);
  debouncedSaveState();
}

function renderLogBox(box) {

function renderTrackerCombatStats(stats) {
  const cls = (char.class_name || '').toLowerCase();
  const names = selectedFeatureNamesLower();
  const items = [
    { label: 'AC', value: stats.ac },
    { label: 'Initiative', value: modStr(stats.initiative) },
    { label: 'Speed', value: `${stats.speed}ft` },
    { label: 'Prof Bonus', value: `+${stats.pb}` },
    { label: 'Passive Perc', value: stats.passivePerception },
  ];

  if (char.spellcasting_ability) {
    items.push({ label: 'Spell DC', value: stats.spellDC });
    items.push({ label: 'Spell Atk', value: modStr(stats.spellAtk) });
  }

  if (cls === 'monk') {
    const kiDc = 8 + stats.pb + (stats.mods.wis || 0);
    items.push({ label: 'Ki Save DC', value: kiDc });
  }
  if (cls === 'barbarian') {
    const rageDmg = char.level >= 16 ? 4 : char.level >= 9 ? 3 : 2;
    items.push({ label: 'Rage Dmg', value: `+${rageDmg}` });
  }
  if (cls === 'rogue') {
    const sneak = Math.ceil(char.level / 2);
    items.push({ label: 'Sneak Atk', value: `${sneak}d6` });
  }
  if (cls === 'warlock') {
    const bm = char.level >= 17 ? 4 : char.level >= 11 ? 3 : char.level >= 5 ? 2 : 1;
    items.push({ label: 'E.Blast Beams', value: bm });
  }

  if (names.includes('archery')) items.push({ label: 'Ranged Atk', value: '+2' });
  if (names.includes('dueling')) items.push({ label: '1H Weapon Dmg', value: '+2' });
  if (names.includes('blind fighting')) items.push({ label: 'Blindsight', value: '10ft' });

  const notes = [];
  if (names.includes('great weapon fighting')) notes.push('GWF: reroll weapon damage 1-2 (once)');
  if (names.includes('protection')) notes.push('Protection reaction available');
  if (names.includes('interception')) notes.push('Interception reaction available');

  let html = items.map(it => `
    <div class="core-stat">
      <div class="core-stat-val">${it.value}</div>
      <div class="core-stat-lbl">${it.label}</div>
    </div>
  `).join('');

  if (notes.length) {
    html += `<div class="core-stat" style="grid-column:1/-1"><div class="core-stat-val" style="font-size:12px;color:var(--text)">${notes.join(' · ')}</div><div class="core-stat-lbl">Combat Notes</div></div>`;
  }

  return html;
}

function escapeAttr(s) {
  return String(s || '')
    .replace(/&/g, '&amp;')
    .replace(/"/g, '&quot;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

function escapeHtml(s) {
  return String(s || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function normalizeTooltipMarkdown(text) {
  let out = String(text || '').replace(/\r\n/g, '\n').trim();
  if (!out) return '';
  if (typeof renderTagStringMarkdown === 'function') {
    out = renderTagStringMarkdown(out);
  }
  out = out.replace(/\s+At Higher Levels:\s*/gi, '\n\n### At Higher Levels\n');
  if (!out.includes('\n') && out.includes(' · ')) {
    const parts = out.split(/\s+·\s+/).map(p => p.trim()).filter(Boolean);
    if (parts.length > 1) out = `${parts[0]}\n\n- ${parts.slice(1).join('\n- ')}`;
  }
  const split = out.match(/^([^:#\n]{2,60}):\s+([\s\S]+)$/);
  if (split) {
    const title = split[1].trim();
    const body = split[2].trim();
    if (title.split(/\s+/).length <= 8 && !body.startsWith('### ')) out = `### ${title}\n\n${body}`;
  }
  return out;
}

function renderTooltipMarkdown(raw) {
  const source = normalizeTooltipMarkdown(raw);
  if (!source) return '';
  if (tooltipMarkdownCache.has(source)) return tooltipMarkdownCache.get(source);
  let html = `<p>${escapeHtml(source)}</p>`;
  if (window.marked?.parse) {
    try {
      html = window.marked.parse(source, {
        gfm: true,
        breaks: true,
        headerIds: false,
        mangle: false,
      });
    } catch (e) {}
  }
  if (window.DOMPurify?.sanitize) {
    html = window.DOMPurify.sanitize(html, {
      USE_PROFILES: { html: true },
    });
  }
  tooltipMarkdownCache.set(source, html);
  return html;
}

function ensureTooltipElement() {
  if (tooltipEl) return;
  tooltipEl = document.createElement('div');
  tooltipEl.className = 'md-tooltip';
  tooltipEl.hidden = true;
  tooltipEl.id = 'mdTooltip';
  tooltipContentEl = document.createElement('div');
  tooltipContentEl.className = 'md-tooltip-content';
  tooltipEl.appendChild(tooltipContentEl);
  document.body.appendChild(tooltipEl);
}

function positionTooltip(anchor) {
  if (!tooltipEl || !anchor) return;
  const rect = anchor.getBoundingClientRect();
  const margin = 10;
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  tooltipEl.style.width = `min(560px, calc(100vw - ${margin * 2}px))`;

  const tipRect = tooltipEl.getBoundingClientRect();
  const maxLeft = Math.max(margin, vw - tipRect.width - margin);
  let left = rect.left + rect.width / 2 - tipRect.width / 2;
  left = Math.min(maxLeft, Math.max(margin, left));

  let top = rect.top - tipRect.height - 10;
  if (top < margin) top = rect.bottom + 10;
  top = Math.max(margin, Math.min(top, vh - tipRect.height - margin));

  tooltipEl.style.left = `${Math.round(left)}px`;
  tooltipEl.style.top = `${Math.round(top)}px`;
}

function showTooltip(anchor, raw, pin = false) {
  if (!anchor || !raw) return;
  ensureTooltipElement();
  tooltipAnchor = anchor;
  tooltipPinned = !!pin;
  tooltipContentEl.innerHTML = renderTooltipMarkdown(raw);
  tooltipEl.hidden = false;
  tooltipEl.classList.add('visible');
  tooltipEl.classList.toggle('pinned', tooltipPinned);
  positionTooltip(anchor);
}

function hideTooltip(force = false) {
  if (!tooltipEl) return;
  if (tooltipPinned && !force) return;
  tooltipEl.classList.remove('visible', 'pinned');
  tooltipEl.hidden = true;
  tooltipPinned = false;
  tooltipAnchor = null;
}

function setupTooltipEvents() {
  ensureTooltipElement();

  document.addEventListener('mouseover', (event) => {
    if (tooltipPinned) return;
    const trigger = event.target.closest('[data-tip]');
    if (!trigger) return;
    const tip = trigger.getAttribute('data-tip');
    if (!tip) return;
    showTooltip(trigger, tip, false);
  });

  document.addEventListener('mouseout', (event) => {
    if (tooltipPinned) return;
    if (!tooltipAnchor) return;
    const to = event.relatedTarget;
    if (to && (tooltipAnchor.contains(to) || tooltipEl.contains(to))) return;
    hideTooltip();
  });

  document.addEventListener('focusin', (event) => {
    if (tooltipPinned) return;
    const trigger = event.target.closest('[data-tip]');
    if (!trigger) return;
    const tip = trigger.getAttribute('data-tip');
    if (!tip) return;
    showTooltip(trigger, tip, false);
  });

  document.addEventListener('focusout', (event) => {
    if (tooltipPinned) return;
    if (!tooltipAnchor) return;
    const next = event.relatedTarget;
    if (next && (tooltipAnchor.contains(next) || tooltipEl.contains(next))) return;
    hideTooltip();
  });

  document.addEventListener('click', (event) => {
    const trigger = event.target.closest('[data-tip]');
    if (trigger) {
      const tip = trigger.getAttribute('data-tip');
      if (!tip) return;
      if (tooltipPinned && tooltipAnchor === trigger) {
        hideTooltip(true);
      } else {
        showTooltip(trigger, tip, true);
      }
      return;
    }
    if (tooltipPinned && tooltipEl && !tooltipEl.contains(event.target)) {
      hideTooltip(true);
    }
  });

  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') hideTooltip(true);
  });

  window.addEventListener('resize', () => {
    if (tooltipEl && !tooltipEl.hidden && tooltipAnchor) positionTooltip(tooltipAnchor);
  });
  window.addEventListener('scroll', () => {
    if (tooltipEl && !tooltipEl.hidden && tooltipAnchor) positionTooltip(tooltipAnchor);
  }, true);
}

function extractDamageDice(text) {
  const raw = String(text || '');
  const match = raw.match(/\b\d+d\d+(?:\s*[+\-]\s*\d+)?\b/i);
  return match ? match[0].replace(/\s+/g, '') : '';
}

function extractDamageExpression(text) {
  const raw = String(text || '');
  const matches = raw.match(/\b\d+d\d+(?:\s*[+\-]\s*\d+)?\b/gi) || [];
  if (!matches.length) return '';
  return matches.map(m => m.replace(/\s+/g, '')).join('+');
}

function shortDuration(text) {
  const raw = String(text || '').trim();
  if (!raw) return '';
  let t = raw.replace(/^Up to\s+/i, 'Up to ');
  t = t.replace(/minutes?/gi, 'min');
  t = t.replace(/hours?/gi, 'hr');
  t = t.replace(/rounds?/gi, 'rnd');
  t = t.replace(/days?/gi, 'day');
  t = t.replace(/weeks?/gi, 'wk');
  t = t.replace(/months?/gi, 'mo');
  t = t.replace(/years?/gi, 'yr');
  t = t.replace(/Instantaneous/gi, 'Instant');
  return t;
}

function rollDiceExpressionMulti(expr) {
  const raw = String(expr || '').replace(/\s+/g, '');
  if (!raw) return null;
  const tokens = raw.match(/[+\-]?[^+\-]+/g) || [];
  let total = 0;
  const breakdown = [];
  for (const token of tokens) {
    if (!token) continue;
    let sign = 1;
    let t = token;
    if (t[0] === '+') t = t.slice(1);
    else if (t[0] === '-') { sign = -1; t = t.slice(1); }
    if (!t) continue;
    const diceMatch = t.match(/^(\d*)d(\d+)$/i);
    if (diceMatch) {
      const count = parseInt(diceMatch[1] || '1', 10);
      const sides = parseInt(diceMatch[2], 10);
      if (!count || !sides) return null;
      let subtotal = 0;
      const rolls = [];
      for (let i = 0; i < count; i++) {
        const r = Math.floor(Math.random() * sides) + 1;
        rolls.push(r);
        subtotal += r;
      }
      total += sign * subtotal;
      breakdown.push(`${sign < 0 ? '-' : ''}${count}d${sides} (${rolls.join(', ')})`);
      continue;
    }
    if (/^\d+$/.test(t)) {
      const val = parseInt(t, 10);
      total += sign * val;
      breakdown.push(`${sign < 0 ? '-' : ''}${val}`);
      continue;
    }
    return null;
  }
  return { total, breakdown };
}

function rollDiceExpression(expr) {
  const raw = String(expr || '').trim();
  const match = raw.match(/^(\d+)d(\d+)([+-]\d+)?$/i);
  if (!match) return null;
  const count = parseInt(match[1], 10);
  const sides = parseInt(match[2], 10);
  const mod = match[3] ? parseInt(match[3], 10) : 0;
  if (!count || !sides) return null;
  let total = 0;
  const rolls = [];
  for (let i = 0; i < count; i++) {
    const r = Math.floor(Math.random() * sides) + 1;
    rolls.push(r);
    total += r;
  }
  total += mod;
  return { total, rolls, mod };
}

function rollDamage(label, expr, isHealing = false) {
  const opts = typeof isHealing === 'object'
    ? { isHealing: !!isHealing.isHealing, skipModifiers: !!isHealing.skipModifiers, applyHealing: !!isHealing.applyHealing }
    : { isHealing: !!isHealing, skipModifiers: false, applyHealing: false };
  const baseExpr = String(expr || '').trim();
  if (!baseExpr) {
    toast('No damage dice to roll.', 'warn');
    return;
  }
  const modifiers = opts.skipModifiers ? [] : getDamageModifiers(label, { isHealing: opts.isHealing });
  const parts = [{ label: 'Base', expr: baseExpr }];
  for (const mod of modifiers) {
    if (mod?.expr) parts.push(mod);
  }
  let total = 0;
  const detail = [];
  for (const part of parts) {
    const rolled = rollDiceExpressionMulti(part.expr);
    if (!rolled) continue;
    total += rolled.total;
    detail.push(`${part.label}: ${part.expr} = ${rolled.total} (${rolled.breakdown.join(', ')})`);
  }
  if (!detail.length) {
    toast('No damage dice to roll.', 'warn');
    return;
  }
  const displayExpr = buildDamageExpression(label, baseExpr, { isHealing: opts.isHealing });
  addLog(`${label}: ${detail.join(' · ')} => ${total}`);
  toast(`${label}: ${displayExpr} = ${total}`, 'info');
  if (opts.applyHealing) applyHeal(total);
  renderActionEffects();
  return total;
}

function firstEntryText(entries) {
  if (!entries) return '';
  if (typeof entries === 'string') return entries;
  if (Array.isArray(entries)) {
    for (const e of entries) {
      const t = firstEntryText(e);
      if (t) return t;
    }
    return '';
  }
  if (typeof entries === 'object') {
    return firstEntryText(entries.entries || entries.entry || entries.items || '');
  }
  return '';
}

function collectNamedEntries(node, out = []) {
  if (!node) return out;
  if (Array.isArray(node)) {
    node.forEach(n => collectNamedEntries(n, out));
    return out;
  }
  if (typeof node !== 'object') return out;
  if (node.name && (Array.isArray(node.entries) || node.entry || node.items)) {
    out.push(node);
  }
  for (const value of Object.values(node)) {
    if (value && typeof value === 'object') collectNamedEntries(value, out);
  }
  return out;
}

function entriesToTooltipMarkdown(entries, title = '') {
  const list = Array.isArray(entries) ? entries : (entries ? [entries] : []);
  if (!list.length) return '';
  if (typeof renderEntriesMarkdown === 'function') {
    const body = renderEntriesMarkdown(list).trim();
    if (!body) return '';
    return title ? `### ${title}\n\n${body}` : body;
  }
  const fallback = toPlainEntryText(list);
  if (!fallback) return '';
  return title ? `### ${title}\n\n${fallback}` : fallback;
}

function buildWeaponTooltipMarkdown(item, hitdc, damage) {

  if (notes) md += `\n\n#### Notes\n\n${notes}`;

}

function getSpellTooltip(spell) {

  const hl = detail?.data?.entriesHigherLevel || detail?.entriesHigherLevel;
  const hlText = entriesToTooltipMarkdown(hl || []);
  if (hlText) {
    const hasHigherHeading = /^\s{0,3}#{1,6}\s+At Higher Levels\b/im.test(hlText);

      ? `${text}\n\n${hlText}`.trim()

function indexEffectDefinitions(effects) {
  effectsBySource = { spell: {}, class_feature: {}, optional_feature: {}, feat: {}, race: {} };
  effectsByName = {};
  atWillSpells = new Set();
  noSlotSpells = new Set();
  (effects || []).forEach(effect => {
    if (!effect) return;
    const source = effect.source || {};
    if (source.type && source.id !== undefined && source.id !== null) {
      if (!effectsBySource[source.type]) effectsBySource[source.type] = {};
      effectsBySource[source.type][source.id] = effect;
    }
    if (effect.name) effectsByName[String(effect.name).toLowerCase()] = effect;
    (effect.modifiers || []).forEach(mod => {
      if (!mod?.value?.spell) return;
      const key = String(mod.value.spell).toLowerCase();
      if (mod.kind === 'cast_at_will') atWillSpells.add(key);
      if (mod.kind === 'no_slot') noSlotSpells.add(key);
      if (mod.kind === 'grant_spell' && mod.tags?.includes('spell_at_will')) atWillSpells.add(key);
    });
  });
}

function isSpellNoSlot(name) {

    }
    if (mod.kind === 'add_flat') {
      const v = mod.value?.amount ?? mod.value;
      if (typeof v === 'number' && v !== 0) parts.push(modStr(v));
    }
  }
  return parts;
}

function buildDamageExpressionFromParts(parts) {
  if (!parts.length) return '';
  let expr = '';
  parts.forEach(part => {
    if (!part) return;
    const p = String(part).trim();
    if (!p) return;
    if (!expr) {
      expr = p;
      return;
    }
    if (p.startsWith('+') || p.startsWith('-')) {
      expr = `${expr} ${p}`;
    } else {
      expr = `${expr} + ${p}`;
    }
  });
  return expr;
}

async function resolveActionDamage(actionName, actionTags = [], filter = null) {
  if (!actionName) return null;
  const context = {
    action: { name: actionName, tags: actionTags },
    roll: { type: 'damage' },
  };
  try {
    const res = await API.post(`/characters/${charId}/effects/resolve`, {
      context,
      active_effects: state?.active_effects || [],
      filter,
    });
    return res?.modifiers || [];
  } catch (e) {
    return null;
  }
}

function buildDamageExpressionFromModifiers(modifiers, stats, opts = {}) {
  if (!Array.isArray(modifiers)) return '';
  const parts = [];
  for (const mod of modifiers) {
    if (mod.kind === 'add_dice' && mod.target === (opts.isHealing ? 'healing' : 'damage')) {
      if (mod.value?.dice) parts.push(String(mod.value.dice));
    }
    if (mod.kind === 'add_ability_mod') {
      const ability = mod.value?.ability;
      if (!ability) continue;
      let value = 0;
      if (ability === 'spellcasting') value = stats.spellMod || 0;
      else if (char?.ability_scores?.[ability] !== undefined) value = abilityMod(char.ability_scores[ability]);
      if (value) parts.push(modStr(value));
    }
    if (mod.kind === 'add_flat') {
      const v = mod.value?.amount ?? mod.value;
      if (typeof v === 'number' && v !== 0) parts.push(modStr(v));
    }
  }
  return buildDamageExpressionFromParts(parts);
}

async function resolveDamageForRows(rootEl, selector, tags = [], filter = null) {
  if (!rootEl) return;
  const rows = [...rootEl.querySelectorAll(selector)];
  if (!rows.length) return;
  const stats = getStats();
  const jobs = rows.map(row => {
    const actionName = row.getAttribute('data-action-name');
    const btn = row.querySelector('.action-dmg-btn');
    const isHealing = row.getAttribute('data-action-healing') === 'true';
    if (!actionName || !btn) return null;
    return { row, actionName, btn, isHealing };
  }).filter(Boolean);

  const resolved = await Promise.all(jobs.map(j => resolveActionDamage(j.actionName, tags, filter)));
  resolved.forEach((mods, idx) => {
    if (!mods) return;
    const j = jobs[idx];
    const modExpr = buildDamageExpressionFromModifiers(mods, stats, { isHealing: j.isHealing });
    const baseExpr = j.row.getAttribute('data-action-base-damage') || '';
    const expr = baseExpr && modExpr
      ? buildDamageExpressionFromParts([baseExpr, modExpr])
      : (baseExpr || modExpr);
    if (!expr) return;
    j.btn.textContent = buildDamageExpression(j.actionName, expr, { isHealing: j.isHealing });
    j.btn.setAttribute('onclick', `rollDamage('${escapeAttr(j.actionName)}','${escapeAttr(expr)}',${JSON.stringify({ isHealing: j.isHealing, skipModifiers: true })})`);
  });
}

function shorten(text, max = 160) {
  const t = String(text || '').trim();
  if (!t) return '';
  if (t.length <= max) return t;
  return `${t.slice(0, max - 1)}…`;
}

function buildNotesFromEffect(effect, extra = []) {
  const notes = Array.isArray(extra) ? [...extra] : [];
  const rules = effectRulesText(effect);
  if (rules) notes.push(shorten(rules, 140));
  const conds = effectConditions(effect);
  if (conds.length) notes.push(`Applies: ${conds.map(c => String(c)).join(', ')}`);
  return notes.filter(Boolean).join(' · ');
}

function toggleSaveProficiency(ab, ev) {
  if (!ab) return;
  char.stat_overrides = char.stat_overrides || {};
  if (ev?.shiftKey) {
    if (char.stat_overrides.save_proficiencies) {
      delete char.stat_overrides.save_proficiencies;
      toast('Saving throw proficiencies reset to class defaults.', 'info');
      API.put(`/characters/${charId}`, { stat_overrides: char.stat_overrides }).catch(()=>{});
      renderVitals();
    }
    return;
  }

  const base = char.stat_overrides.save_proficiencies
    ? [...char.stat_overrides.save_proficiencies]
    : [...(char.class_save_proficiencies || [])];
  const idx = base.indexOf(ab);
  if (idx >= 0) base.splice(idx, 1);
  else base.push(ab);

  const order = Object.keys(ABILITY_NAMES);
  base.sort((a, b) => order.indexOf(a) - order.indexOf(b));
  char.stat_overrides.save_proficiencies = base;
  toast(`Saving throw ${ABILITY_FULL[ab]} ${idx >= 0 ? 'removed' : 'added'}.`, 'success');
  API.put(`/characters/${charId}`, { stat_overrides: char.stat_overrides }).catch(()=>{});
  renderVitals();
}

function toggleSkillProficiency(key, ev) {
  if (!key) return;
  char.stat_overrides = char.stat_overrides || {};
  if (ev?.shiftKey) {
    if (char.stat_overrides.skill_proficiencies) {
      delete char.stat_overrides.skill_proficiencies;
      toast('Skill proficiencies reset to builder values.', 'info');
      API.put(`/characters/${charId}`, { stat_overrides: char.stat_overrides }).catch(()=>{});
      renderVitals();
    }
    return;
  }

  const base = char.stat_overrides.skill_proficiencies
    ? { ...char.stat_overrides.skill_proficiencies }
    : { ...(char.skill_proficiencies || {}) };
  const current = base[key];
  const next = current === 'proficient' ? 'expertise' : current === 'expertise' ? null : 'proficient';
  if (next) base[key] = next;
  else delete base[key];
  char.stat_overrides.skill_proficiencies = base;
  const label = SKILLS.find(sk => sk.key === key)?.name || key;
  toast(`${label}: ${next || 'none'}`, 'success');
  API.put(`/characters/${charId}`, { stat_overrides: char.stat_overrides }).catch(()=>{});
  renderVitals();
}

function renderSlotSection(prog) {
  if (!prog || !char.spellcasting_type) {
    // Hit dice only
    return renderHitDiceCard();
  }
  const isPact = char.caster_progression === 'pact';
  const slots = prog.spell_slots || [];
  const used = state.spell_slots_used || {};

  let html = `<div class="card"><div class="card-label">⚡ Spell Slots</div>`;
  if (isPact) {
    const pactIdx = slots.findIndex(n => n > 0);
    if (pactIdx >= 0) {
      const total = slots[pactIdx];
      const usedCount = used[pactIdx] || 0;
      html += `<div class="slot-row"><div class="slot-row-label">Spell Slots ${total - usedCount}/${total} Level ${pactIdx + 1}</div><div class="slot-dots">`;
      for (let i = 0; i < total; i++) {
        html += `<div class="slot-dot ${i < usedCount ? 'empty' : 'full'}" onclick="toggleSlot(${pactIdx},${i},${total})"></div>`;
      }
      html += `</div></div>`;
    }
  } else {
    for (let lvl = 0; lvl < 9; lvl++) {
      const total = slots[lvl] || 0;
      if (!total) continue;
      const usedCount = used[lvl] || 0;
      html += `<div class="slot-row"><div class="slot-row-label">${ordinal(lvl+1)} Level</div><div class="slot-dots">`;
      for (let i = 0; i < total; i++) {
        html += `<div class="slot-dot ${i < usedCount ? 'empty' : 'full'}" onclick="toggleSlot(${lvl},${i},${total})"></div>`;
      }
      html += `</div></div>`;
    }
  }
  html += `</div>`;
  html += renderHitDiceCard();
  return html;
}

  if (ct.includes('bonus action')) return 'bonus';
  if (ct.includes('reaction')) return 'reaction';
  if (ct.includes('action')) return 'action';
  return 'other';

  updateActionFilterUI();
  applyActionFilter(type);

function updateActionFilterUI() {
  document.querySelectorAll('.action-filter').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.filter === actionFilter);
  });
}

function applyActionFilter(type) {
  const grid = document.getElementById('actionsGrid');
  if (!grid) return;
  const items = grid.querySelectorAll('[data-action-type]');
  let any = false;
  items.forEach(el => {
    const t = el.getAttribute('data-action-type') || 'other';
    const show = type === 'all' || t === type;
    el.classList.toggle('hidden', !show);
    if (show) any = true;
  });
  const empty = document.getElementById('actionsEmpty');
  if (empty) empty.remove();
  if (!any && items.length) {
    grid.insertAdjacentHTML('beforeend', `<div id="actionsEmpty" class="loading-tab" style="grid-column:1/-1">No actions match this filter.</div>`);
  }
}

function renderActions() {
  const grid = document.getElementById('actionsGrid');
  const dmgCard = document.getElementById('dmgRefCard');
  if (!grid) return;

  const res = state.class_resources || {};
  const cls = (char.class_name || '').toLowerCase();
  const stats = getStats();
  const lvlProg = progression?.find(r => r.level === char.level);

  let buttons = [];

  // ── Warlock ──────────────────────────────────────────────────
  if (cls === 'warlock') {
    // Eldritch Blast
    const ebEffect = getEffectByName('Eldritch Blast') || getEffectForSpell(spellDetailsByName['eldritch blast']);
    const ebBaseParts = effectDamageParts(ebEffect, stats);
    const ebDamage = buildDamageExpressionFromParts(ebBaseParts.length ? ebBaseParts : ['1d10']);
    const ebTooltip = effectTooltipText(ebEffect, 'Eldritch Blast') || getActionTooltip('eldritch_blast', 'Eldritch Blast');
    const ebNotes = buildNotesFromEffect(ebEffect);
    buttons.push(spellBtn('⚡ Eldritch Blast', '#50a0dc', false, false, "", ebTooltip, 'attack', {
      range: '120 ft',
      hitdc: `+${stats.spellAtk}`,
      damage: ebDamage,
      notes: ebNotes,
      isSpell: true,
      actionKind: 'spell',
      actionName: 'Eldritch Blast',
    }));

    // Vampiric Bite (Dhampir / Undead flavor)
    if (char.race_name?.toLowerCase().includes('dhampir') || char.subclass_name?.toLowerCase().includes('undead')) {
      const biteEffect = getEffectByName('Vampiric Bite');
      const biteTooltip = effectTooltipText(biteEffect, 'Vampiric Bite') || getActionTooltip('vampiric_bite', 'Vampiric Bite');
      const biteNotes = buildNotesFromEffect(biteEffect);
      buttons.push(spellBtn('🦇 Vampiric Bite', '#cc4040', false, res.bite_used, 'useBite()', biteTooltip, 'attack', {
        range: '5 ft',
        hitdc: `+${abilityMod(char.ability_scores?.con || 10)}`,
        damage: buildDamageExpressionFromParts(effectDamageParts(biteEffect, stats)) || '1d4',
        notes: biteNotes,
        actionKind: 'feature',
        actionName: 'Vampiric Bite',
      }));
    }

    // Form of Dread (Undead patron)
    if (char.subclass_name?.toLowerCase().includes('undead')) {
      const fuMax = char.level >= 15 ? 4 : char.level >= 10 ? 3 : 2;
      const fuUsed = res.form_uses || 0;
      const formActive = !!res.form_active;
      const fodEffect = getEffectByName('Form of Dread');
      const fodTooltip = effectTooltipText(fodEffect, 'Form of Dread') || getActionTooltip('form_of_dread', 'Form of Dread');
      const fodNotes = buildNotesFromEffect(fodEffect);
      buttons.push(spellBtn(`💀 Form of Dread (${fuMax - fuUsed}/${fuMax})`, '#9860cc', formActive, !formActive && fuUsed >= fuMax, 'activateForm()', fodTooltip, 'action', { range: 'Self', useAction: true, notes: fodNotes, actionKind: 'feature', actionName: 'Form of Dread' }));
    }

    if (hasSelectedFeatureName('Armor of Shadows')) {
      const mageArmorActive = !!res.mage_armor_active;
      const maEffect = getEffectByName('Mage Armor');
      const maTooltip = effectTooltipText(maEffect, 'Mage Armor') || getActionTooltip('mage_armor', 'Mage Armor');
      const maNotes = buildNotesFromEffect(maEffect);
      buttons.push(spellBtn('🛡 Mage Armor', '#50a0dc', mageArmorActive, false, 'toggleMageArmor()', maTooltip, 'action', {
        range: 'Self',
        isSpell: true,
        actionKind: 'spell',
        actionName: 'Mage Armor',
        notes: maNotes,
        useAction: true,
      }));
    }
  }

  // ── Barbarian ─────────────────────────────────────────────────
  if (cls === 'barbarian') {
    const rageMax = char.level >= 20 ? 999 : char.level >= 17 ? 6 : char.level >= 13 ? 5 : char.level >= 9 ? 4 : char.level >= 6 ? 3 : 2;
    const ragesUsed = res.rages_used || 0;
    const raging = !!res.raging;
    const rageEffect = getEffectByName('Rage');
    const rageTooltip = effectTooltipText(rageEffect, 'Rage') || getActionTooltip('rage', 'Rage');

    buttons.push(spellBtn(`⚔ Rage (${rageMax - ragesUsed}/${rageMax})`, '#cc4040', raging, !raging && ragesUsed >= rageMax, 'toggleRage()', rageTooltip, 'bonus', { range: 'Self', notes: rageNotes, actionKind: 'feature', actionName: 'Rage' }));
    if (char.level >= 2) {
      const recklessEffect = getEffectByName('Reckless Attack');
      const recklessTooltip = effectTooltipText(recklessEffect, 'Reckless Attack') || getActionTooltip('reckless_attack', 'Reckless Attack');

      buttons.push(spellBtn('🛡 Reckless Attack', '#cc6040', !!res.reckless, false, 'toggleReckless()', recklessTooltip, 'attack', { range: 'Self', notes: recklessNotes, actionKind: 'feature', actionName: 'Reckless Attack' }));
    }
  }

  // ── Fighter ───────────────────────────────────────────────────
  if (cls === 'fighter') {
    const swEffect = getEffectByName('Second Wind');
    const swTooltip = effectTooltipText(swEffect, 'Second Wind') || getActionTooltip('second_wind', 'Second Wind');
    const swNotes = buildNotesFromEffect(swEffect);
    buttons.push(spellBtn('🔄 Second Wind', '#40cc80', false, !!res.second_wind_used, 'useSecondWind()', swTooltip, 'bonus', {
      range: 'Self',
      notes: swNotes,
      actionKind: 'feature',
      actionName: 'Second Wind',
      damage: `1d10+${char.level}`,
      isHealing: true,
      forceOnclick: true,
    }));
    if (char.level >= 2) {
      const asMax = char.level >= 17 ? 3 : char.level >= 2 ? 1 : 0;
      const asUsed = res.action_surge_used || 0;
      const asEffect = getEffectByName('Action Surge');
      const asTooltip = effectTooltipText(asEffect, 'Action Surge') || getActionTooltip('action_surge', 'Action Surge');
      const asNotes = buildNotesFromEffect(asEffect);
      buttons.push(spellBtn(`⚡ Action Surge (${asMax - asUsed}/${asMax})`, '#e8c170', false, asUsed >= asMax, 'useActionSurge()', asTooltip, 'action', { range: 'Self', notes: asNotes, actionKind: 'feature', actionName: 'Action Surge' }));
    }
    if (char.level >= 9) {
      const indEffect = getEffectByName('Indomitable');
      const indTooltip = effectTooltipText(indEffect, 'Indomitable') || getActionTooltip('indomitable', 'Indomitable');
      const indNotes = buildNotesFromEffect(indEffect);
      buttons.push(spellBtn('🔁 Indomitable', '#6080cc', false, !!res.indomitable_used, 'useIndomitable()', indTooltip, 'other', { range: 'Self', notes: indNotes, actionKind: 'feature', actionName: 'Indomitable' }));
    }
  }

  // ── Monk ──────────────────────────────────────────────────────
  if (cls === 'monk') {
    const kiMax = char.level;
    const kiUsed = res.ki_used || 0;
    const kiEffect = getEffectByName('Ki');
    const kiTooltip = effectTooltipText(kiEffect, 'Ki') || getActionTooltip('ki', 'Ki');
    const kiNotes = buildNotesFromEffect(kiEffect);
    buttons.push(spellBtn(`✨ Ki (${kiMax - kiUsed}/${kiMax})`, '#e8c170', false, kiUsed >= kiMax, 'useKi(1)', kiTooltip, 'bonus', { range: 'Self', notes: kiNotes, actionKind: 'feature', actionName: 'Ki' }));
    const fobEffect = getEffectByName('Flurry of Blows');
    const fobTooltip = effectTooltipText(fobEffect, 'Flurry of Blows') || getActionTooltip('flurry_of_blows', 'Flurry of Blows');
    const fobNotes = buildNotesFromEffect(fobEffect, kiNotes ? [kiNotes] : []);
    buttons.push(spellBtn('👊 Flurry of Blows', '#cc6040', false, (res.ki_used||0)+2 > kiMax, 'useKi(2)', fobTooltip, 'bonus', { range: 'Melee', notes: fobNotes, actionKind: 'feature', actionName: 'Flurry of Blows' }));
    if (char.level >= 2) {
      const sowEffect = getEffectByName('Step of the Wind');
      const sowTooltip = effectTooltipText(sowEffect, 'Step of the Wind') || getActionTooltip('step_of_wind', 'Step of the Wind');
      const sowNotes = buildNotesFromEffect(sowEffect, kiNotes ? [kiNotes] : []);
      buttons.push(spellBtn('🏃 Step of Wind', '#50a0dc', false, (res.ki_used||0)+1 > kiMax, 'useKi(1)', sowTooltip, 'bonus', { range: 'Self', notes: sowNotes, actionKind: 'feature', actionName: 'Step of the Wind' }));
    }
    if (char.level >= 2) {
      const pdEffect = getEffectByName('Patient Defense');
      const pdTooltip = effectTooltipText(pdEffect, 'Patient Defense') || getActionTooltip('patient_defense', 'Patient Defense');
      const pdNotes = buildNotesFromEffect(pdEffect, kiNotes ? [kiNotes] : []);
      buttons.push(spellBtn('🛡 Patient Defense', '#9860cc', false, (res.ki_used||0)+1 > kiMax, 'useKi(1)', pdTooltip, 'bonus', { range: 'Self', notes: pdNotes, actionKind: 'feature', actionName: 'Patient Defense' }));
    }
  }

  // ── Rogue ─────────────────────────────────────────────────────
  if (cls === 'rogue') {
    const sneak = Math.ceil(char.level / 2);
    const saEffect = getEffectByName('Sneak Attack');
    const saTooltip = effectTooltipText(saEffect, 'Sneak Attack') || getActionTooltip('sneak_attack', 'Sneak Attack');
    const saNotes = buildNotesFromEffect(saEffect);
    const saActive = isEffectActive('Sneak Attack');
    buttons.push(spellBtn(`🗡 Sneak Attack (${sneak}d6)`, '#cc9040', saActive, false, 'toggleSneakAttack()', saTooltip, 'attack', {
      range: 'Melee/Ranged',
      damage: `${sneak}d6`,
      notes: saNotes,
      actionKind: 'feature',
      actionName: 'Sneak Attack',
      forceOnclick: true,
    }));
    if (char.level >= 2) {
      const caEffect = getEffectByName('Cunning Action');
      const caTooltip = effectTooltipText(caEffect, 'Cunning Action') || getActionTooltip('cunning_action', 'Cunning Action');
      const caNotes = buildNotesFromEffect(caEffect);
      buttons.push(spellBtn('🌪 Cunning Action', '#50a0dc', false, false, `addLog('Cunning Action: Dash, Disengage, or Hide as bonus action')`, caTooltip, 'bonus', { range: 'Self', notes: caNotes, actionKind: 'feature', actionName: 'Cunning Action' }));
    }
  }

  // ── Sorcerer ──────────────────────────────────────────────────

    const mmTooltip = effectTooltipText(mmEffect, 'Metamagic') || getActionTooltip('metamagic', 'Metamagic');

    buttons.push(spellBtn('🔄 Metamagic', '#cc60cc', false, false, `addLog('Metamagic applied')`, mmTooltip, 'other', { range: 'Self', notes: mmNotes, actionKind: 'feature', actionName: 'Metamagic' }));
  }

  // ── Paladin ───────────────────────────────────────────────────
  if (cls === 'paladin') {
    const lohPool = res.lay_on_hands_pool ?? char.level * 5;
    const lohEffect = getEffectByName('Lay on Hands');
    const lohTooltip = effectTooltipText(lohEffect, 'Lay on Hands') || getActionTooltip('lay_on_hands', 'Lay on Hands');
    const lohNotes = buildNotesFromEffect(lohEffect);
    buttons.push(spellBtn(`🙏 Lay on Hands (${lohPool} HP)`, '#40cc80', false, lohPool <= 0, 'useLayOnHands()', lohTooltip, 'action', { range: 'Touch', notes: lohNotes, actionKind: 'feature', actionName: 'Lay on Hands' }));

      const smiteEffect = getEffectByName('Divine Smite');
      const smiteTooltip = effectTooltipText(smiteEffect, 'Divine Smite') || getActionTooltip('divine_smite', 'Divine Smite');
      const smiteNotes = buildNotesFromEffect(smiteEffect);
      buttons.push(spellBtn('⚔ Divine Smite', '#e8c170', false, false, `addLog('Divine Smite: expend a spell slot for 2d8 radiant + 1d8 per slot level above 1st')`, smiteTooltip, 'attack', { range: 'Melee', damage: '2d8', notes: smiteNotes, actionKind: 'feature', actionName: 'Divine Smite' }));

  // ── Bard ──────────────────────────────────────────────────────
  if (cls === 'bard') {
    const biDie = char.level >= 15 ? 'd12' : char.level >= 10 ? 'd10' : char.level >= 5 ? 'd8' : 'd6';

    buttons.push(spellBtn(`🎵 Bardic Inspiration (${biRemain}/${biMax} ${biDie})`, '#cc9040', false, biRemain <= 0, 'useBardicInspiration()', biTooltip, 'bonus', { range: '60 ft', notes: biNotes, actionKind: 'feature', actionName: 'Bardic Inspiration' }));

  // ── Druid ─────────────────────────────────────────────────────
  if (cls === 'druid') {
    const wcMax = char.level >= 18 ? 999 : char.level >= 6 ? 2 : char.level >= 2 ? 1 : 0;
    const wcUsed = res.wild_shape_used || 0;
    if (wcMax > 0) {

  // ── Cleric ────────────────────────────────────────────────────
  if (cls === 'cleric') {
    if (char.level >= 2) {
      const cdUsed = res.channel_divinity_used || 0;
