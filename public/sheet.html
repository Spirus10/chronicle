      buttons.push(spellBtn(`✝ Channel Divinity (${cdMax - cdUsed}/${cdMax})`, '#e8c170', false, cdUsed >= cdMax, 'useChannelDivinity()', cdTooltip, 'action', { range: 'Self', notes: cdNotes, actionKind: 'feature', actionName: 'Channel Divinity' }));
    }
  }

  // ── Weapons (equipped) ─────────────────────────────────────────
  const weaponItems = (inventory || []).filter(i => i.item_type === 'weapon' && i.equipped);
  if (weaponItems.length) {
    for (const item of weaponItems) {
      const atkBonus = item.weapon_atk_bonus == null
        ? (stats.pb + (stats.mods?.str || 0))
        : parseInt(item.weapon_atk_bonus, 10);
      const hitdc = Number.isFinite(atkBonus) ? modStr(atkBonus) : '—';
      const dmg = item.weapon_damage || '';
      const notes = item.notes || '';
      const tooltip = buildWeaponTooltipMarkdown(item, hitdc, dmg || '—');
      buttons.push(spellBtn(`⚔ ${item.name}`, '#cc6040', false, false, `addLog('Attack: ${escapeAttr(item.name)}')`, tooltip, 'attack', {
        range: '—',
        hitdc,
        damage: dmg,
        baseDamage: dmg,
        notes,
        actionKind: 'weapon',
        actionName: item.name,
      }));
    }
  }

  // ── Generic spellcaster quick-actions ────────────────────────
  if (hasSelectedFeatureName('Protection')) {
    const protEffect = getEffectByName('Protection');
    const protTooltip = effectTooltipText(protEffect, 'Protection') || getActionTooltip('protection', 'Protection');
    const protNotes = buildNotesFromEffect(protEffect);
    buttons.push(spellBtn('🛡 Protection (Reaction)', '#6080cc', false, false, `addLog('Protection: impose disadvantage on attack vs ally within 5 ft')`, protTooltip, 'reaction', { range: '5 ft', notes: protNotes, actionKind: 'feature', actionName: 'Protection' }));
  }
  if (hasSelectedFeatureName('Interception')) {
    const intEffect = getEffectByName('Interception');
    const intTooltip = effectTooltipText(intEffect, 'Interception') || getActionTooltip('interception', 'Interception');
    const intNotes = buildNotesFromEffect(intEffect);
    buttons.push(spellBtn('🛡 Interception (Reaction)', '#6080cc', false, false, `addLog('Interception: reduce damage by 1d10 + PB')`, intTooltip, 'reaction', { range: '5 ft', notes: intNotes, actionKind: 'feature', actionName: 'Interception' }));
  }

  // ── Generic spellcaster quick-actions ────────────────────────
  const knownSpells = (char.spells_known || []).concat(char.spellbook || []);
  if (knownSpells.length && char.spellcasting_type) {
    const quickSpells = allSpells
      .filter(s => knownSpells.includes(s.id) && s.level > 0)
      .sort((a, b) => (a.level - b.level) || a.name.localeCompare(b.name));
    for (const sp of quickSpells) {
      const noSlots = isSpellNoSlot(sp.name) ? false : checkNoSlots(sp.level);
      const isConc = sp.concentration;
      const isAgathys = (sp.name || '').toLowerCase() === 'armor of agathys';
      const isActive = state.concentration === sp.name || (isAgathys && state.hp_temp_source === 'agathys' && (state.hp_temp || 0) > 0);
      const spellEffect = getEffectForSpell(spellDetailsById[sp.id] || sp);
      const effectMeta = spellEffect?.meta || {};
      const hitdc = (effectMeta.saving_throw && effectMeta.saving_throw.length)
        ? `DC ${stats.spellDC}`
        : (effectMeta.spell_attack && effectMeta.spell_attack.length)
          ? `+${stats.spellAtk}`
          : (sp.saving_throw || sp.save || sp.saving_throw_ability)
            ? `DC ${stats.spellDC}`
            : (sp.attack_type || sp.attack_roll ? `+${stats.spellAtk}` : '—');
      const noteParts = [];
      const comps = formatComponents(sp.components);
      if (comps && comps !== '—') noteParts.push(comps);
      if (sp.duration_text) noteParts.push(shortDuration(sp.duration_text));
      if (sp.concentration) noteParts.push('Concentration');
      if (sp.ritual) noteParts.push('Ritual');
      const isHex = String(sp.name || '').toLowerCase() === 'hex';
      const isHeal = isHealingSpell(sp.name);
      const detail = spellDetailsById[sp.id] || sp;
      const dmgExpr = isHex ? '' : buildDamageExpressionFromParts(isHeal ? effectHealingParts(spellEffect, stats) : effectDamageParts(spellEffect, stats));
      const tooltip = getSpellTooltip(sp) || effectTooltipText(spellEffect, sp.name);
      const notes = buildNotesFromEffect(spellEffect, noteParts);
      buttons.push(spellBtn(`${isConc ? '👁 ' : ''}${sp.name}`, isConc ? '#b48c3c' : '#6080cc', isActive, noSlots && !isActive, `quickCast(${sp.id})`, tooltip, inferSpellActionType(sp), {
        range: sp.range_text || '—',
        hitdc,
        notes,
        damage: dmgExpr,
        useAction: isHex,
        isSpell: true,
        isHealing: isHeal,
        actionKind: 'spell',
        actionName: sp.name,
      }));
    }
  }

  if (!buttons.length) {
    grid.innerHTML = `<div class="loading-tab" style="grid-column:1/-1">No actions available.</div>`;
    return;
  }
  grid.innerHTML = buttons.join('');
  updateActionFilterUI();
  applyActionFilter(actionFilter);
  resolveActionDamageForRenderedActions();

  // Damage reference for Warlock
  if (cls === 'warlock' && dmgCard) {
    dmgCard.style.display = 'block';
    const bm = char.level >= 17 ? 4 : char.level >= 11 ? 3 : char.level >= 5 ? 2 : 1;
    const chaMod = abilityMod(char.ability_scores?.cha || 10);
    let dr = `<div><strong>Eldritch Blast</strong>: ${bm}×(1d10+${chaMod}) = avg ${((5.5 + chaMod) * bm).toFixed(1)}</div>`;
    if (char.level >= 5) dr += `<div><strong>Repelling Blast</strong>: ${bm * 10}ft push</div>`;
    document.getElementById('dmgRef').innerHTML = dr;
  }
}

async function resolveActionDamageForRenderedActions() {
  const grid = document.getElementById('actionsGrid');
  if (!grid) return;
  await resolveDamageForRows(grid, '.action-row[data-action-kind="spell"]', ['spell'], { action_type: 'spell' });
  await resolveDamageForRows(grid, '.action-row[data-action-kind="weapon"]', ['weapon'], { action_type: 'weapon' });
}

function refreshSpellDamageResolution() {
  const spellGrid = document.getElementById('spellGrid');
  if (!spellGrid) return;
  resolveDamageForRows(spellGrid, '.action-row[data-action-kind="spell"]', ['spell'], { action_type: 'spell' });
}

function spellBtn(label, color, active, dim, onclick, tooltip = '', type = 'other', meta = {}) {
  const actionName = meta.actionName || label;
  const tip = escapeAttr(tooltip || label);
  const name = escapeHtml(label);
  const range = escapeHtml(meta.range || '—');
  const hitdc = escapeHtml(meta.hitdc || '—');
  const noteText = meta.notes || '';
  const notes = escapeHtml(noteText || '');
  const dmgFromMeta = meta.damage || '';
  const dmgFromTip = meta.useAction
    ? ''
    : (meta.isHealing
      ? (extractDamageDice(tooltip) || extractDamageDice(label))
      : (extractDamageExpression(tooltip) || extractDamageExpression(label)));
  const rollExpr = dmgFromMeta || dmgFromTip;
  const displayExpr = rollExpr ? buildDamageExpression(label, rollExpr, { isHealing: meta.isHealing }) : '';
  const fallbackLabel = meta.useAction ? 'Use' : (meta.isSpell ? 'Cast' : 'Use');
  const damage = escapeHtml(displayExpr || fallbackLabel);
  const useDisabled = dim ? 'disabled' : '';
  const rowStyle = dim ? 'opacity:0.55;' : '';
  const btnClass = 'action-dmg-btn';
  const useRollAction = rollExpr && !meta.forceOnclick;
  const btnAction = useRollAction
    ? `rollDamage('${escapeAttr(label)}','${escapeAttr(rollExpr)}',${meta.isHealing ? 'true' : 'false'})`
    : onclick;
  return `
    <div class="action-row" data-action-type="${type}" data-action-name="${escapeAttr(actionName)}" data-action-kind="${escapeAttr(meta.actionKind || '')}" data-action-healing="${meta.isHealing ? 'true' : 'false'}" data-action-base-damage="${escapeAttr(meta.baseDamage || '')}" style="border-color:${active ? color : 'var(--border)'};${rowStyle}">
      <div class="action-name" data-tip="${tip}" style="color:${active ? color : 'var(--text)'}">${name}</div>
      <div class="action-range">${range}</div>
      <div class="action-hit">${hitdc}</div>
      <div class="action-damage">
        <button class="${btnClass} ${dim ? 'dim' : ''}" ${useDisabled} ${dim?'':'onclick="'+btnAction+'"'}>${damage}</button>
      </div>
      <div class="action-notes">${notes}</div>
    </div>
  `;
}

function checkNoSlots(spellLevel) {
  if (!char.spellcasting_type) return true;
  const prog = progression?.find(r => r.level === char.level);
  if (!prog?.spell_slots) return true;
  const used = state.spell_slots_used || {};
  if (char.caster_progression === 'pact') {
    const pactIdx = prog.spell_slots.findIndex(n => n > 0);
    if (pactIdx < 0) return true;
    return (used[pactIdx] || 0) >= prog.spell_slots[pactIdx];
  }
  // For regular slots, find the lowest level slot >= spellLevel
  for (let l = Math.max(0, spellLevel - 1); l < 9; l++) {
    const total = prog.spell_slots[l] || 0;
    if (total > (used[l] || 0)) return false;
  }
  return true;
}

function isTrackableSpellEffect(spell) {
  const dt = String(spell?.duration_text || '').toLowerCase();
  if (!dt) return false;
  return !dt.includes('instant');
}

function durationToRounds(durationText) {
  const t = String(durationText || '').toLowerCase();
  const m = t.match(/(\d+)\s*round/);
  if (!m) return 0;
  return parseInt(m[1], 10) || 0;
}

// ── HP actions ───────────────────────────────────────────────────
function applyDmg(amt) {
  if (amt <= 0) return;
  let rem = amt, tL = 0, hL = 0, retl = false;
  if (state.hp_temp > 0) {
    tL = Math.min(state.hp_temp, rem);
    rem -= tL;
    if (state.hp_temp_source === 'agathys') {
      retl = true;
    }
    state.hp_temp -= tL;
    if (state.hp_temp === 0) {
      clearTempHp();
    }
  }
  if (rem > 0) { hL = rem; state.hp_current = Math.max(0, state.hp_current - rem); }
  const necroticHuskTriggered = tryTriggerNecroticHusk();
  let msg = `Took ${amt} damage`;
  if (tL > 0) msg += ` (${tL} to temp HP)`;
  if (hL > 0) msg += ` (${hL} to HP)`;
  if (retl) msg += ` ❄ Agathys retaliates!`;
  addLog(msg);
  if (necroticHuskTriggered) {
    const rests = state.class_resources?.necrotic_husk_recover_rests || 0;
    addLog(`☠ Necrotic Husk triggered: reduced to 1 HP. Recovery in ${rests} long rest${rests === 1 ? '' : 's'}.`);
  }
  updateHPDisplay();
}

function hasNecroticHuskFeature() {
  const cls = (char.class_name || '').toLowerCase();
  const sub = (char.subclass_name || '').toLowerCase();
  return cls === 'warlock' && sub.includes('undead') && char.level >= 10;
}

function tryTriggerNecroticHusk() {
  if (state.hp_current > 0) return false;
  if (!hasNecroticHuskFeature()) return false;
  const res = state.class_resources || {};
  if (res.necrotic_husk_spent) return false;
  const rests = Math.floor(Math.random() * 4) + 1;
  res.necrotic_husk_spent = true;
  res.necrotic_husk_recover_rests = rests;
  state.class_resources = res;
  state.hp_current = 1;
  return true;
}

function applyHeal(amt) {
  if (amt <= 0) return;
  const hpMax = char.stat_overrides?.hp_max || state.hp_current;
  const h = Math.min(amt, hpMax - state.hp_current);
  state.hp_current = Math.min(hpMax, state.hp_current + h);
  addLog(`Healed ${h} HP`);
  updateHPDisplay();
}

function doHP() {
  const v = parseInt(document.getElementById('hpDelta').value);
  if (isNaN(v) || v === 0) return;
  if (v < 0) applyDmg(Math.abs(v));
  else applyHeal(v);
  document.getElementById('hpDelta').value = '';
}

function applyHpDelta(kind) {
  const input = document.getElementById('hpDelta');
  if (!input) return;
  const v = parseInt(input.value);
  if (isNaN(v) || v <= 0) return;
  if (kind === 'damage') applyDmg(v);
  else applyHeal(v);
  input.value = '';
}

function promptSetMaxHP() {
  const v = prompt('Set max HP:');
  if (!v) return;
  const n = parseInt(v);
  if (isNaN(n) || n < 1) return;
  char.stat_overrides = char.stat_overrides || {};
  char.stat_overrides.hp_max = n;
  state.hp_current = Math.min(state.hp_current, n);
  addLog(`Max HP set to ${n}.`);
  updateHPDisplay();
}

function updateHPDisplay() {
  renderHpPanel();
  syncResourceEffects();
  renderActions();
  renderExtras();
  debouncedSaveState();
}

function toggleDS(type, idx) {
  state.death_saves = state.death_saves || { successes: 0, failures: 0 };
  const key = type === 'success' ? 'successes' : 'failures';
  state.death_saves[key] = idx + 1 === state.death_saves[key] ? idx : idx + 1;
  if (state.death_saves.failures >= 3) { addLog('💀 Three death save failures — character is dead.'); }
  if (state.death_saves.successes >= 3) { stabilize(); return; }
  debouncedSaveState();
  renderHpPanel();
  renderExtras();
}

function stabilize() {
  state.death_saves = { successes: 0, failures: 0 };
  state.hp_current = 1;
  addLog('Character stabilized at 1 HP.');
  renderHpPanel();
  renderExtras();
}

// ── Slots ────────────────────────────────────────────────────────
function toggleSlot(level, idx, total) {
  state.spell_slots_used = state.spell_slots_used || {};
  const used = state.spell_slots_used[level] || 0;
  // Toggle: if this dot is at the boundary of used/unused, toggle
  if (idx < used) {
    state.spell_slots_used[level] = idx; // restore this slot
  } else {
    state.spell_slots_used[level] = idx + 1; // spend up to this slot
  }
  debouncedSaveState();
  reRenderSlots();
}

function reRenderSlots() {
  const prog = progression?.find(r => r.level === char.level);
  if (!prog) return;
  renderExtras();
  renderSpells();
}

function toggleHitDie(idx) {
  if (!Array.isArray(state.hit_dice_used)) {
    state.hit_dice_used = Array(char.level).fill(false);
  }
  state.hit_dice_used[idx] = !state.hit_dice_used[idx];
  debouncedSaveState();
  renderExtras();
}

// ── Concentration ────────────────────────────────────────────────
function dropConc() {
  if (!state.concentration) return;
  const old = state.concentration;
  addLog(`Dropped ${old}.`);
  state.concentration = null;
  setEffectActive(old, false, '#b48c3c', 0, false, null);
  debouncedSaveState();
  renderConcBanner();
  renderExtras();
  renderActions();
  refreshSpellDamageResolution();
}

function renderConcBanner() {
  const cb = document.getElementById('concBanner');
  if (!cb) return;
  if (state.concentration) {
    cb.className = 'conc-banner';
    cb.innerHTML = `<span>👁 Concentrating: <strong>${state.concentration}</strong></span><button class="btn btn-brown btn-sm" onclick="dropConc()">Drop</button>`;
  } else {
    cb.className = 'hidden';
  }
}

// ── Effects ──────────────────────────────────────────────────────
function dismissEffect(idx) {
  const eff = state.active_effects?.[idx];
  if (!eff || eff.locked) return;
  if (eff) addLog(`Dismissed: ${eff.name}`);
  state.active_effects?.splice(idx, 1);
  const res = state.class_resources || {};
  const source = eff.source || null;
  if (source === 'form_of_dread' || eff?.name === 'Form of Dread') res.form_active = false;
  if (source === 'rage' || eff?.name === 'Raging') res.raging = false;
  if (source === 'wild_shape' || eff?.name === 'Wild Shape') res.wild_shaped = false;
  if (source === 'mage_armor' || eff?.name === 'Mage Armor') res.mage_armor_active = false;
  if (source === 'armor_of_agathys' || eff?.name === 'Armor of Agathys') {
    state.hp_temp = 0;
    state.hp_temp_source = null;
  }
  if (state.concentration && eff?.name === state.concentration) {
    state.concentration = null;
    renderConcBanner();
  }
  state.class_resources = res;
  debouncedSaveState();
  renderHpPanel();
  renderExtras();
  renderActions();
  refreshSpellDamageResolution();
  renderActionEffects();
}

function addEffect(name, durationRounds, color) {
  state.active_effects = state.active_effects || [];
  state.active_effects.push({ name, duration_rounds: durationRounds, color });
  addLog(`Effect added: ${name}`);
  renderEffects();
}

function setEffectActive(name, active, color = '#9860cc', durationRounds = 0, locked = false, source = null) {
  state.active_effects = state.active_effects || [];
  const sameName = e => String(e?.name || '').toLowerCase() === String(name || '').toLowerCase();
  state.active_effects = state.active_effects.filter((e, i, arr) => {
    if (!sameName(e)) return true;
    return arr.findIndex(x => sameName(x)) === i;
  });
  const idx = state.active_effects.findIndex(e => sameName(e));
  if (active) {
    const next = { name, duration_rounds: durationRounds, color, locked, source };
    if (idx >= 0) state.active_effects[idx] = next;
    else state.active_effects.push(next);
  } else if (idx >= 0) {
    state.active_effects = state.active_effects.filter(e => !sameName(e));
  }
  renderActionEffects();
  refreshSpellDamageResolution();
}

function syncResourceEffects() {
  const res = state.class_resources || {};
  setEffectActive('Form of Dread', !!res.form_active, '#9860cc', state.combat_active ? 10 : 0, false, 'form_of_dread');
  setEffectActive('Raging', !!res.raging, '#cc4040', state.combat_active ? 10 : 0, false, 'rage');
  setEffectActive('Wild Shape', !!res.wild_shaped, '#40cc80', 0, false, 'wild_shape');
  setEffectActive('Mage Armor', !!res.mage_armor_active, '#50a0dc', 0, false, 'mage_armor');
  setEffectActive('Armor of Agathys', state.hp_temp_source === 'agathys' && (state.hp_temp || 0) > 0, '#50a0dc', 0, false, 'armor_of_agathys');

  const hasNecroticHusk = hasNecroticHuskFeature();
  const huskSpent = !!res.necrotic_husk_spent;
  const huskRests = res.necrotic_husk_recover_rests || 0;
  setEffectActive('Necrotic Husk (Ready)', false, '#7a8aa0', 0, true, 'passive');
  setEffectActive(`Necrotic Husk (Spent: ${huskRests} LR)`, false, '#7a8aa0', 0, true, 'passive');
  if (hasNecroticHusk) {
    setEffectActive(huskSpent ? `Necrotic Husk (Spent: ${huskRests} LR)` : 'Necrotic Husk (Ready)', true, '#7a8aa0', 0, true, 'passive');
  }
}

function toggleMageArmor() {
  const res = state.class_resources || {};
  res.mage_armor_active = !res.mage_armor_active;
  state.class_resources = res;
  setEffectActive('Mage Armor', res.mage_armor_active, '#50a0dc', 0);
  addLog(res.mage_armor_active ? 'Mage Armor active (AC treated as at least 13 + DEX).' : 'Mage Armor ended.');
  debouncedSaveState();
  renderAbilityStrip();
  renderActionTopStats();
  renderExtras();
  renderActions();
}

// ── Conditions ───────────────────────────────────────────────────
function toggleCondition(k) {
  state.conditions = state.conditions || {};
  state.conditions[k] = !state.conditions[k];
  debouncedSaveState();
  renderConditions();
  renderDefensePanel();
}

function addResistance(mode, label) {
  const key = String(label || '').trim();
  if (!key) return;
  char.stat_overrides = char.stat_overrides || {};
  const listKey = mode === 'immune' ? 'immunities' : 'resistances';
  const otherKey = mode === 'immune' ? 'resistances' : 'immunities';
  const base = Array.isArray(char.stat_overrides[listKey]) ? [...char.stat_overrides[listKey]] : [];
  const other = Array.isArray(char.stat_overrides[otherKey]) ? [...char.stat_overrides[otherKey]] : [];
  if (!base.some(r => String(r).toLowerCase() === key.toLowerCase())) base.push(key);
  char.stat_overrides[listKey] = base;
  char.stat_overrides[otherKey] = other.filter(r => String(r).toLowerCase() !== key.toLowerCase());
  API.put(`/characters/${charId}`, { stat_overrides: char.stat_overrides }).catch(()=>{});
  renderDefensePanel();
  return false;
}

function removeResistance(mode, label) {
  const key = String(label || '').trim();
  if (!key) return;
  char.stat_overrides = char.stat_overrides || {};
  const listKey = mode === 'immune' ? 'immunities' : 'resistances';
  const base = Array.isArray(char.stat_overrides[listKey]) ? [...char.stat_overrides[listKey]] : [];
  char.stat_overrides[listKey] = base.filter(r => String(r).toLowerCase() !== key.toLowerCase());
  API.put(`/characters/${charId}`, { stat_overrides: char.stat_overrides }).catch(()=>{});
  renderDefensePanel();
  return false;
}

function switchResistance(mode, label) {
  const next = mode === 'immune' ? 'resist' : 'immune';
  return addResistance(next, label);
}

function toggleInspiration() {
  const res = state.class_resources || {};
  res.inspiration = !res.inspiration;
  state.class_resources = res;
  addLog(res.inspiration ? 'Inspiration gained.' : 'Inspiration spent.');
  debouncedSaveState();
  renderAbilityStrip();
}

// ── Stat overrides (click to edit) ──────────────────────────────
function editStat(key) {
  const labels = { ac: 'AC', initiative: 'Initiative', spell_dc: 'Spell DC', spell_atk: 'Spell Attack bonus' };
  const current = char.stat_overrides?.[key] ?? '';
  const v = prompt(`Override ${labels[key] || key} (leave blank to auto-calculate):`, current);
  if (v === null) return;
  char.stat_overrides = char.stat_overrides || {};
  if (v === '') {
    delete char.stat_overrides[key];
    toast(`${labels[key]} set to auto`, 'info');
  } else {
    const n = parseInt(v);
    if (isNaN(n)) return;
    char.stat_overrides[key] = n;
    toast(`${labels[key]} overridden to ${n}`, 'success');
  }
  API.put(`/characters/${charId}`, { stat_overrides: char.stat_overrides }).catch(()=>{});
  renderVitals();
  renderActionTopStats();
}

function editAbility(ab) {
  const current = char.ability_scores[ab] || 10;
  const v = prompt(`${ABILITY_FULL[ab]} score:`, current);
  if (v === null) return;
  const n = parseInt(v);
  if (isNaN(n) || n < 1 || n > 30) return;
  char.ability_scores[ab] = n;
  API.put(`/characters/${charId}`, { ability_scores: char.ability_scores }).catch(()=>{});
  renderVitals();
}

// ── Combat ────────────────────────────────────────────────────────
function startCombat() {
  state.combat_active = true;
  state.combat_round = 1;
  addLog('── Round 1 ──');
  renderCombatSection();
  debouncedSaveState();
}

function endCombat() {
  state.combat_active = false;
  state.combat_round = 0;
  addLog('Combat ended.');
  renderCombatSection();
  debouncedSaveState();
}

function nextRound() {
  state.combat_round++;
  const res = state.class_resources || {};
  // Tick effect durations
  const expired = [];
  state.active_effects = (state.active_effects || []).map(e => {
    if (e.duration_rounds > 0) {
      e.duration_rounds--;
      if (e.duration_rounds <= 0) expired.push(e.name);
    }
    return e;
  }).filter(e => e.duration_rounds !== 0);
  expired.forEach(n => addLog(`${n} expired.`));
  // Reset per-round resources
  if ((char.class_name||'').toLowerCase() === 'warlock') {
    res.bite_used = false;
  }
  if (isEffectActive('Sneak Attack')) {
    setEffectActive('Sneak Attack', false, '#cc9040', 0, false, 'sneak_attack');
    addLog('Sneak Attack toggled off (new round).');
  }
  state.class_resources = res;
  addLog(`── Round ${state.combat_round} ──`);
  renderCombatSection();
  renderEffects();
  debouncedSaveState();
}

// ── Rests ─────────────────────────────────────────────────────────
function doShortRest() {
  const cls = (char.class_name || '').toLowerCase();
  // Warlock recovers pact slots on short rest
  if (cls === 'warlock') {
    state.spell_slots_used = {};
    addLog('☽ Short rest. Pact Magic slots recovered.');
  } else {
    addLog('☽ Short rest.');
  }
  // Reset short-rest resources
  const res = state.class_resources || {};
  if (cls === 'barbarian') { delete res.raging; }
  if (cls === 'fighter') { delete res.action_surge_used; delete res.second_wind_used; }
  if (cls === 'monk') { res.ki_used = 0; }
  state.class_resources = res;
  state.combat_active = false;
  state.combat_round = 0;
  state.active_effects = [];
  state.concentration = null;
  debouncedSaveState();
  renderHpPanel();
  renderExtras();
  renderActions();
  renderSpells();
}

function doLongRest() {
  const hpMax = char.stat_overrides?.hp_max || state.hp_current;
  state.hp_current = hpMax;
  state.hp_temp = 0;
  state.hp_temp_source = null;
  state.spell_slots_used = {};
  // Recover half hit dice (rounded up)
  const hdTotal = char.level;
  const hdUsed = Array.isArray(state.hit_dice_used) ? state.hit_dice_used.filter(Boolean).length : 0;
  const hdRecover = Math.max(1, Math.floor(hdTotal / 2));
  if (Array.isArray(state.hit_dice_used)) {
    let left = hdRecover;
    for (let i = 0; i < state.hit_dice_used.length && left > 0; i++) {
      if (state.hit_dice_used[i]) { state.hit_dice_used[i] = false; left--; }
    }
  } else {
    state.hit_dice_used = Array(char.level).fill(false);
  }
  // Reset all resources with class-specific recovery windows
  const oldRes = state.class_resources || {};
  const res = {};
  if ((char.class_name||'').toLowerCase() === 'warlock') {
    res.form_uses = 0;
    if (oldRes.necrotic_husk_spent) {
      const remaining = Math.max(0, (oldRes.necrotic_husk_recover_rests || 1) - 1);
      if (remaining > 0) {
        res.necrotic_husk_spent = true;
        res.necrotic_husk_recover_rests = remaining;
      } else {
        addLog('☠ Necrotic Husk recovered and is ready again.');
      }
    }
  }
  state.class_resources = res;
  state.concentration = null;
  state.active_effects = [];
  state.combat_active = false;
  state.combat_round = 0;
  state.death_saves = { successes: 0, failures: 0 };
  addLog(`🌙 Long rest. Full HP restored. Up to ${hdRecover} hit dice recovered.`);
  debouncedSaveState();
  renderHpPanel();
  renderExtras();
  renderActions();
  renderSpells();
}

// ── Class resource actions ────────────────────────────────────────
function useEB(beams, chaMod) {
  addLog(`Eldritch Blast: ${beams} beam${beams > 1 ? 's' : ''}, each 1d10+${chaMod} force (avg ${((5.5 + chaMod) * beams).toFixed(1)})`);
}

function useBite() {
  const res = state.class_resources || {};
  if (res.bite_used) { addLog('Vampiric Bite already used this round!'); return; }
  res.bite_used = true;
  state.class_resources = res;
  const hpMax = char.stat_overrides?.hp_max || state.hp_current;
  let msg = 'Vampiric Bite: 1d4 piercing';
  if (state.hp_current <= Math.floor(hpMax / 2)) {
    const chaMod = abilityMod(char.ability_scores?.cha || 10);
    state.hp_current = Math.min(hpMax, state.hp_current + chaMod);
    msg += ` + healed ${chaMod} HP (below half)`;
  }
  addLog(msg);
  debouncedSaveState();
  renderActions();
}

function activateForm() {
  const res = state.class_resources || {};
  const fuMax = char.level >= 15 ? 4 : char.level >= 10 ? 3 : 2;
  if (res.form_active) {
    res.form_active = false;
    state.class_resources = res;
    if (state.hp_temp_source === 'form') clearTempHp();
    setEffectActive('Form of Dread', false);
    addLog('Form of Dread ended.');
    debouncedSaveState();
    renderActions();
    renderEffects();
    return;
  }
  if ((res.form_uses || 0) >= fuMax) { addLog('No Form of Dread uses remaining!'); return; }
  const rollExpr = `1d10+${char.level}`;
  const rolled = rollDiceExpressionMulti(rollExpr);
  if (!rolled) {
    toast('Failed to roll Form of Dread temp HP.', 'error');
    return;
  }
  setTempHpSource('form', rolled.total, 'Form of Dread', '#9860cc');
  res.form_active = true;
  res.form_uses = (res.form_uses || 0) + 1;
  state.class_resources = res;
  setEffectActive('Form of Dread', true, '#9860cc', state.combat_active ? 10 : 0);
  addLog(`Form of Dread! ${rollExpr} = ${rolled.total} (${rolled.breakdown.join(', ')}) temp HP, fear aura active.`);
  debouncedSaveState();
  renderHpPanel();
  renderExtras();
  renderActions();
}

function toggleRage() {
  const res = state.class_resources || {};
  const rageMax = char.level >= 20 ? 999 : char.level >= 17 ? 6 : char.level >= 13 ? 5 : char.level >= 9 ? 4 : char.level >= 6 ? 3 : 2;
  if (!res.raging) {
    if ((res.rages_used || 0) >= rageMax) { addLog('No rages remaining!'); return; }
    res.raging = true;
    res.rages_used = (res.rages_used || 0) + 1;
    setEffectActive('Raging', true, '#cc4040', state.combat_active ? 10 : 0);
    addLog('RAGE! Resistance to physical damage, bonus damage on STR attacks.');
  } else {
    res.raging = false;
    setEffectActive('Raging', false);
    addLog('Rage ended.');
  }
  state.class_resources = res;
  debouncedSaveState();
  renderActions();
}

function toggleReckless() {
  const res = state.class_resources || {};
  res.reckless = !res.reckless;
  addLog(res.reckless ? 'Reckless Attack: advantage on STR attacks this turn, attacks vs you have advantage.' : 'Reckless Attack ended.');
  state.class_resources = res;
  debouncedSaveState();
  renderActions();
}

function useSecondWind() {

  const rollExpr = `1d10+${char.level}`;
  res.second_wind_used = true;

function useActionSurge() {

}

function useIndomitable() {

function toggleSneakAttack() {

function useKi(cost) {

function useBardicInspiration() {

}

function useLayOnHands() {

function toggleWildShape() {

    if ((res.wild_shape_used||0) >= max) { addLog('No Wild Shape uses remaining!'); return; }

function useChannelDivinity() {
  const res = state.class_resources || {};
  const max = char.level >= 18 ? 3 : char.level >= 6 ? 2 : 1;
  if ((res.channel_divinity_used||0) >= max) { addLog('No Channel Divinity uses remaining!'); return; }
  res.channel_divinity_used = (res.channel_divinity_used||0) + 1;
  state.class_resources = res;
  addLog('Channel Divinity used!');
  debouncedSaveState();
  renderActions();
}

function quickCast(spellId) {
  const spell = spellsById[spellId];
  if (!spell) return;
  const noSlot = isSpellNoSlot(spell.name);
  const isAgathys = (spell.name || '').toLowerCase() === 'armor of agathys';
  if (isAgathys && state.hp_temp_source === 'agathys' && (state.hp_temp || 0) > 0) {
    clearTempHp();
    setEffectActive('Armor of Agathys', false, '#50a0dc', 0);
    addLog('Armor of Agathys ended.');
    debouncedSaveState();
    renderHpPanel();
    renderExtras();
    renderActions();
    renderSpells();
    return;
  }
  let slotSpent = false;
  let slotLevelUsed = spell.level;

  if (!noSlot && spell.level > 0) {
    const prog = progression?.find(r => r.level === char.level);
    if (!prog) return;
    const slots = prog.spell_slots || [];
    const used = state.spell_slots_used || {};

    if (char.caster_progression === 'pact') {
      const pactIdx = slots.findIndex(n => n > 0);
      if (pactIdx >= 0 && (used[pactIdx]||0) < slots[pactIdx]) {
        used[pactIdx] = (used[pactIdx]||0) + 1;
        slotSpent = true;
        slotLevelUsed = pactIdx + 1;
      }
    } else {
      for (let l = Math.max(0, spell.level - 1); l < 9; l++) {
        if ((slots[l]||0) > (used[l]||0)) {
          used[l] = (used[l]||0) + 1;
          slotSpent = true;
          slotLevelUsed = l + 1;
          break;
        }
      }
    }

    if (!slotSpent) { addLog('No spell slots available!'); return; }
    state.spell_slots_used = used;
  } else if (noSlot) {
    slotSpent = true;
  }

  if (spell.concentration) {
    if (state.concentration) {
      const old = state.concentration;
      addLog(`Dropped ${old}.`);
      setEffectActive(old, false, '#b48c3c', 0, false, null);
    }
    state.concentration = spell.name;
    renderConcBanner();
  }

  if (isAgathys) {
    const temp = 5 * Math.max(1, slotLevelUsed || spell.level || 1);
    setTempHpSource('agathys', temp, 'Armor of Agathys', '#50a0dc');
    setEffectActive('Armor of Agathys', true, '#50a0dc', 0);
    addLog(`Armor of Agathys: gained ${temp} temp HP (retaliates while temp HP remains).`);
  }

  if (isTrackableSpellEffect(spell)) {
    const rounds = durationToRounds(spell.duration_text);
    const color = spell.concentration ? '#b48c3c' : '#6080cc';
    setEffectActive(spell.name, true, color, rounds, false, `spell:${spell.id}`);
  }

  addLog(`Cast ${spell.name}! (${spell.casting_time}${spell.concentration?' · Concentration':''}${spell.ritual?' · Ritual':''})`);
  debouncedSaveState();
  renderHpPanel();
  renderExtras();
  renderActions();
  renderSpells();
}

// ── SPELLS TAB ────────────────────────────────────────────────────
function renderSpells() {
  const container = document.getElementById('panel-spells');
  if (!container) return;
  if (!char.spellcasting_type) {
    container.innerHTML = `<div class="loading-tab" style="color:var(--dim)">This character has no spellcasting.</div>`;
    return;
  }

  const knownIds = new Set([...(char.spells_known||[]), ...(char.spellbook||[])]);
  const spells = allSpells.filter(s => knownIds.has(s.id));
  const stats = getStats();

  if (!spells.length) {
    container.innerHTML = `<div class="loading-tab" style="color:var(--dim)">No spells added. <a href="/builder.html?edit=${charId}&step=4" style="color:var(--gold)">Edit spells</a> to add them.</div>`;
    return;
  }

  const prog = progression?.find(r => r.level === char.level);
  const slots = prog?.spell_slots || [];
  const used = state.spell_slots_used || {};
  const isPact = char.caster_progression === 'pact';

  const topStats = `
    <div class="spell-top-stats">
      <div class="util-tile">
        <div class="util-val">${modStr(stats.mods[char.spellcasting_ability] || 0)}</div>
        <div class="util-lbl">Modifier</div>
      </div>
      <div class="util-tile">
        <div class="util-val">${modStr(stats.spellAtk)}</div>
        <div class="util-lbl">Spell Attack</div>
      </div>
      <div class="util-tile">
        <div class="util-val">${stats.spellDC}</div>
        <div class="util-lbl">Save DC</div>
      </div>
    </div>
  `;

  // Slot tracker at top
  let slotHtml = '<div class="card"><div class="card-label">Spell Slots</div>';
  if (isPact) {
    const pactIdx = slots.findIndex(n => n > 0);
    if (pactIdx >= 0) {
      slotHtml += `<div class="slot-row"><div class="slot-row-label">Pact Magic (${ordinal(pactIdx+1)}-level)</div><div class="slot-dots">`;
      for (let i = 0; i < slots[pactIdx]; i++) {
        slotHtml += `<div class="slot-dot ${i < (used[pactIdx]||0) ? 'empty' : 'full'}" onclick="toggleSlot(${pactIdx},${i},${slots[pactIdx]})"></div>`;
      }
      slotHtml += '</div></div>';
    }
  } else {
    for (let l = 0; l < 9; l++) {
      if (!slots[l]) continue;
      slotHtml += `<div class="slot-row"><div class="slot-row-label">${ordinal(l+1)} Level</div><div class="slot-dots">`;
      for (let i = 0; i < slots[l]; i++) {
        slotHtml += `<div class="slot-dot ${i < (used[l]||0) ? 'empty' : 'full'}" onclick="toggleSlot(${l},${i},${slots[l]})"></div>`;
      }
      slotHtml += '</div></div>';
    }
  }
  slotHtml += '</div>';

  // Group spells by level
  const byLevel = {};
  for (const sp of spells) {
    if (!byLevel[sp.level]) byLevel[sp.level] = [];
    byLevel[sp.level].push(sp);
  }

  let rows = '';
  const query = (spellSearchQuery || '').trim().toLowerCase();
  for (const [lvl, levelSpells] of Object.entries(byLevel).sort((a,b) => +a[0] - +b[0])) {
    rows += `<div class="spell-level-divider">${+lvl === 0 ? 'Cantrips' : `${ordinal(+lvl)}-Level Spells`}</div>`;
    for (const sp of levelSpells.sort((a,b) => a.name.localeCompare(b.name))) {
      if (query && !String(sp.name || '').toLowerCase().includes(query)) continue;
      const detail = spellDetailsById[sp.id] || sp;
      const isHeal = isHealingSpell(sp.name);
      const spellEffect = getEffectForSpell(detail);
      const effectMeta = spellEffect?.meta || {};
      const tooltip = getSpellTooltip(detail) || effectTooltipText(spellEffect, sp.name);
      const hitdc = (effectMeta.saving_throw && effectMeta.saving_throw.length)
        ? `DC ${stats.spellDC}`
        : (effectMeta.spell_attack && effectMeta.spell_attack.length)
          ? `+${stats.spellAtk}`
          : (sp.saving_throw || sp.save || sp.saving_throw_ability)
            ? `DC ${stats.spellDC}`
            : (sp.attack_type || sp.attack_roll ? `+${stats.spellAtk}` : '—');
      const dmgFromEffect = buildDamageExpressionFromParts(isHeal ? effectHealingParts(spellEffect, stats) : effectDamageParts(spellEffect, stats));
      const baseText = toPlainEntryText(detail?.data?.entries || detail?.entries || '');
      const dmgRaw = isHeal ? (extractDamageDice(baseText) || '') : (extractDamageExpression(baseText) || '');
      const dmg = String(sp.name || '').toLowerCase() === 'hex' ? '' : (dmgFromEffect || dmgRaw);
      const displayExpr = dmg ? buildDamageExpression(sp.name, dmg, { isHealing: isHeal }) : '';
      const noteParts = [];
      const comps = formatComponents(sp.components);
      if (comps && comps !== '—') noteParts.push(comps);
      if (sp.duration_text) noteParts.push(shortDuration(sp.duration_text));
      if (sp.concentration) noteParts.push('Concentration');
      if (sp.ritual) noteParts.push('Ritual');
      const notes = buildNotesFromEffect(spellEffect, noteParts);
      rows += `
        <div class="action-row" data-action-name="${escapeAttr(sp.name)}" data-action-kind="spell" data-action-healing="${isHeal ? 'true' : 'false'}">
          <div class="action-name" data-tip="${escapeAttr(tooltip)}">${escapeHtml(sp.name)}</div>
          <div class="action-range">${escapeHtml(sp.range_text || '—')}</div>
          <div class="action-hit">${escapeHtml(hitdc)}</div>
          <div class="action-damage">
            <button class="action-dmg-btn" onclick="${dmg ? `rollDamage('${escapeAttr(sp.name)}','${escapeAttr(dmg)}',${isHeal ? 'true' : 'false'})` : `quickCast(${sp.id})`}">${escapeHtml(displayExpr || 'Cast')}</button>
          </div>
          <div class="action-notes">${escapeHtml(notes || noteParts.join(' · '))}</div>
        </div>
      `;
    }
  }

  const searchBox = `
    <div style="margin-top:8px">
      <input class="hp-input" type="text" placeholder="Search spells" value="${escapeAttr(spellSearchQuery)}" oninput="setSpellSearch(this.value)">
    </div>
  `;

  const modLabels = getActiveDamageModifierLabels();
  const modBanner = modLabels.length ? `
    <div style="margin-top:6px;font-size:11px;color:var(--dim)">Active Modifiers: ${modLabels.join(' · ')}</div>
  ` : '';

  container.innerHTML = topStats + slotHtml + searchBox + modBanner + `
    <div class="actions-table">
      <div class="action-head">
        <div>Spell</div>
        <div>Range</div>
        <div>Hit/DC</div>
        <div>Damage</div>
        <div>Notes</div>
      </div>
      <div id="spellGrid">${rows}</div>
    </div>
  `;
  const spellGrid = document.getElementById('spellGrid');
  if (spellGrid) resolveDamageForRows(spellGrid, '.action-row[data-action-kind="spell"]', ['spell'], { action_type: 'spell' });
}

function renderSpellCard(sp, noSlot, showPrepared, isPreparedNow) {
  const school = SCHOOL_NAMES[sp.school] || sp.school;
  const badges = (sp.concentration ? '<span class="conc-badge">C</span>' : '') +
                 (sp.ritual ? '<span class="ritual-badge">R</span>' : '');
  const castDisabled = (noSlot && sp.level > 0) || (showPrepared && !isPreparedNow);

  const prepDot = showPrepared && sp.level > 0 ? `
    <div class="prepared-dot ${isPreparedNow ? '' : 'empty'}" style="background:${isPreparedNow?'rgba(64,204,128,0.4)':'transparent'};border-color:${isPreparedNow?'#40cc80':'var(--border)'}" onclick="event.stopPropagation();togglePrepared(${sp.id})" title="${isPreparedNow?'Prepared':'Not prepared — click to prepare'}"></div>
  ` : '';

  const bodyId = `sc${sp.id}`;
  const isOpen = isCardOpen(bodyId);
  return `
    <div class="spell-card">
      <div class="spell-card-header" onclick="toggleSpellCard('${bodyId}')">
        ${prepDot}
        <div class="spell-card-name">${sp.name}${badges}</div>
        <div class="spell-card-meta">${sp.level === 0 ? 'Cantrip' : `${ordinal(sp.level)}`} ${school.slice(0,3)}</div>
        <button class="cast-btn" ${castDisabled ? 'disabled' : ''} onclick="event.stopPropagation();quickCast(${sp.id})" style="${sp.level === 0 ? 'display:none' : ''}">Cast</button>
      </div>
      <div class="spell-card-body ${isOpen ? 'open' : ''}" id="${bodyId}">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:11px;color:var(--dim);margin-bottom:8px">
          <div><strong style="color:var(--text)">Casting:</strong> ${sp.casting_time || '—'}</div>
          <div><strong style="color:var(--text)">Range:</strong> ${sp.range_text || '—'}</div>
          <div><strong style="color:var(--text)">Duration:</strong> ${sp.duration_text || '—'}</div>
          <div><strong style="color:var(--text)">Components:</strong> ${formatComponents(sp.components)}</div>
        </div>
        <div id="sdesc${sp.id}" style="font-size:11px;color:var(--dim)">Click to load description...</div>
      </div>
    </div>
  `;
}

function formatComponents(c) {
  if (!c) return '—';
  const parts = [];
  if (c.v) parts.push('V');
  if (c.s) parts.push('S');
  if (c.m) parts.push(`M`);
  return parts.join(', ') || '—';
}

async function toggleSpellCard(id) {
  const opened = toggleCardById(id, id);
  const body = document.getElementById(id);
  if (!body) return;
  if (opened) {
    const spellId = parseInt(id.replace('sc',''));
    const descEl = document.getElementById(`sdesc${spellId}`);
    if (descEl && descEl.textContent.includes('Click to load')) {
      try {
        const full = await API.get(`/spells/${spellId}`);
        descEl.innerHTML = renderEntries(full.data?.entries || []);
        if (full.data?.entriesHigherLevel?.[0]) {
          descEl.innerHTML += `<div style="margin-top:6px;color:#6080cc"><strong>At Higher Levels:</strong> ${renderEntries(full.data.entriesHigherLevel[0].entries || [])}</div>`;
        }
        if (full.components?.m) {
          descEl.innerHTML += `<div style="margin-top:4px;color:var(--dim);font-style:italic">Material: ${full.components.m}</div>`;
        }
      } catch(e) { descEl.textContent = 'Failed to load description.'; }
    }
  }
}

function togglePrepared(id) {
  state.prepared_spells = state.prepared_spells || [];
  const idx = state.prepared_spells.indexOf(id);
  if (idx >= 0) state.prepared_spells.splice(idx, 1);
  else state.prepared_spells.push(id);
  debouncedSaveState();
  renderSpells();
}

function setSpellSearch(val) {
  spellSearchQuery = val || '';
  renderSpells();
}

// ── FEATURES TAB ─────────────────────────────────────────────────
function renderFeatures() {
  const container = document.getElementById('panel-features');
  if (!container) return;
  let html = '';

  // Race traits
  if (char.race_id) {
    html += `<div class="feature-section-label">Racial Traits — ${char.race_name}</div>`;
    html += `<div id="raceTraitsFeatures"><div style="font-size:12px;color:var(--dim)">Loading...</div></div>`;
  }

  // Class features
  if (classFeatures.length) {
    html += `<div class="feature-section-label">Class Features — ${char.class_name}</div>`;
    html += classFeatures.map(f => renderFeatureCard(f, 'cf')).join('');
  }

  // Subclass features
  if (subFeatures.length) {
    html += `<div class="feature-section-label">Subclass Features — ${char.subclass_name}</div>`;
    html += subFeatures.map(f => renderFeatureCard(f, 'sf')).join('');
  }

  // Feats
  if ((char.feats||[]).length) {
    html += `<div class="feature-section-label">Feats</div>`;
    html += `<div id="featFeatures"><div style="font-size:12px;color:var(--dim)">Loading...</div></div>`;
  }

  const choiceGroups = extractFeatureChoiceGroups([...(classFeatures || []), ...(subFeatures || [])]);
  if (choiceGroups.length) {
    html += `<div class="feature-section-label">Class Feature Choices</div>`;
    html += `<div id="featureChoices"><div style="font-size:12px;color:var(--dim)">Loading choices...</div></div>`;
  }

  const optTypes = extractOptionalFeatureTypes([...(classFeatures || []), ...(subFeatures || [])]);
  if (optTypes.length) {
    html += `<div class="feature-section-label">Class Options</div>`;
    html += `<div id="optionalFeatures"><div style="font-size:12px;color:var(--dim)">Loading class options...</div></div>`;
  }

  if (!html) html = `<div class="loading-tab" style="color:var(--dim)">No features loaded.</div>`;
  container.innerHTML = html;

  // Async: load race traits
  if (char.race_id) {
    const renderTraits = (traits) => {
      const el = document.getElementById('raceTraitsFeatures');
      if (!el) return;
      el.innerHTML = traits.map((t, i) => {
        const bodyId = `race_trait_${char.race_id}_${i}`;
        return `
        <div class="feature-card">
          <div class="feature-header" onclick="toggleFeatureCard('${bodyId}')">
            <div class="feature-name">${t.name}</div>
          </div>
          <div class="feature-body ${isCardOpen(bodyId) ? 'open' : ''}" id="${bodyId}">${renderEntries(t.entries||[])}</div>
        </div>
      `;
      }).join('') || `<div style="font-size:12px;color:var(--dim)">No traits data available.</div>`;
    };

    if (raceTraits.length) {
      renderTraits(raceTraits);
    } else {
      API.get(`/races/${char.race_id}`).then(r => {
        raceTraits = collectNamedEntries(r?.data?.entries || []);
        renderTraits(raceTraits);
      }).catch(()=>{});
    }
  }

  // Async: load feat details
  if ((char.feats||[]).length) {
    Promise.all(char.feats.map(id => API.get(`/feats/${id}`))).then(feats => {
      const el = document.getElementById('featFeatures');
      if (!el) return;
      el.innerHTML = feats.map(f => {
        const bodyId = `feat_${f.id}`;
        return `
        <div class="feature-card">
          <div class="feature-header" onclick="toggleFeatureCard('${bodyId}')">
            <div class="feature-name">${f.name}</div>
            <div class="feature-level">${f.source}</div>
          </div>
          <div class="feature-body ${isCardOpen(bodyId) ? 'open' : ''}" id="${bodyId}">${renderEntries(f.data?.entries||[])}</div>
        </div>
      `;
      }).join('');
    }).catch(()=>{});
  }

  if (optTypes.length) {
    Promise.all(optTypes.map(t =>
      API.get(`/optional-features?featureType=${encodeURIComponent(t)}&class=${encodeURIComponent((char.class_name || '').toLowerCase())}&level=${char.level}`)
        .then(list => ({ type: t, list }))
        .catch(() => ({ type: t, list: [] }))
    )).then(groups => {
      const el = document.getElementById('optionalFeatures');
      if (!el) return;
      if (!groups.some(g => g.list.length)) {
        el.innerHTML = `<div style="font-size:12px;color:var(--dim)">No optional features available at this level.</div>`;
        return;
      }
      el.innerHTML = groups.map(g => renderOptionalTypeSection(g.type, g.list)).join('');
    }).catch(() => {});
  }

  if (choiceGroups.length) {
    const el = document.getElementById('featureChoices');
    if (el) {
      el.innerHTML = choiceGroups.map(g => renderFeatureChoiceGroup(g)).join('');
    }
  }
}

function normalizeRefText(ref) {
  const [name, source] = String(ref || '').split('|');
  return { name: (name || '').trim(), source: (source || '').trim() };
}

function getOptionalFeatureByRef(ref) {
  const r = normalizeRefText(ref);
  if (!r.name) return null;
  const key = `${r.name.toLowerCase()}|${r.source.toLowerCase()}`;
  return optionalFeaturesByRef[key] || optionalFeaturesByRef[r.name.toLowerCase()] || null;
}

function extractFeatureChoiceGroups(features) {
  const groups = [];
  for (const f of (features || [])) {
    let localIdx = 0;
    const walk = node => {
      if (!node) return;
      if (Array.isArray(node)) { node.forEach(walk); return; }
      if (typeof node !== 'object') return;
      if (node.type === 'options' && Array.isArray(node.entries)) {
        const refs = node.entries
          .filter(e => e?.type === 'refOptionalfeature' && e.optionalfeature)
          .map(e => e.optionalfeature);
        if (refs.length) {
          const opts = refs.map(getOptionalFeatureByRef).filter(Boolean);
          if (opts.length) {
            groups.push({
              id: `choice_${f.id}_${localIdx++}`,
              label: `${f.name} (Lv ${f.level})`,
              count: parseInt(node.count, 10) || 1,
              options: opts,
            });
          }
        }
      }
      if (node.entries) walk(node.entries);
      if (node.items) walk(node.items);
    };
    walk(f.entries);
  }
  return groups;
}

function renderFeatureChoiceGroup(group) {
  const selected = (featureChoiceSelections[group.id] || []).filter(Boolean);
  const selectedSet = new Set(selected);
  const selectedFeatures = group.options.filter(o => selectedSet.has(o.id));
  let html = `<div class="card"><div class="card-label">${group.label} (${selected.length}/${group.count})</div>`;

  for (let i = 0; i < group.count; i++) {
    const cur = selected[i] || '';
    html += `
      <div class="field" style="margin-bottom:8px">
        <label>Choice ${i + 1}</label>
        <select onchange="setFeatureChoice('${group.id}',${i},this.value)">
          <option value="">— Select option —</option>
          ${group.options.map(o => {
            const usedElsewhere = selected.some((id, idx) => idx !== i && id === o.id);
            return `<option value="${o.id}" ${String(cur) === String(o.id) ? 'selected' : ''} ${usedElsewhere ? 'disabled' : ''}>${o.name} (${o.source})</option>`;
          }).join('')}
        </select>
      </div>
    `;
  }

  if (selectedFeatures.length) {
    html += selectedFeatures.map(o => {
      const bodyId = `choice_opt_${group.id}_${o.id}`;
      return `
        <div class="feature-card">
          <div class="feature-header" onclick="toggleFeatureCard('${bodyId}')">
            <div class="feature-name">${o.name}</div>
            <div class="feature-level">${o.source}</div>
          </div>
          <div class="feature-body ${isCardOpen(bodyId) ? 'open' : ''}" id="${bodyId}">${renderEntries(o.entries || [])}</div>
        </div>
      `;
    }).join('');
  }

  html += `</div>`;
  return html;
}

async function setFeatureChoice(groupId, idx, value) {
  const arr = [...(featureChoiceSelections[groupId] || [])];
  const id = value ? parseInt(value, 10) : null;
  if (id && arr.some((v, i) => i !== idx && v === id)) {
    toast('That option is already selected.', 'warn');
    return;
  }
  arr[idx] = id || null;
  featureChoiceSelections[groupId] = arr.filter(Boolean);
  char.stat_overrides = char.stat_overrides || {};
  char.stat_overrides.feature_choice_selections = featureChoiceSelections;
  try {
    await API.put(`/characters/${charId}`, { stat_overrides: char.stat_overrides });
  } catch (e) {
    toast('Failed to save feature choice.', 'error');
  }
  renderFeatures();
}

function optionalTypeLabel(type) {
  const map = {
    EI: 'Eldritch Invocations',
    'FS:F': 'Fighting Style (Fighter)',
    'FS:R': 'Fighting Style (Ranger)',
  };
  return map[type] || `Options (${type})`;
}

function optionalKnownCount(type) {
  const lvlProg = progression?.find(r => r.level === char.level);
  if (!lvlProg) return null;
  const cls = (char.class_name || '').toLowerCase();
  if (type === 'EI' && cls === 'warlock') {
    return lvlProg.class_specific?.extra ?? 0;
  }
  return null;
}

function renderOptionalTypeSection(type, list) {
  const maxKnown = optionalKnownCount(type);
  const selected = (optionalFeatureSelections[type] || []).filter(id => list.some(f => f.id === id));
  const selectedSet = new Set(selected);
  const selectedFeatures = list.filter(f => selectedSet.has(f.id));

  let html = `<div class="feature-section-label" style="margin-top:8px">${optionalTypeLabel(type)}</div>`;
  if (!selectedFeatures.length) {
    html += `<div style="font-size:12px;color:var(--dim);margin-bottom:8px">No selections yet.</div>`;
  } else {
    html += selectedFeatures.map(f => {
      const bodyId = `opt_${type}_${f.id}`;
      return `
      <div class="feature-card">
        <div class="feature-header" onclick="toggleFeatureCard('${bodyId}')">
          <div class="feature-name">${f.name}</div>
          <div class="feature-level">${f.source}</div>
        </div>
        <div class="feature-body ${isCardOpen(bodyId) ? 'open' : ''}" id="${bodyId}">${renderEntries(f.entries || [])}</div>
      </div>
    `;
    }).join('');
  }

  if (maxKnown !== null) {
    const isOpen = !!optionalFeatureEditorOpen[type] || selected.length < maxKnown;
    html += `<div class="card" style="margin-top:6px"><div style="display:flex;align-items:center;justify-content:space-between"><div class="card-label" style="margin-bottom:0">Selections (${selected.length}/${maxKnown})</div><button class="btn btn-gold btn-sm" onclick="toggleOptionalFeatureEditor('${type}')">${isOpen ? 'Done' : 'Edit'}</button></div>`;
    if (isOpen) {
      html += `<div style="margin-top:8px">`;
      for (let i = 0; i < maxKnown; i++) {
        const current = selected[i] || '';
        html += `
          <div class="field" style="margin-bottom:8px">
            <label>Choice ${i + 1}</label>
            <select onchange="setOptionalFeatureChoice('${type}',${i},this.value)">
              <option value="">— Select option —</option>
              ${list.map(f => {
                const usedElsewhere = selected.some((id, idx) => idx !== i && id === f.id);
                return `<option value="${f.id}" ${String(current) === String(f.id) ? 'selected' : ''} ${usedElsewhere ? 'disabled' : ''}>${f.name} (${f.source})</option>`;
              }).join('')}
            </select>
          </div>
        `;
      }
      html += `</div>`;
    }
    html += `</div>`;
  }

  return html;
}

async function setOptionalFeatureChoice(type, idx, value) {
  const arr = [...(optionalFeatureSelections[type] || [])];
  const id = value ? parseInt(value, 10) : null;
  if (id && arr.some((v, i) => i !== idx && v === id)) {
    toast('That option is already selected.', 'warn');
    return;
  }
  arr[idx] = id || null;
  optionalFeatureSelections[type] = arr.filter(Boolean);
  char.stat_overrides = char.stat_overrides || {};
  char.stat_overrides.optional_feature_selections = optionalFeatureSelections;
  try {
    await API.put(`/characters/${charId}`, { stat_overrides: char.stat_overrides });
  } catch (e) {
    toast('Failed to save class option.', 'error');
  }
  const maxKnown = optionalKnownCount(type);
  if (maxKnown !== null && optionalFeatureSelections[type].length >= maxKnown) {
    optionalFeatureEditorOpen[type] = false;
  }
  renderFeatures();
}

function toggleOptionalFeatureEditor(type) {
  optionalFeatureEditorOpen[type] = !optionalFeatureEditorOpen[type];
  renderFeatures();
}

function extractOptionalFeatureTypes(features) {
  const types = new Set();
  const re = /Feature Type=([^}|]+)/g;

  const walk = node => {
    if (typeof node === 'string') {
      let m;
      while ((m = re.exec(node)) !== null) {
        const t = (m[1] || '').trim();
        if (t) types.add(t);
      }
      return;
    }
    if (Array.isArray(node)) {
      node.forEach(walk);
      return;
    }
    if (node && typeof node === 'object') {
      if (node.entries) walk(node.entries);
      if (node.items) walk(node.items);
      if (node.entry) walk(node.entry);
    }
  };

  for (const f of (features || [])) walk(f.entries);
  return [...types];
}

function renderFeatureCard(f, prefix) {
  const bodyId = `fc_${prefix}_${f.id}`;
  return `
    <div class="feature-card">
      <div class="feature-header" onclick="toggleFeatureCard('${bodyId}')">
        <div class="feature-name">${f.name}</div>
        <div class="feature-level">Lv ${f.level}</div>
      </div>
      <div class="feature-body ${isCardOpen(bodyId) ? 'open' : ''}" id="${bodyId}">${renderEntries(f.entries)}</div>
    </div>
  `;
}

function toggleFeatureCard(bodyId) {
  toggleCardById(bodyId, bodyId);
}

// ── INVENTORY TAB ─────────────────────────────────────────────────
function renderInventory() {
  const container = document.getElementById('panel-inventory');
  if (!container) return;

  const totalWeight = inventory.reduce((sum, item) => sum + ((item.weight || 0) * item.quantity), 0);
  const strScore = char.ability_scores?.str || 10;
  const carryCapacity = strScore * 15;

  const typeColors = { weapon:'#cc4040', armor:'#50a0dc', consumable:'#40cc80', magic:'#9860cc', tool:'#cc9040', treasure:'#e8c170', misc:'#5a5040' };

  const curr = currency;

  container.innerHTML = `
    <div class="card">
      <div class="card-label">Currency</div>
      <div class="currency-row">
        ${['cp','sp','ep','gp','pp'].map(coin => `
          <div class="currency-coin">
            <label>${coin.toUpperCase()}</label>
            <input type="number" min="0" value="${curr[coin]||0}" oninput="updateCurrency('${coin}',this.value)">
          </div>
        `).join('')}
      </div>
    </div>

    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
        <div class="card-label" style="margin-bottom:0">Inventory</div>
        <div style="display:flex;gap:8px;align-items:center">
          <span style="font-size:10px;color:var(--dim)">${totalWeight.toFixed(1)} / ${carryCapacity} lbs</span>
          <button class="btn btn-gold btn-sm" onclick="openItemModal()">+ Add Item</button>
        </div>
      </div>
      ${inventory.length ? `
        <table class="inv-table">
          <thead><tr>
            <th>Item</th><th>Qty</th><th>Wt</th><th>Value</th><th>Eq</th><th></th>
          </tr></thead>
          <tbody>
            ${inventory.map(item => `
              <tr>
                <td>
                  <div class="inv-name">${item.name}</div>
                  <span class="inv-type" style="background:${typeColors[item.item_type]||'#5a5040'}18;color:${typeColors[item.item_type]||'#5a5040'};border:1px solid ${typeColors[item.item_type]||'#5a5040'}33">${item.item_type}</span>
                  ${item.item_type === 'weapon' ? `<div style="font-size:10px;color:var(--dim);margin-top:2px">Atk ${item.weapon_atk_bonus != null ? modStr(parseInt(item.weapon_atk_bonus, 10) || 0) : '—'} · Dmg ${item.weapon_damage || '—'}</div>` : ''}
                  ${item.notes ? `<div style="font-size:10px;color:var(--dim);margin-top:2px">${item.notes}</div>` : ''}
                </td>
                <td style="text-align:center"><input type="number" min="1" value="${item.quantity}" style="width:44px;background:var(--paper);border:1px solid var(--border);border-radius:3px;color:var(--text);padding:2px 4px;font-size:12px;font-family:inherit;outline:none;text-align:center" oninput="updateItem(${item.id},'quantity',this.value)"></td>
                <td style="font-size:11px;color:var(--dim)">${item.weight ? item.weight+'lb' : '—'}</td>
                <td style="font-size:11px;color:var(--dim)">${item.value_gp != null ? item.value_gp+'gp' : '—'}</td>
                <td><div class="equipped-dot ${item.equipped ? 'on' : 'off'}" onclick="toggleEquipped(${item.id},${item.equipped})" title="${item.equipped ? 'Equipped — click to unequip' : 'Not equipped — click to equip'}"></div></td>
                <td><button class="btn btn-dim btn-sm" onclick="deleteItem(${item.id})" style="padding:2px 6px">✕</button></td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      ` : `<div style="font-size:12px;color:var(--dim);text-align:center;padding:20px">No items yet.</div>`}
    </div>
  `;
}

const debouncedSaveCurrency = debounce(async () => {
  try { await API.put(`/characters/${charId}/currency`, currency); } catch(e) {}
}, 800);

function updateCurrency(coin, val) {
  currency[coin] = parseInt(val) || 0;
  debouncedSaveCurrency();
}

async function updateItem(id, field, val) {
  const item = inventory.find(i => i.id === id);
  if (!item) return;
  item[field] = field === 'quantity' ? (parseInt(val)||1) : val;
  try { await API.put(`/characters/${charId}/inventory/${id}`, { [field]: item[field] }); } catch(e) {}
}

async function toggleEquipped(id, current) {
  const item = inventory.find(i => i.id === id);
  if (!item) return;
  item.equipped = !current;
  try { await API.put(`/characters/${charId}/inventory/${id}`, { equipped: item.equipped }); } catch(e) {}
  renderInventory();
}

async function deleteItem(id) {
  if (!confirm('Remove this item?')) return;
  try {
    await API.del(`/characters/${charId}/inventory/${id}`);
    inventory = inventory.filter(i => i.id !== id);
    renderInventory();
  } catch(e) { toast('Failed to delete item.', 'error'); }
}

function openItemModal(editId) {
  editingItemId = editId || null;
  document.getElementById('itemModalTitle').textContent = editId ? 'Edit Item' : 'Add Item';
  if (editId) {
    const item = inventory.find(i => i.id === editId);
    if (item) {
      document.getElementById('itemName').value = item.name;
      document.getElementById('itemType').value = item.item_type;
      document.getElementById('itemQty').value = item.quantity;
      document.getElementById('itemWeight').value = item.weight || '';
      document.getElementById('itemValue').value = item.value_gp ?? '';
      document.getElementById('itemNotes').value = item.notes || '';
      document.getElementById('itemWeaponDamage').value = item.weapon_damage || '';
      document.getElementById('itemWeaponAtk').value = item.weapon_atk_bonus ?? '';
      toggleWeaponFields(item.item_type);
    }
  } else {
    document.getElementById('itemName').value = '';
    document.getElementById('itemType').value = 'misc';
    document.getElementById('itemQty').value = '1';
    document.getElementById('itemWeight').value = '';
    document.getElementById('itemValue').value = '';
    document.getElementById('itemNotes').value = '';
    document.getElementById('itemWeaponDamage').value = '';
    document.getElementById('itemWeaponAtk').value = '';
    toggleWeaponFields('misc');
  }
  document.getElementById('itemModal').classList.remove('hidden');
  setTimeout(() => document.getElementById('itemName').focus(), 50);
}

function toggleWeaponFields(typeValue) {
  const fields = document.getElementById('weaponFields');
  if (!fields) return;
  fields.classList.toggle('hidden', String(typeValue || '').toLowerCase() !== 'weapon');
}

function closeItemModal() {
  document.getElementById('itemModal').classList.add('hidden');
}

async function saveItem() {
  const name = document.getElementById('itemName').value.trim();
  if (!name) { toast('Item name required.', 'error'); return; }
  const payload = {
    name,
    item_type: document.getElementById('itemType').value,
    quantity: parseInt(document.getElementById('itemQty').value) || 1,
    weight: parseFloat(document.getElementById('itemWeight').value) || null,
    value_gp: parseFloat(document.getElementById('itemValue').value) ?? null,
    notes: document.getElementById('itemNotes').value.trim(),
  };
  if (payload.item_type === 'weapon') {
    payload.weapon_damage = document.getElementById('itemWeaponDamage').value.trim() || null;
    const atkVal = document.getElementById('itemWeaponAtk').value;
    payload.weapon_atk_bonus = atkVal === '' ? null : parseInt(atkVal, 10);
  } else {
    payload.weapon_damage = null;
    payload.weapon_atk_bonus = null;
  }
  try {
    if (editingItemId) {
      const updated = await API.put(`/characters/${charId}/inventory/${editingItemId}`, payload);
      const idx = inventory.findIndex(i => i.id === editingItemId);
      if (idx >= 0) inventory[idx] = updated;
    } else {
      const item = await API.post(`/characters/${charId}/inventory`, payload);
      inventory.push(item);
    }
    closeItemModal();
    renderInventory();
    toast(editingItemId ? 'Item updated.' : 'Item added.', 'success');
  } catch(e) { toast(`Failed: ${e.message}`, 'error'); }
}

// ── NOTES TAB ────────────────────────────────────────────────────
function renderNotes() {
  const container = document.getElementById('panel-notes');
  if (!container) return;
  const fields = [
    { key: 'personality_traits', label: 'Personality Traits', rows: 3 },
    { key: 'ideals', label: 'Ideals', rows: 3 },
    { key: 'bonds', label: 'Bonds', rows: 3 },
    { key: 'flaws', label: 'Flaws', rows: 3 },
  ];

  container.innerHTML = `<div style="padding:0">` + fields.map(f => `
    <div class="card notes-field" style="margin-bottom:8px">
      <label>${f.label}</label>
      <textarea rows="${f.rows}" id="note_${f.key}" onblur="saveNote('${f.key}',this.value)">${char[f.key]||''}</textarea>
    </div>
  `).join('') + `</div>`;
}

const debouncedSaveNotes = debounce(async (key, val) => {
  char[key] = val;
  try { await API.put(`/characters/${charId}`, { [key]: val }); } catch(e) {}
}, 1000);

function saveNote(key, val) {
  debouncedSaveNotes(key, val);
}

init();
</script>
</body>
</html>
