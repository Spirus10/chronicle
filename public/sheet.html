<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Character Sheet — DND Tracker</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0a0f;--card:rgba(20,18,15,0.85);--border:#2a2520;
  --gold:#e8c170;--text:#c8bfa9;--dim:#5a5040;--dim2:#3a3428;
  --red:#8b2020;--purple:#9860cc;--blue:#50a0dc;--green:#40cc80;--pink:#cc4060;
}
body{background:var(--bg);color:var(--text);font-family:'Crimson Text','Garamond','Georgia',serif;min-height:100vh;position:relative;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 20% 50%,rgba(40,10,20,0.5) 0%,transparent 60%),radial-gradient(ellipse at 80% 20%,rgba(15,10,35,0.4) 0%,transparent 50%),radial-gradient(ellipse at 50% 80%,rgba(20,5,10,0.3) 0%,transparent 60%);pointer-events:none;z-index:0}

.wrap{max-width:760px;margin:0 auto;padding:0 0 80px;position:relative;z-index:1}

@media (min-width: 1100px) {
  .wrap{max-width:1200px}
  .tab-content{padding:16px 24px}
}

/* ── Header ── */
.sheet-header{padding:16px 16px 0;background:rgba(10,10,15,0.9);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50;backdrop-filter:blur(12px)}
.header-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.back-link{color:var(--dim);font-size:12px;letter-spacing:1px;text-decoration:none;flex-shrink:0}
.back-link:hover{color:var(--gold)}
.char-name-display{font-size:24px;font-weight:700;letter-spacing:3px;color:var(--gold);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.char-identity{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);margin-bottom:10px}

/* ── Tab bar ── */
.tab-bar{display:flex;gap:0;border-bottom:1px solid var(--border)}
.tab{flex:1;padding:8px 4px;text-align:center;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);cursor:pointer;border-bottom:2px solid transparent;transition:all 0.2s;white-space:nowrap}
.tab.active{color:var(--gold);border-bottom-color:var(--gold)}
.tab:hover:not(.active){color:var(--text)}

/* ── Tab content ── */
.tab-content{padding:12px 16px;display:none}
.tab-content.active{display:block}

/* ── Cards ── */
.card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:10px;backdrop-filter:blur(10px)}
.card-label{font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:var(--dim);margin-bottom:10px;display:flex;align-items:center;gap:6px}

/* ── Ability scores ── */
.ability-row{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:10px}
.ability-box{background:#1a1510;border:1px solid var(--border);border-radius:6px;padding:8px 4px;text-align:center;cursor:pointer;position:relative}
.ability-box:hover{border-color:rgba(232,193,112,0.3)}
.ability-score{font-size:20px;font-weight:700;color:var(--gold);line-height:1}
.ability-mod{font-size:13px;color:var(--text);margin-top:2px}
.ability-label{font-size:8px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);margin-top:3px}

/* ── Core stats row ── */
.core-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.core-stat{background:#1a1510;border:1px solid var(--border);border-radius:6px;padding:8px 4px;text-align:center}
.core-stat-val{font-size:18px;font-weight:700;color:var(--gold)}
.core-stat-lbl{font-size:8px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);margin-top:3px}
.stat-editable{cursor:pointer}
.stat-editable:hover .core-stat-val{color:#f0d090}

/* ── Saves & Skills ── */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.save-list,.skill-list-panel{list-style:none}
.save-item,.skill-item{display:flex;align-items:center;gap:6px;padding:3px 0;font-size:12px;border-bottom:1px solid rgba(42,37,32,0.4)}
.save-item:last-child,.skill-item:last-child{border-bottom:none}
.prof-dot{width:10px;height:10px;border-radius:50%;border:1px solid var(--dim2);flex-shrink:0}
.prof-dot.prof{background:rgba(232,193,112,0.4);border-color:rgba(232,193,112,0.6)}
.prof-dot.exp{background:rgba(64,204,128,0.4);border-color:rgba(64,204,128,0.6)}
.save-name,.skill-name-cell{flex:1;color:var(--text)}
.save-ability{font-size:9px;color:var(--dim);letter-spacing:1px}
.save-val,.skill-val{font-size:12px;font-weight:600;color:var(--gold);min-width:26px;text-align:right}

/* ── HP ── */
.hp-bar{width:100%;height:28px;background:#1a1510;border-radius:4px;overflow:hidden;position:relative;border:1px solid var(--border)}
.hp-fill{height:100%;position:absolute;left:0;top:0;transition:width 0.4s ease,background 0.4s ease;border-radius:3px}
.hp-temp-fill{height:100%;position:absolute;top:0;transition:all 0.4s ease;border-radius:3px}
.hp-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:13px;font-weight:600;color:var(--gold);text-shadow:0 1px 3px rgba(0,0,0,0.8);white-space:nowrap;cursor:pointer}
.hp-controls{display:flex;gap:6px;margin-top:8px;align-items:center}
.hp-input{flex:1;background:#1a1510;border:1px solid var(--border);border-radius:4px;color:var(--text);padding:6px 10px;font-size:14px;font-family:inherit;outline:none;text-align:center}
.quick-btns{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.hp-quick-split{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.hp-quick-col{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.hp-quick-col .btn{width:100%;padding:6px 0}

/* ── Buttons ── */
.btn{padding:6px 12px;border-radius:4px;font-size:12px;font-family:inherit;cursor:pointer;transition:all 0.2s;white-space:nowrap;letter-spacing:0.5px;border:1px solid}
.btn-gold{background:rgba(232,193,112,0.1);border-color:rgba(232,193,112,0.27);color:var(--gold)}
.btn-gold:hover{background:rgba(232,193,112,0.18)}
.btn-blue{background:rgba(80,160,220,0.1);border-color:rgba(80,160,220,0.27);color:var(--blue)}
.btn-red{background:rgba(139,32,32,0.1);border-color:rgba(139,32,32,0.27);color:var(--red)}
.btn-green{background:rgba(64,204,128,0.1);border-color:rgba(64,204,128,0.27);color:var(--green)}
.btn-brown{background:rgba(139,64,32,0.1);border-color:rgba(139,64,32,0.27);color:#8b4020}
.btn-dim{background:transparent;border-color:var(--border);color:var(--dim);opacity:0.4;cursor:default}
.btn-sm{padding:3px 8px;font-size:10px}

.action-btn{position:relative;overflow:visible}
.action-btn[data-tip]:hover::after{
  content:attr(data-tip);
  position:absolute;
  left:50%;
  bottom:calc(100% + 10px);
  transform:translateX(-50%);
  width:max-content;
  max-width:280px;
  white-space:normal;
  padding:8px 10px;
  border-radius:8px;
  font-size:11px;
  line-height:1.35;
  letter-spacing:0.2px;
  color:#dfd6c2;
  background:rgba(28,24,19,0.96);
  border:1px solid rgba(138,127,109,0.45);
  box-shadow:0 8px 24px rgba(0,0,0,0.45);
  z-index:300;
  pointer-events:none;
}
.action-btn[data-tip]:hover::before{
  content:'';
  position:absolute;
  left:50%;
  bottom:calc(100% + 4px);
  transform:translateX(-50%);
  border:6px solid transparent;
  border-top-color:rgba(28,24,19,0.96);
  z-index:300;
  pointer-events:none;
}

/* ── Slots ── */
.slot-dot{width:20px;height:20px;border-radius:50%;cursor:pointer;transition:all 0.2s;border:2px solid}
.slot-dot.full{border-color:var(--gold);background:rgba(232,193,112,0.2);box-shadow:0 0 8px rgba(232,193,112,0.15)}
.slot-dot.empty{border-color:var(--dim2);background:transparent}
.slot-row{display:flex;align-items:center;justify-content:space-between;padding:4px 0}
.slot-row-label{font-size:10px;letter-spacing:1px;color:var(--dim)}
.slot-dots{display:flex;gap:5px;flex-wrap:wrap}

/* ── Effects / Conditions ── */
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:12px;font-size:10px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;transition:all 0.2s;user-select:none;border:1px solid}
.effects-wrap{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}

/* ── Concentration ── */
.conc-banner{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:rgba(180,140,60,0.08);border:1px solid rgba(180,140,60,0.2);border-radius:6px;margin-bottom:8px}
.conc-banner span{font-size:12px;color:#b48c3c;letter-spacing:1px}

/* ── Wide button ── */
.wide-btn{padding:10px 14px;border-radius:6px;font-size:12px;font-family:inherit;cursor:pointer;transition:all 0.2s;text-align:left;width:100%;display:flex;align-items:center;gap:8px;letter-spacing:0.5px;border:1px solid var(--dim2);background:transparent;color:#8a7f6d}
.wide-btn:hover{border-color:rgba(232,193,112,0.2)}
.wide-btn.active{border-color:var(--purple);color:var(--purple);background:rgba(152,96,204,0.1)}
.wide-btn.active-blue{border-color:var(--blue);color:var(--blue);background:rgba(80,160,220,0.1)}
.wide-btn.active-gold{border-color:var(--gold);color:var(--gold);background:rgba(232,193,112,0.08)}
.wide-btn.dim{opacity:0.3;cursor:default}
.wide-btn .w-title{font-weight:600}
.wide-btn .w-sub{font-size:10px;opacity:0.7}

/* ── Prompt ── */
.prompt{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:6px;margin-top:6px}
.prompt input{width:70px;background:#1a1510;border-radius:4px;color:var(--text);padding:4px 8px;font-size:13px;font-family:inherit;outline:none;text-align:center;border:1px solid var(--border)}
.prompt label{font-size:11px;white-space:nowrap}

/* ── Round badge ── */
.round-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;background:rgba(232,193,112,0.08);border:1px solid var(--border);border-radius:12px;font-size:11px;color:var(--gold)}

/* ── Log ── */
.log-entry{padding:4px 0;border-bottom:1px solid #1a1815;font-size:12px;color:#7a6f5d;line-height:1.4}

/* ── Spell card ── */
.spell-card{background:#0f0d0a;border:1px solid var(--border);border-radius:6px;margin-bottom:6px;overflow:hidden}
.spell-card-header{display:flex;align-items:center;gap:8px;padding:8px 12px;cursor:pointer;transition:background 0.15s}
.spell-card-header:hover{background:rgba(255,255,255,0.02)}
.spell-card-name{font-size:13px;font-weight:600;flex:1}
.spell-card-meta{font-size:10px;color:var(--dim);text-align:right;white-space:nowrap}
.spell-card-body{padding:10px 12px;border-top:1px solid var(--dim2);display:none;font-size:12px;line-height:1.7;color:var(--text)}
.spell-card-body.open{display:block}
.spell-level-divider{font-size:9px;letter-spacing:2.5px;text-transform:uppercase;color:var(--dim2);padding:8px 0 4px;margin-top:4px}
.conc-badge{display:inline-flex;padding:1px 6px;border-radius:8px;font-size:9px;background:rgba(180,140,60,0.15);border:1px solid rgba(180,140,60,0.3);color:#b48c3c;margin-left:4px}
.ritual-badge{display:inline-flex;padding:1px 6px;border-radius:8px;font-size:9px;background:rgba(80,160,220,0.1);border:1px solid rgba(80,160,220,0.25);color:var(--blue);margin-left:4px}
.cast-btn{padding:2px 8px;border-radius:3px;font-size:10px;font-family:inherit;cursor:pointer;border:1px solid rgba(232,193,112,0.3);background:rgba(232,193,112,0.07);color:var(--gold);transition:all 0.2s}
.cast-btn:hover{background:rgba(232,193,112,0.15)}
.cast-btn:disabled{opacity:0.3;cursor:default}
.prepared-dot{width:10px;height:10px;border-radius:50%;border:1px solid;flex-shrink:0;cursor:pointer}

/* ── Features ── */
.feature-card{background:#0f0d0a;border:1px solid var(--border);border-radius:6px;margin-bottom:6px;overflow:hidden}
.feature-header{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;cursor:pointer}
.feature-header:hover{background:rgba(255,255,255,0.02)}
.feature-name{font-size:13px;font-weight:600;color:var(--text)}
.feature-level{font-size:10px;color:var(--dim);letter-spacing:1px}
.feature-body{padding:10px 12px;border-top:1px solid var(--dim2);display:none;font-size:12px;line-height:1.7;color:var(--text)}
.feature-body.open{display:block}
.feature-section-label{font-size:9px;letter-spacing:2.5px;text-transform:uppercase;color:var(--dim2);margin:14px 0 6px}

/* Entry rendering */
.entry-title{font-size:12px;font-weight:700;color:var(--gold);margin:8px 0 4px}
.entry-list{padding-left:16px;margin:4px 0}
.entry-list li{margin-bottom:3px}
.entry-table{width:100%;border-collapse:collapse;font-size:11px;margin:6px 0}
.entry-table th{text-align:left;padding:4px 6px;border-bottom:1px solid var(--border);color:var(--gold);font-size:10px;letter-spacing:1px}
.entry-table td{padding:3px 6px;border-bottom:1px solid #1a1510}
.entry-inset{border-left:2px solid var(--dim2);padding:6px 10px;margin:6px 0;font-style:italic}
.tag-condition{color:#cc8080}
.tag-skill{color:var(--blue)}

/* ── Inventory ── */
.inv-table{width:100%;border-collapse:collapse;font-size:12px}
.inv-table th{text-align:left;padding:4px 8px;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);border-bottom:1px solid var(--border)}
.inv-table td{padding:5px 8px;border-bottom:1px solid #1a1510;vertical-align:middle}
.inv-table tr:hover td{background:rgba(255,255,255,0.02)}
.inv-name{font-weight:600}
.inv-type{display:inline-flex;padding:1px 6px;border-radius:8px;font-size:9px;text-transform:uppercase;letter-spacing:0.5px}
.equipped-dot{width:8px;height:8px;border-radius:50%;display:inline-block;cursor:pointer}
.equipped-dot.on{background:var(--green)}
.equipped-dot.off{background:var(--dim2)}
.currency-row{display:flex;gap:10px;align-items:center}
.currency-coin{text-align:center;flex:1}
.currency-coin label{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);display:block;margin-bottom:4px}
.currency-coin input{width:100%;background:#1a1510;border:1px solid var(--border);border-radius:4px;color:var(--text);padding:5px;font-size:14px;font-family:inherit;outline:none;text-align:center}

/* ── Death saves ── */
.death-saves{display:flex;gap:12px;align-items:center}
.ds-group{display:flex;gap:4px;align-items:center}
.ds-dot{width:16px;height:16px;border-radius:50%;border:1px solid;cursor:pointer;transition:all 0.2s;flex-shrink:0}
.ds-dot.success.filled{background:rgba(64,204,128,0.5);border-color:var(--green)}
.ds-dot.success:not(.filled){border-color:rgba(64,204,128,0.3)}
.ds-dot.failure.filled{background:rgba(139,32,32,0.5);border-color:var(--red)}
.ds-dot.failure:not(.filled){border-color:rgba(139,32,32,0.3)}

/* ── Misc ── */
.rest-row{display:flex;gap:8px;margin-bottom:8px}
.rest-row .wide-btn{justify-content:center}
.below-half{font-size:10px;color:#cc4040;margin-top:4px;letter-spacing:1px}
.dmg-ref{font-size:12px;line-height:1.8;color:#8a7f6d}
.dmg-ref strong{color:var(--gold)}
.hidden{display:none !important}
.loading-tab{text-align:center;padding:40px;color:var(--dim);font-size:13px}

/* Notes textareas */
.notes-field{margin-bottom:12px}
.notes-field label{display:block;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);margin-bottom:5px}
.notes-field textarea{width:100%;background:#1a1510;border:1px solid var(--border);border-radius:4px;color:var(--text);padding:8px 10px;font-size:13px;font-family:inherit;outline:none;resize:vertical;line-height:1.6;min-height:80px}
.notes-field textarea:focus{border-color:rgba(232,193,112,0.3)}

/* Item modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px)}
.modal{background:#0f0d0a;border:1px solid var(--border);border-radius:10px;padding:20px;max-width:420px;width:100%}
.modal h3{font-size:15px;font-weight:700;color:var(--gold);letter-spacing:2px;margin-bottom:14px}
.modal-field{margin-bottom:10px}
.modal-field label{display:block;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--dim);margin-bottom:4px}
.modal-field input,.modal-field select,.modal-field textarea{width:100%;background:#1a1510;border:1px solid var(--border);border-radius:4px;color:var(--text);padding:7px 10px;font-size:13px;font-family:inherit;outline:none}
.modal-field textarea{resize:vertical;min-height:60px}
.modal-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
</style>
</head>
<body>
<div class="wrap">

<!-- Sticky header -->
<div class="sheet-header">
  <div class="header-top">
    <a href="/" class="back-link">← Roster</a>
    <div class="char-name-display" id="charNameDisplay">Loading...</div>
    <button class="btn btn-blue btn-sm" id="editBtn" onclick="openEditForActiveTab()">Edit</button>
    <button class="btn btn-gold btn-sm" id="saveBtn" onclick="manualSave()">Save</button>
  </div>
  <div class="char-identity" id="charIdentity"></div>
  <div class="tab-bar">
    <div class="tab active" onclick="switchTab('overview')">Overview</div>
    <div class="tab" onclick="switchTab('tracker')">Tracker</div>
    <div class="tab" onclick="switchTab('spells')">Spells</div>
    <div class="tab" onclick="switchTab('features')">Features</div>
    <div class="tab" onclick="switchTab('inventory')">Inventory</div>
    <div class="tab" onclick="switchTab('notes')">Notes</div>
  </div>
</div>

<!-- Tab: Overview -->
<div class="tab-content active" id="tab-overview">
  <div id="overviewContent"><div class="loading-tab">Loading character...</div></div>
</div>

<!-- Tab: Spells -->
<div class="tab-content" id="tab-spells">
  <div id="spellsContent"><div class="loading-tab">Loading spells...</div></div>
</div>

<!-- Tab: Tracker -->
<div class="tab-content" id="tab-tracker">
  <div id="trackerContent"><div class="loading-tab">Loading tracker...</div></div>
</div>

<!-- Tab: Features -->
<div class="tab-content" id="tab-features">
  <div id="featuresContent"><div class="loading-tab">Loading features...</div></div>
</div>

<!-- Tab: Inventory -->
<div class="tab-content" id="tab-inventory">
  <div id="inventoryContent"><div class="loading-tab">Loading inventory...</div></div>
</div>

<!-- Tab: Notes -->
<div class="tab-content" id="tab-notes">
  <div id="notesContent"></div>
</div>

<!-- Item modal -->
<div class="modal-overlay hidden" id="itemModal">
  <div class="modal">
    <h3 id="itemModalTitle">Add Item</h3>
    <div class="modal-field">
      <label>Name</label>
      <input type="text" id="itemName" placeholder="e.g. Longsword +1">
    </div>
    <div class="modal-row">
      <div class="modal-field">
        <label>Type</label>
        <select id="itemType">
          <option>misc</option>
          <option>weapon</option>
          <option>armor</option>
          <option>consumable</option>
          <option>tool</option>
          <option>treasure</option>
          <option>magic</option>
        </select>
      </div>
      <div class="modal-field">
        <label>Quantity</label>
        <input type="number" id="itemQty" min="1" value="1">
      </div>
    </div>
    <div class="modal-row">
      <div class="modal-field">
        <label>Weight (lbs)</label>
        <input type="number" id="itemWeight" min="0" step="0.5" placeholder="Optional">
      </div>
      <div class="modal-field">
        <label>Value (GP)</label>
        <input type="number" id="itemValue" min="0" step="0.01" placeholder="Optional">
      </div>
    </div>
    <div class="modal-field">
      <label>Notes (damage, magic effects, etc.)</label>
      <textarea id="itemNotes" placeholder="e.g. 1d8+3 slashing, +1 to attack rolls, requires attunement..."></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-dim" onclick="closeItemModal()">Cancel</button>
      <button class="btn btn-gold" onclick="saveItem()">Add Item</button>
    </div>
  </div>
</div>

</div>

<script src="/js/shared.js"></script>
<script>
// ── State ─────────────────────────────────────────────────────────
const charId = new URLSearchParams(location.search).get('id');
let char = null, state = null, progression = null, classFeatures = [], subFeatures = [];
let allSpells = [], spellsById = {};
let spellDetailsById = {};
let spellDetailsByName = {};
let inventory = [], currency = { cp:0, sp:0, ep:0, gp:0, pp:0 };
let activeTab = 'overview';
let editingItemId = null;
let optionalFeatureSelections = {};
let optionalFeatureEditorOpen = {};
let optionalFeaturesById = {};
let collapseState = {};
let featureChoiceSelections = {};
let allOptionalFeatures = [];
let optionalFeaturesByRef = {};

const ACTION_TOOLTIP_SPELLS = ['Mage Armor', 'Eldritch Blast'];

function tabStorageKey() {
  return `dnd.sheet.activeTab.${charId || 'unknown'}`;
}

function collapseStorageKey() {
  return `dnd.sheet.collapse.${charId || 'unknown'}`;
}

function loadCollapseState() {
  try {
    const raw = localStorage.getItem(collapseStorageKey());
    return raw ? JSON.parse(raw) : {};
  } catch (e) {
    return {};
  }
}

function saveCollapseState() {
  try {
    localStorage.setItem(collapseStorageKey(), JSON.stringify(collapseState));
  } catch (e) {}
}

function isCardOpen(key) {
  return !!collapseState[key];
}

function setCardOpen(key, open) {
  collapseState[key] = !!open;
  saveCollapseState();
}

function toggleCardById(key, id) {
  const el = document.getElementById(id);
  if (!el) return false;
  const open = !el.classList.contains('open');
  el.classList.toggle('open', open);
  setCardOpen(key, open);
  return open;
}

function loadSavedTab() {
  try {
    const t = localStorage.getItem(tabStorageKey());
    const allowed = new Set(['overview','tracker','spells','features','inventory','notes']);
    return allowed.has(t) ? t : 'overview';
  } catch (e) {
    return 'overview';
  }
}

function saveActiveTab(tab) {
  try {
    localStorage.setItem(tabStorageKey(), tab);
  } catch (e) {}
}

// ── Init ──────────────────────────────────────────────────────────
async function init() {
  if (!charId) { location.href = '/'; return; }
  try {
    [char, state, inventory, currency] = await Promise.all([
      API.get(`/characters/${charId}`),
      API.get(`/characters/${charId}/state`),
      API.get(`/characters/${charId}/inventory`),
      API.get(`/characters/${charId}/currency`),
    ]);

    // Load class data
    if (char.class_id) {
      [progression, classFeatures] = await Promise.all([
        API.get(`/classes/${char.class_id}/progression`),
        API.get(`/classes/${char.class_id}/features?level=${char.level}`),
      ]);
    }
    if (char.subclass_id && char.class_id) {
      subFeatures = await API.get(`/classes/${char.class_id}/subclasses/${char.subclass_id}/features?level=${char.level}`);
    }

    optionalFeatureSelections = char.stat_overrides?.optional_feature_selections || {};
    featureChoiceSelections = char.stat_overrides?.feature_choice_selections || {};
    collapseState = loadCollapseState();
    condPanelOpen = collapseState.cond_panel !== false;
    if (char.class_name) {
      allOptionalFeatures = await API.get('/optional-features').catch(() => []);
      optionalFeaturesByRef = {};
      optionalFeaturesById = {};
      for (const f of allOptionalFeatures) {
        optionalFeaturesById[f.id] = f;
        const key = `${(f.name || '').toLowerCase()}|${(f.source || '').toLowerCase()}`;
        optionalFeaturesByRef[key] = f;
        const nameOnly = (f.name || '').toLowerCase();
        if (!optionalFeaturesByRef[nameOnly]) optionalFeaturesByRef[nameOnly] = f;
      }
      const classOptTypes = extractOptionalFeatureTypes([...(classFeatures || []), ...(subFeatures || [])]);
      if (classOptTypes.length) {
        const groups = await Promise.all(classOptTypes.map(t =>
          API.get(`/optional-features?featureType=${encodeURIComponent(t)}&class=${encodeURIComponent((char.class_name || '').toLowerCase())}&level=${char.level}`).catch(() => [])
        ));
        groups.flat().forEach(f => { optionalFeaturesById[f.id] = f; });
      }
    }

    syncResourceEffects();

    // Load selected spells by ID so chosen spells always render
    if (char.spellcasting_type) {
      const knownIds = [...new Set([...(char.spells_known||[]), ...(char.spellbook||[])])];
      if (knownIds.length) {
        const loaded = await Promise.all(
          knownIds.map(id => API.get(`/spells/${id}`).catch(() => null))
        );
        allSpells = loaded.filter(Boolean);
        for (const s of allSpells) {
          indexSpellDetail(s);
        }
      }
    }

    await ensureActionTooltipSpellsLoaded();

    // Update header
    document.getElementById('charNameDisplay').textContent = char.name.toUpperCase();
    document.title = `${char.name} — DND Tracker`;
    const identity = [char.race_name, char.class_name, char.subclass_name ? `(${char.subclass_name})` : null, `Level ${char.level}`].filter(Boolean).join(' · ');
    document.getElementById('charIdentity').textContent = identity + (char.background_name ? ` · ${char.background_name}` : '') + (char.alignment ? ` · ${char.alignment}` : '');

    renderOverview();
    renderNotes();
    switchTab(loadSavedTab());

  } catch (err) {
    document.getElementById('overviewContent').innerHTML = `<div class="loading-tab" style="color:#cc4040">Failed to load: ${err.message}</div>`;
    console.error(err);
  }
}

// ── Tab switching ─────────────────────────────────────────────────
function switchTab(tab) {
  activeTab = tab;
  saveActiveTab(tab);
  document.querySelectorAll('.tab').forEach((t,i) => {
    const names = ['overview','tracker','spells','features','inventory','notes'];
    t.classList.toggle('active', names[i] === tab);
  });
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  document.getElementById(`tab-${tab}`).classList.add('active');

  if (tab === 'tracker' && document.getElementById('trackerContent').children[0]?.classList.contains('loading-tab')) renderTracker();
  if (tab === 'spells' && document.getElementById('spellsContent').children[0]?.classList.contains('loading-tab')) renderSpells();
  if (tab === 'features' && document.getElementById('featuresContent').children[0]?.classList.contains('loading-tab')) renderFeatures();
  if (tab === 'inventory') renderInventory();
}

function openEditForActiveTab() {
  const stepByTab = {
    overview: 3,
    tracker: 5,
    spells: 4,
    features: 2,
    inventory: 5,
    notes: 1,
  };
  const stepTarget = stepByTab[activeTab] || 1;
  location.href = `/builder.html?edit=${charId}&step=${stepTarget}`;
}

// ── Derived stats ─────────────────────────────────────────────────
function getStats() {
  const stats = calcStats({
    level: char.level,
    ability_scores: char.ability_scores,
    stat_overrides: char.stat_overrides,
    skill_proficiencies: char.skill_proficiencies,
    spellcasting_ability: char.spellcasting_ability,
    class_save_proficiencies: char.class_save_proficiencies || [],
    race_speed: char.race_speed || { walk: 30 },
  });
  if (state?.class_resources?.mage_armor_active) {
    stats.ac = Math.max(stats.ac, 13 + stats.mods.dex);
  }
  if (hasSelectedFeatureName('Defense')) {
    stats.ac += 1;
  }
  return stats;
}

function selectedOptionalFeatureIds() {
  const fromOptions = Object.values(optionalFeatureSelections || {}).flat();
  const fromChoices = Object.values(featureChoiceSelections || {}).flat();
  return [...new Set([...fromOptions, ...fromChoices].filter(Boolean).map(v => parseInt(v, 10)).filter(n => Number.isInteger(n)))];
}

function selectedOptionalFeaturesResolved() {
  const ids = selectedOptionalFeatureIds();
  return ids.map(id => optionalFeaturesById[id]).filter(Boolean);
}

function selectedFeatureNamesLower() {
  return selectedOptionalFeaturesResolved().map(f => (f.name || '').toLowerCase());
}

function hasSelectedFeatureName(name) {
  const n = (name || '').toLowerCase();
  return selectedFeatureNamesLower().includes(n);
}

// ── Save debounce ─────────────────────────────────────────────────
const debouncedSaveState = debounce(pushState, 600);

async function pushState() {
  try {
    await API.put(`/characters/${charId}/state`, {
      hp_current: state.hp_current,
      hp_temp: state.hp_temp,
      hp_temp_source: state.hp_temp_source,
      spell_slots_used: state.spell_slots_used,
      hit_dice_used: state.hit_dice_used,
      prepared_spells: state.prepared_spells,
      concentration: state.concentration,
      active_effects: state.active_effects,
      conditions: state.conditions,
      class_resources: state.class_resources,
      combat_active: state.combat_active,
      combat_round: state.combat_round,
      death_saves: state.death_saves,
      log: state.log,
    });
  } catch(e) { console.warn('State save failed:', e.message); }
}

async function manualSave() {
  const btn = document.getElementById('saveBtn');
  btn.textContent = '...';
  try {
    await pushState();
    await API.put(`/characters/${charId}`, {
      ability_scores: char.ability_scores,
      stat_overrides: char.stat_overrides,
      level: char.level,
    });
    btn.textContent = 'Saved!';
    btn.style.color = '#40cc80';
  } catch(e) { btn.textContent = 'Error'; btn.style.color = '#cc4040'; }
  setTimeout(() => { btn.textContent = 'Save'; btn.style.color = ''; }, 1500);
}

// ── LOG ───────────────────────────────────────────────────────────
function addLog(msg) {
  state.log = state.log || [];
  state.log.unshift({ m: msg, t: Date.now() });
  if (state.log.length > 60) state.log.length = 60;
  const box = document.getElementById('logBox');
  if (box) renderLogBox(box);
  debouncedSaveState();
}

function renderLogBox(box) {
  if (!state.log?.length) { box.innerHTML = '<div style="font-size:11px;color:#3a3428;font-style:italic">No actions yet...</div>'; return; }
  box.innerHTML = state.log.map((e,i) =>
    `<div class="log-entry" style="opacity:${i===0?1:Math.max(0.25,1-i*0.07)}">${e.m}</div>`
  ).join('');
}

function renderTrackerCombatStats(stats) {
  const cls = (char.class_name || '').toLowerCase();
  const names = selectedFeatureNamesLower();
  const items = [
    { label: 'AC', value: stats.ac },
    { label: 'Initiative', value: modStr(stats.initiative) },
    { label: 'Speed', value: `${stats.speed}ft` },
    { label: 'Prof Bonus', value: `+${stats.pb}` },
    { label: 'Passive Perc', value: stats.passivePerception },
  ];

  if (char.spellcasting_ability) {
    items.push({ label: 'Spell DC', value: stats.spellDC });
    items.push({ label: 'Spell Atk', value: modStr(stats.spellAtk) });
  }

  if (cls === 'monk') {
    const kiDc = 8 + stats.pb + (stats.mods.wis || 0);
    items.push({ label: 'Ki Save DC', value: kiDc });
  }
  if (cls === 'barbarian') {
    const rageDmg = char.level >= 16 ? 4 : char.level >= 9 ? 3 : 2;
    items.push({ label: 'Rage Dmg', value: `+${rageDmg}` });
  }
  if (cls === 'rogue') {
    const sneak = Math.ceil(char.level / 2);
    items.push({ label: 'Sneak Atk', value: `${sneak}d6` });
  }
  if (cls === 'warlock') {
    const bm = char.level >= 17 ? 4 : char.level >= 11 ? 3 : char.level >= 5 ? 2 : 1;
    items.push({ label: 'E.Blast Beams', value: bm });
  }

  if (names.includes('archery')) items.push({ label: 'Ranged Atk', value: '+2' });
  if (names.includes('dueling')) items.push({ label: '1H Weapon Dmg', value: '+2' });
  if (names.includes('blind fighting')) items.push({ label: 'Blindsight', value: '10ft' });

  const notes = [];
  if (names.includes('great weapon fighting')) notes.push('GWF: reroll weapon damage 1-2 (once)');
  if (names.includes('protection')) notes.push('Protection reaction available');
  if (names.includes('interception')) notes.push('Interception reaction available');

  let html = items.map(it => `
    <div class="core-stat">
      <div class="core-stat-val">${it.value}</div>
      <div class="core-stat-lbl">${it.label}</div>
    </div>
  `).join('');

  if (notes.length) {
    html += `<div class="core-stat" style="grid-column:1/-1"><div class="core-stat-val" style="font-size:12px;color:var(--text)">${notes.join(' · ')}</div><div class="core-stat-lbl">Combat Notes</div></div>`;
  }

  return html;
}

function escapeAttr(s) {
  return String(s || '')
    .replace(/&/g, '&amp;')
    .replace(/"/g, '&quot;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

function firstEntryText(entries) {
  if (!entries) return '';
  if (typeof entries === 'string') return entries;
  if (Array.isArray(entries)) {
    for (const e of entries) {
      const t = firstEntryText(e);
      if (t) return t;
    }
    return '';
  }
  if (typeof entries === 'object') {
    return firstEntryText(entries.entries || entries.entry || entries.items || '');
  }
  return '';
}

function getSpellTooltip(spell) {
  const detail = spellDetailsById[spell.id] || spell;
  let text = toPlainEntryText(detail?.data?.entries || detail?.entries || '');
  const hl = detail?.data?.entriesHigherLevel || detail?.entriesHigherLevel;
  const hlText = toPlainEntryText(hl || '');
  if (hlText) text = `${text} At Higher Levels: ${hlText}`.trim();
  if (!text) return `${spell.name}: cast this spell.`;
  return `${spell.name}: ${text}`;
}

function indexSpellDetail(spell) {
  if (!spell) return;
  if (spell.id !== undefined && spell.id !== null) {
    spellsById[spell.id] = spell;
    spellDetailsById[spell.id] = spell;
  }
  if (spell.name) {
    spellDetailsByName[String(spell.name).toLowerCase()] = spell;
  }
}

async function ensureActionTooltipSpellsLoaded() {
  for (const name of ACTION_TOOLTIP_SPELLS) {
    if (spellDetailsByName[name.toLowerCase()]) continue;
    try {
      const results = await API.get(`/spells?search=${encodeURIComponent(name)}&level=0-9`);
      const exact = (results || []).find(s => String(s.name || '').toLowerCase() === name.toLowerCase()) || results?.[0];
      if (!exact) continue;
      const detail = await API.get(`/spells/${exact.id}`).catch(() => exact);
      indexSpellDetail(detail);
    } catch (e) {}
  }
}

function toPlainEntryText(entries) {
  if (!entries) return '';
  const html = renderEntries(Array.isArray(entries) ? entries : [entries]);
  return html.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
}

function getTooltipFromFeatureNames(names) {
  const wanted = new Set((names || []).map(n => String(n).toLowerCase()));
  const pool = [
    ...(classFeatures || []),
    ...(subFeatures || []),
    ...(selectedOptionalFeaturesResolved() || []),
  ];
  const hit = pool.find(f => wanted.has(String(f.name || '').toLowerCase()));
  if (!hit) return '';
  const text = toPlainEntryText(hit.entries || hit.data?.entries || []);
  return text || '';
}

function getTooltipFromSpellName(name) {
  const target = String(name || '').toLowerCase();
  const spell = spellDetailsByName[target]
    || Object.values(spellDetailsById || {}).find(s => String(s.name || '').toLowerCase() === target)
    || (allSpells || []).find(s => String(s.name || '').toLowerCase() === target);
  if (!spell) return '';
  return getSpellTooltip(spell);
}

function getActionTooltip(key, fallbackLabel = '') {
  const map = {
    eldritch_blast: { spell: 'Eldritch Blast' },
    vampiric_bite: { features: ['Vampiric Bite'] },
    form_of_dread: { features: ['Form of Dread'] },
    mage_armor: { optional: ['Armor of Shadows'], spell: 'Mage Armor' },
    rage: { features: ['Rage'] },
    reckless_attack: { features: ['Reckless Attack'] },
    second_wind: { features: ['Second Wind'] },
    action_surge: { features: ['Action Surge'] },
    indomitable: { features: ['Indomitable'] },
    ki: { features: ['Ki'] },
    flurry_of_blows: { features: ['Ki'] },
    step_of_wind: { features: ['Ki'] },
    patient_defense: { features: ['Ki'] },
    sneak_attack: { features: ['Sneak Attack'] },
    cunning_action: { features: ['Cunning Action'] },
    sorcery_points: { features: ['Font of Magic'] },
    metamagic: { features: ['Metamagic'] },
    lay_on_hands: { features: ['Lay on Hands'] },
    divine_smite: { features: ['Divine Smite'] },
    bardic_inspiration: { features: ['Bardic Inspiration'] },
    wild_shape: { features: ['Wild Shape'] },
    channel_divinity: { features: ['Channel Divinity'] },
    protection: { optional: ['Protection'] },
    interception: { optional: ['Interception'] },
  };
  const spec = map[key] || {};
  if (spec.spell) {
    const t = getTooltipFromSpellName(spec.spell);
    if (t) return t;
  }
  const names = [...(spec.features || []), ...(spec.optional || [])];
  const fromFeatures = getTooltipFromFeatureNames(names);
  if (fromFeatures) return fromFeatures;
  return fallbackLabel;
}

function renderHPBar() {
  const fill = document.getElementById('hpFill');
  const tmpFill = document.getElementById('hpTmpFill');
  const text = document.getElementById('hpText');
  const bh = document.getElementById('belowHalf');
  if (!fill) return;

  const hp = state.hp_current;
  const tmp = state.hp_temp || 0;
  const hpMax = char.stat_overrides?.hp_max || hp + tmp; // best guess
  const pct = Math.min(100, (hp / Math.max(1, hpMax)) * 100);
  const bHalf = hp <= Math.floor(hpMax / 2);

  fill.style.width = pct + '%';
  fill.style.background = pct > 50 ? 'linear-gradient(90deg,#4a1a1a,#8b2020)' : pct > 25 ? 'linear-gradient(90deg,#4a3a1a,#8b6b20)' : 'linear-gradient(90deg,#4a1a2a,#8b2040)';

  const barTotal = hpMax + tmp;
  const hpBarPct = (hp / barTotal) * 100;
  const tmpPct = (tmp / barTotal) * 100;
  if (tmp > 0) {
    tmpFill.style.display = 'block';
    tmpFill.style.left = Math.min(100, hpBarPct) + '%';
    tmpFill.style.width = Math.min(100 - hpBarPct, tmpPct) + '%';
    const src = state.hp_temp_source;
    tmpFill.style.background = src === 'agathys' ? 'linear-gradient(90deg,rgba(80,160,220,0.5),rgba(80,160,220,0.7))' : 'linear-gradient(90deg,rgba(152,96,204,0.5),rgba(152,96,204,0.7))';
  } else {
    tmpFill.style.display = 'none';
  }

  const tc = state.hp_temp_source === 'agathys' ? '#50a0dc' : '#9860cc';
  text.innerHTML = `${hp} / ${hpMax}${tmp > 0 ? ` <span style="color:${tc}">+${tmp}</span>` : ''}`;
  if (bh) { bh.className = bHalf ? 'below-half' : 'below-half hidden'; }
}

function renderSlotSection(prog) {
  if (!prog || !char.spellcasting_type) {
    // Hit dice only
    return renderHitDiceCard();
  }
  const isPact = char.caster_progression === 'pact';
  const slots = prog.spell_slots || [];
  const used = state.spell_slots_used || {};

  let html = `<div class="card"><div class="card-label">⚡ Spell Slots</div>`;
  if (isPact) {
    const pactIdx = slots.findIndex(n => n > 0);
    if (pactIdx >= 0) {
      const total = slots[pactIdx];
      const usedCount = used[pactIdx] || 0;
      html += `<div class="slot-row"><div class="slot-row-label">Spell Slots ${total - usedCount}/${total} Level ${pactIdx + 1}</div><div class="slot-dots">`;
      for (let i = 0; i < total; i++) {
        html += `<div class="slot-dot ${i < usedCount ? 'empty' : 'full'}" onclick="toggleSlot(${pactIdx},${i},${total})"></div>`;
      }
      html += `</div></div>`;
    }
  } else {
    for (let lvl = 0; lvl < 9; lvl++) {
      const total = slots[lvl] || 0;
      if (!total) continue;
      const usedCount = used[lvl] || 0;
      html += `<div class="slot-row"><div class="slot-row-label">${ordinal(lvl+1)} Level</div><div class="slot-dots">`;
      for (let i = 0; i < total; i++) {
        html += `<div class="slot-dot ${i < usedCount ? 'empty' : 'full'}" onclick="toggleSlot(${lvl},${i},${total})"></div>`;
      }
      html += `</div></div>`;
    }
  }
  html += `</div>`;
  html += renderHitDiceCard();
  return html;
}

function renderHitDiceCard() {
  const total = char.level;
  const used = state.hit_dice_used || [];
  const usedCount = Array.isArray(used) ? used.filter(Boolean).length : 0;
  return `
    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <div class="card-label" style="margin-bottom:0">Hit Dice (d${char.hit_die || 8}) ${total - usedCount}/${total}</div>
        <div class="slot-dots">
          ${Array.from({length: Math.min(total, 20)}, (_,i) =>
            `<div class="slot-dot ${(Array.isArray(used) ? used[i] : i < usedCount) ? 'empty' : 'full'}" onclick="toggleHitDie(${i})"></div>`
          ).join('')}
        </div>
      </div>
    </div>
  `;
}

function renderCombatSection() {

  } else {

}

function renderEffects() {

function renderConditions() {
