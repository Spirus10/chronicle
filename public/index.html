<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DND Tracker — Roster</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#14111b;--card:#1c1926;--border:#3b3353;
  --gold:#b38cff;--text:#efe8ff;--dim:#a19ab3;--dim2:#5a4f70;
  --red:#c34848;--purple:#9b7bff;--blue:#4ea3ff;--green:#4fc08a;
  --ink:#f7f2ff;--paper:#241f32;--shadow:rgba(10,8,16,0.5);
}
body{background:var(--bg);color:var(--text);font-family:'Iowan Old Style','Palatino Linotype','Book Antiqua','Garamond',serif;min-height:100vh;position:relative;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 18% 28%,rgba(80,60,120,0.25) 0%,transparent 55%),radial-gradient(ellipse at 82% 12%,rgba(40,20,80,0.3) 0%,transparent 50%),linear-gradient(180deg,rgba(255,255,255,0.06),rgba(0,0,0,0));pointer-events:none;z-index:0}

.wrap{max-width:900px;margin:0 auto;padding:24px 16px 80px;position:relative;z-index:1}

/* Header */
.site-header{text-align:center;margin-bottom:40px;padding-top:20px}
.site-title{font-size:42px;font-weight:700;letter-spacing:6px;color:var(--gold);text-shadow:0 0 30px rgba(155,123,255,0.35)}
.site-sub{font-size:11px;letter-spacing:4px;text-transform:uppercase;color:var(--dim);margin-top:6px}

/* Section header */
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.section-title{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--dim)}
.account-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:16px}
.account-meta{font-size:11px;color:var(--dim);letter-spacing:1px}
.campaign-panel{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:18px;box-shadow:0 6px 18px var(--shadow)}
.campaign-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.campaign-input{flex:1;min-width:180px;background:var(--paper);border:1px solid var(--border);border-radius:4px;color:var(--text);padding:8px 10px;font-size:13px;font-family:inherit;outline:none}
.campaign-select{min-width:160px;background:var(--paper);border:1px solid var(--border);border-radius:4px;color:var(--text);padding:8px 10px;font-size:13px;font-family:inherit;outline:none}
.campaign-chip{display:inline-flex;align-items:center;gap:8px;padding:5px 8px;border-radius:999px;border:1px solid var(--border);background:var(--paper);font-size:11px;color:var(--text);margin:4px 6px 0 0}

/* Buttons */
.btn{padding:8px 16px;border-radius:4px;font-size:12px;font-family:inherit;cursor:pointer;transition:all 0.2s;white-space:nowrap;letter-spacing:0.5px;border:1px solid}
.btn-gold{background:rgba(155,123,255,0.12);border-color:rgba(155,123,255,0.35);color:var(--gold)}
.btn-gold:hover{background:rgba(155,123,255,0.2)}
.btn-red{background:rgba(139,32,32,0.1);border-color:rgba(139,32,32,0.35);color:var(--red)}
.btn-red:hover{background:rgba(139,32,32,0.2)}
.btn-dim{background:transparent;border-color:var(--border);color:var(--dim)}

/* Roster grid */
.roster-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}

/* Character card */
.char-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:20px;backdrop-filter:blur(10px);transition:border-color 0.2s,box-shadow 0.2s;position:relative;cursor:pointer;text-decoration:none;display:block;color:inherit;box-shadow:0 6px 18px var(--shadow)}
.char-card:hover{border-color:rgba(155,123,255,0.45);box-shadow:0 0 20px rgba(155,123,255,0.12)}
.char-card .card-actions{position:absolute;top:12px;right:12px;display:flex;gap:6px;opacity:0;transition:opacity 0.2s}
.char-card:hover .card-actions{opacity:1}

.char-name{font-size:22px;font-weight:700;color:var(--gold);letter-spacing:2px;margin-bottom:4px;padding-right:60px;line-height:1.2}
.char-subtitle{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);margin-bottom:14px}
.char-stats{display:flex;gap:16px;margin-bottom:12px}
.char-stat{text-align:center}
.char-stat-val{font-size:20px;font-weight:700;color:var(--gold)}
.char-stat-lbl{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--dim);margin-top:2px}
.char-hp-bar{width:100%;height:6px;background:var(--paper);border-radius:3px;overflow:hidden;margin-top:10px}
.char-hp-fill{height:100%;border-radius:3px;transition:width 0.3s}
.char-meta{font-size:10px;color:var(--dim2);margin-top:10px;letter-spacing:0.5px}

/* New character card */
.new-char-card{background:transparent;border:1px dashed var(--dim2);border-radius:10px;padding:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;cursor:pointer;transition:all 0.2s;min-height:160px;text-decoration:none}
.new-char-card:hover{border-color:rgba(155,123,255,0.45);background:rgba(155,123,255,0.06)}
.new-char-icon{font-size:28px;opacity:0.4}
.new-char-label{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--dim)}

/* Empty state */
.empty-state{text-align:center;padding:60px 20px;color:var(--dim)}
.empty-state .icon{font-size:48px;margin-bottom:16px;opacity:0.3}
.empty-state p{font-size:14px;letter-spacing:0.5px;margin-bottom:20px}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
.modal{background:var(--paper);border:1px solid var(--border);border-radius:10px;padding:24px;max-width:360px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,0.6)}
.modal h3{font-size:16px;font-weight:700;color:var(--gold);letter-spacing:2px;margin-bottom:10px}
.modal p{font-size:13px;color:var(--text);line-height:1.6;margin-bottom:20px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end}

.hidden{display:none}
.loading{text-align:center;padding:40px;color:var(--dim);font-size:13px;letter-spacing:1px}
</style>
</head>
<body>
<div class="wrap">

<div class="site-header">
  <div class="site-title">CHRONICLE</div>
  <div class="site-sub">D&amp;D 5e Character Tracker</div>
</div>

<div class="account-row">
  <div class="account-meta" id="accountMeta">Loading account...</div>
  <div>
    <a href="/dm.html" id="dmDashBtn" class="btn btn-dim hidden">DM Dashboard</a>
    <button class="btn btn-dim" onclick="logout()">Logout</button>
  </div>
</div>

<div class="campaign-panel">
  <div class="section-title">Campaigns</div>
  <div class="campaign-row">
    <input id="joinCode" class="campaign-input" placeholder="Enter join code">
    <button class="btn btn-gold" onclick="joinCampaign()">Join Campaign</button>
  </div>
  <div id="campaignStatus" class="char-meta" style="margin-top:8px"></div>
  <div id="campaignList" style="margin-top:8px"></div>
  <div class="campaign-row">
    <select id="assignChar" class="campaign-select"></select>
    <select id="assignCampaign" class="campaign-select"></select>
    <button class="btn btn-gold" onclick="attachCharacter()">Attach</button>
    <button class="btn btn-dim" onclick="detachCharacter()">Detach</button>
  </div>
</div>

<div class="section-header">
  <div class="section-title">Your Characters</div>
  <a href="/builder.html" class="btn btn-gold">+ New Character</a>
</div>

<div id="rosterGrid" class="roster-grid">
  <div class="loading">Loading roster...</div>
</div>

<!-- Delete confirmation modal -->
<div id="deleteModal" class="modal-overlay hidden">
  <div class="modal">
    <h3>Delete Character</h3>
    <p id="deleteMsg">Are you sure you want to delete this character? This cannot be undone.</p>
    <div class="modal-actions">
      <button class="btn btn-dim" onclick="closeDeleteModal()">Cancel</button>
      <button class="btn btn-red" onclick="confirmDelete()">Delete</button>
    </div>
  </div>
</div>

</div>

<script src="/js/shared.js"></script>
<script>
let deleteTarget = null;
let currentUser = null;
let joinedCampaigns = [];
let rosterChars = [];

function escapeHtml(value) {
  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/\"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

async function ensureAuth() {
  const me = await Auth.me();
  currentUser = me.user;
  if (currentUser.role === 'dm') {
    location.href = '/dm.html';
    return false;
  }
  document.getElementById('accountMeta').textContent = `Signed in as ${currentUser.username} (${currentUser.role.toUpperCase()})`;
  return true;
}

async function logout() {
  await Auth.logout();
  location.href = '/login.html';
}

async function loadCampaigns() {
  const root = document.getElementById('campaignList');
  joinedCampaigns = await API.get('/campaigns/joined').catch(() => []);
  if (!joinedCampaigns.length) {
    root.innerHTML = '<div class="char-meta">Not in a campaign yet. Ask your DM for a join code.</div>';
    return;
  }
  root.innerHTML = joinedCampaigns
    .map(c => `<span class="campaign-chip">${escapeHtml(c.name)} <strong>${escapeHtml(c.join_code)}</strong></span>`)
    .join('');
  renderAssignControls();
}

function renderAssignControls() {
  const charSel = document.getElementById('assignChar');
  const campSel = document.getElementById('assignCampaign');
  if (!charSel || !campSel) return;
  charSel.innerHTML = rosterChars.length
    ? rosterChars.map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('')
    : '<option value="">No characters</option>';
  campSel.innerHTML = joinedCampaigns.length
    ? joinedCampaigns.map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('')
    : '<option value="">No campaigns</option>';
}

async function attachCharacter() {
  const charId = document.getElementById('assignChar').value;
  const campaignId = document.getElementById('assignCampaign').value;
  const status = document.getElementById('campaignStatus');
  if (!charId || !campaignId) return;
  try {
    await API.post(`/campaigns/${campaignId}/characters/${charId}/attach`, {});
    status.textContent = 'Character attached to campaign.';
    await loadRoster();
  } catch (err) {
    status.textContent = err.message;
  }
}

async function detachCharacter() {
  const charId = document.getElementById('assignChar').value;
  const status = document.getElementById('campaignStatus');
  const target = rosterChars.find(c => String(c.id) === String(charId));
  if (!target?.campaign_id) {
    status.textContent = 'Selected character is not attached to a campaign.';
    return;
  }
  try {
    await API.post(`/campaigns/${target.campaign_id}/characters/${charId}/detach`, {});
    status.textContent = 'Character detached from campaign.';
    await loadRoster();
  } catch (err) {
    status.textContent = err.message;
  }
}

async function joinCampaign() {
  const input = document.getElementById('joinCode');
  const status = document.getElementById('campaignStatus');
  const join_code = input.value.trim();
  if (!join_code) return;
  try {
    await API.post('/campaigns/join', { join_code });
    input.value = '';
    status.textContent = 'Joined campaign.';
    await loadCampaigns();
    await loadRoster();
  } catch (err) {
    status.textContent = err.message;
  }
}

async function loadRoster() {
  const grid = document.getElementById('rosterGrid');
  try {
    const chars = await API.get('/characters');
    rosterChars = chars;
    renderAssignControls();
    if (!chars.length) {
      grid.innerHTML = `
        <div class="empty-state" style="grid-column:1/-1">
          <div class="icon">⚔</div>
          <p>No characters yet. Create your first adventurer.</p>
          <a href="/builder.html" class="btn btn-gold">+ New Character</a>
        </div>
      `;
      return;
    }

    grid.innerHTML = chars.map(c => renderCard(c)).join('') + `
      <a href="/builder.html" class="new-char-card">
        <div class="new-char-icon">+</div>
        <div class="new-char-label">New Character</div>
      </a>
    `;
  } catch (err) {
    grid.innerHTML = `<div class="loading" style="color:#cc4040">Failed to load roster: ${err.message}</div>`;
  }
}

function renderCard(c) {
  const hp = c.hp_current ?? '?';
  const hpTemp = c.hp_temp || 0;
  const hpMax = c.hp_max || null;
  const subtitle = [c.race_name, c.class_name, c.subclass_name ? `(${c.subclass_name})` : null]
    .filter(Boolean).join(' · ');
  const lvl = `Level ${c.level}`;
  const bg = c.background_name ? ` · ${c.background_name}` : '';
  const updated = c.updated_at ? new Date(c.updated_at).toLocaleDateString('en-US', {month:'short',day:'numeric',year:'numeric'}) : '';
  const campaign = joinedCampaigns.find(j => j.id === c.campaign_id);
  const safeName = escapeHtml(c.name || 'Unnamed Character');
  const safeSubtitle = escapeHtml(subtitle || 'Unknown');
  const safeLvl = escapeHtml(lvl);
  const safeBg = escapeHtml(bg);
  const safeUpdated = escapeHtml(updated);

  const hpColor = hp === '?' ? '#5a5040' : (hp <= (hpMax ?? hp) / 2 ? '#8b2020' : '#cc5555');
  const hpPct = (hp !== '?' && hpMax) ? Math.min(100, (hp / hpMax) * 100) : 100;

  return `
    <a href="/sheet.html?id=${c.id}" class="char-card">
      <div class="card-actions">
        <button class="btn btn-dim" style="padding:3px 8px;font-size:10px;border-radius:3px" onclick="event.preventDefault();openDeleteModal(${c.id},'${safeName.replace(/'/g,"\\'")}')">✕</button>
      </div>
      <div class="char-name">${safeName}</div>
      <div class="char-subtitle">${safeSubtitle} · ${safeLvl}${safeBg}</div>
      <div class="char-stats">
        <div class="char-stat">
          <div class="char-stat-val" style="color:${hpColor}">${hp}${hpMax ? `<span style="font-size:13px;color:var(--dim)">/${hpMax}</span>` : ''}${hpTemp > 0 ? `<span style="color:var(--purple);font-size:13px">+${hpTemp}</span>` : ''}</div>
          <div class="char-stat-lbl">HP</div>
        </div>
        <div class="char-stat">
          <div class="char-stat-val">${Number(c.level || 1)}</div>
          <div class="char-stat-lbl">Level</div>
        </div>
        ${c.alignment ? `<div class="char-stat"><div class="char-stat-val" style="font-size:12px;letter-spacing:1px">${escapeHtml(c.alignment.split(' ').map(w=>w[0]).join(''))}</div><div class="char-stat-lbl">Align</div></div>` : ''}
      </div>
      <div class="char-hp-bar">
        <div class="char-hp-fill" style="width:${hpPct}%;background:linear-gradient(90deg,#4a1a1a,${hpColor})"></div>
      </div>
      <div class="char-meta">Last played ${safeUpdated}</div>
      ${campaign ? `<div class="char-meta">Campaign: ${escapeHtml(campaign.name)}</div>` : ''}
    </a>
  `;
}

function openDeleteModal(id, name) {
  deleteTarget = id;
  document.getElementById('deleteMsg').textContent = `Delete "${name}"? This cannot be undone.`;
  document.getElementById('deleteModal').classList.remove('hidden');
}

function closeDeleteModal() {
  deleteTarget = null;
  document.getElementById('deleteModal').classList.add('hidden');
}

async function confirmDelete() {
  if (!deleteTarget) return;
  try {
    await API.del(`/characters/${deleteTarget}`);
    closeDeleteModal();
    await loadRoster();
    toast('Character deleted.', 'info');
  } catch (err) {
    toast(`Delete failed: ${err.message}`, 'error');
  }
}

(async function init() {
  try {
    const ok = await ensureAuth();
    if (!ok) return;
    await loadCampaigns();
    await loadRoster();
  } catch (_e) {
    location.href = '/login.html';
  }
})();
</script>
</body>
</html>
